intentions:
  # ----------------------------------------------------------------------------------
  attack:
    - next: attack
      conditions:  
        - sprite.goal
        - sprite.goal.category == constants.Goals.TARGET.value
        - sprite.layer == sprite.goal.layer
    - next: hunt
      conditions: 
        - not sprite.goal
        - sprite.memory.goals 
        - functions.any_goals(
            sprite.memory.goals, 
            constants.Goals.TARGET.value
          )
    - next: scavenge
      conditions: 
        - sprite.goal
        - sprites.get(sprite.goal.name)
        - sprite.layer == sprite.goal.layer
        - sprites.get(sprite.goal.name).mutators.triggers.dead
  # ----------------------------------------------------------------------------------
  barter:
    - next: threaten
      conditions:
        - sprite.goal 
        - sprite.goal.category == constants.Goals.LOOT.value
        - sprite.inventory.wallet < sprite.memory.prices.get(sprite.memory.goal.name)
        - sprite.psyche.motivation == constants.Motivations.SURVIVAL.value
    - next: idle
      conditions: 
        - not sprite.goal
  # ----------------------------------------------------------------------------------
  build:
    - next: idle
      conditions:
        - not sprite.goal
  # ----------------------------------------------------------------------------------
  escape: 
    - next: escape
      conditions: 
        - sprite.goal
        - sprites.get(sprite.goal.name)
        - sprites.get(sprite.goal.name).intention == constants.Intentions.ATTACK.value
    - next: return
      conditions: 
        - not sprite.goal
  # ----------------------------------------------------------------------------------
  find:
    - next: interact
      conditions: 
        - sprite.goal
        - sprite.goal.category == constants.Goals.OBJECT.value
        - sprite.layer == sprite.goal.layer
        - functions.is_near(
            sprite.position, 
            sprite.goal.position, 
            sprite.mutators.parameters.action.radius
          )
    - next: speak
      conditions: 
        - sprite.goal
        - sprite.psyche.dialogue
        - sprite.goal.category == constants.Goals.SUBJECT.value
        - sprite.layer == sprite.goal.layer
        - sprites.get(sprite.goal.name)
        - sprite.memory.relationships.get(sprite.goal.name)
        - sprite.memory.relationships[sprite.goal.name] in [
            constants.Relationships.FRIEND.value, 
            constants.Relationships.FAMILY.value
          ]
        - functions.is_near(
            sprite.position, 
            sprites.get(sprite.goal.name).position, 
            sprite.mutators.parameters.action.radius
          )
    - next: idle
      conditions:
        - not sprite.goal
  # ----------------------------------------------------------------------------------
  follow: 
    - next: speak
      conditions:
        - sprite.goal
        - sprite.psyche.dialogue
        - sprite.layer == sprite.goal.layer
        - functions.is_near(
            sprite.position, 
            sprite.goal.position, 
            sprite.mutators.parameters.action.radius
          )
    - next: idle
      conditions:
        - not sprite.goal
  # ----------------------------------------------------------------------------------
  hunt: 
    - next: attack
      conditions: 
        - sprite.goal
        - sprite.goal.category == constants.Goals.TARGET.value
        - sprite.layer == sprite.goal.layer
        - functions.is_near(
            sprite.position, 
            sprite.goal.position, 
            sprite.mutators.parameters.action.radius
          )
    - next: idle
      conditions:
        - not sprite.goal
  # ----------------------------------------------------------------------------------
  idle: 
    - next: wander
      conditions:
        - sprite.goal
        - sprite.goal.category == constants.Goals.POSITION.value
        - sprite.layer == sprite.goal.layer
    - next: find
      conditions: 
        - sprite.goal
        - sprite.goal.category == constants.Goals.SUBJECT.value
        - sprite.layer == sprite.goal.layer
        - sprites.get(sprite.goal.name)
        - not functions.is_near(
            sprite.position, 
            sprites.get(sprite.goal.name).position, 
            sprite.mutators.parameters.action.radius
          )
    - next: find
      conditions: 
        - sprite.goal
        - sprite.goal.category == constants.Goals.OBJECT.value
        - sprite.layer == sprite.goal.layer
        - not functions.is_near(
            sprite.position, 
            sprite.goal.position, 
            sprite.mutators.parameters.action.radius
          )
    - next: hunt
      conditions:
        - sprite.goal
        - sprite.goal.category == constants.Goals.TARGET.value
        - sprite.layer == sprite.goal.layer
    - next: wander
      conditions:
        - not sprite.goal
  # ----------------------------------------------------------------------------------
  interact:
    - next: idle
      conditions: 
        - not sprite.goal
  # ----------------------------------------------------------------------------------
  mine:
    - next: build
      conditions:
        - sprite.goal
        - sprite.goal.category == constants.Goals.LOOT.value
    - next: mine
      conditions:
        - sprite.goal
        - sprite.goal.category == constants.Goals.LOOT.value
    - next: idle
      conditions:
        - not sprite.goal
  # ----------------------------------------------------------------------------------
  mock:
    - next: threaten
      conditions:
        - sprite.goal
        - sprite.goal.category == constants.Goals.TARGET.value
        - sprites.get(sprite.goal.name)
        - sprites.get(sprite.goal.name).intention == constants.Intentions.ATTACK.value
    - next: idle
      conditions:
        - not sprite.goal
  # ----------------------------------------------------------------------------------
  return:
    - next: idle
      conditions: 
        - not sprite.goal
  # ----------------------------------------------------------------------------------
  scavenge:
    - next: idle
      conditions:
        - not sprite.goal
  # ----------------------------------------------------------------------------------
  speak:
    - next: idle
      conditions:
        - sprite.goal
        - sprite.goal.name == constants.RequiredAssets.PLAYER.value
    - next: idle
      conditions:
        - not sprite.psyche.expression
  # ----------------------------------------------------------------------------------
  sprint:
    - next: idle
      conditions:
        - not sprite.goal
  # ----------------------------------------------------------------------------------
  threaten:
    - next: attack
      conditions:
        - sprite.goal
        - sprite.goal.category == constants.Goals.TARGET.value
        - sprite.layer == sprite.goal.layer
        - functions.is_near(
            sprite.position, 
            sprite.goal.position, 
            sprite.mutators.parameters.action.radius
          )
    - next: hunt
      conditions:
        - sprite.goal
        - sprite.goal.category == constants.Goals.TARGET.value
        - sprite.layer == sprite.goal.layer
        - not functions.is_near(
            sprite.position, 
            sprite.goal.position, 
            sprite.mutators.parameters.action.radius
          )
    - next: idle
      conditions:
        - not sprite.goal
  # ----------------------------------------------------------------------------------
  wander:
    - next: hunt
      conditions:
        - sprite.goal
        - functions.any_memories_visible(
            sprite,
            sprites,
            [ constants.Goals.TARGET.value ], 
          )
    - next: find
      conditions:
        - sprite.goal
        - functions.any_memories_visible(
            sprite,
            sprites,
            [ constants.Goals.SUBJECT.value ], 
          )
    - next: idle
      conditions:
        - sprite.goal
        - sprite.goal.category != constants.Goals.POSITION.value
    - next: idle
      conditions:
        - not sprite.goal