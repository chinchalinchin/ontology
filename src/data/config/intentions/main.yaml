intentions:
  # ----------------------------------------------------------------------------------
  attack:
    - next: attack
      conditions:  
        - sprite.goal
        - sprite.goal.category == constants.Goals.TARGET.value
    - next: hunt
      conditions: 
        - not sprite.goal
        - sprite.memory.goal 
        - sprite.memory.goal.category == constants.Goals.TARGET.value
    - next: scavenge
      conditions: 
        - sprites.get(sprite.goal.name)
        - sprites.get(sprite.goal.name).mutators.triggers.dead
  # ----------------------------------------------------------------------------------
  barter:
    - next: threaten
      conditions:
        - sprite.goal 
        - sprite.goal.category == constants.Goals.LOOT.value
        - sprite.inventory.wallet < sprite.memory.prices.get(sprite.memory.goal.name)
        - sprite.psyche.motivation == constants.Motivations.SURVIVAL.value
    - next: idle
      conditions: 
        - not sprite.goal
  # ----------------------------------------------------------------------------------
  build:
    - next: idle
      conditions:
        - not sprite.goal
  # ----------------------------------------------------------------------------------
  escape: 
    - next: escape
      conditions: 
        - sprite.goal
        - sprites.get(sprite.goal.name)
        - sprites.get(sprite.goal.name).state.intention == constants.Intentions.ATTACK.value
    - next: return
      conditions: 
        - not sprite.goal
  # ----------------------------------------------------------------------------------
  find: 
    - next: interact
      conditions: 
        - sprite.goal
        - sprite.goal.category == constants.Goals.OBJECT.value
        - functions.is_near(sprite.position, sprite.goal.position, sprite.mutators.parameters.action.radius)
    - next: speak
      conditions: 
        - sprite.goal
        - sprite.psyche.dialogue
        - sprite.goal.category == constants.Goals.SUBJECT.value
        - sprite.memory.relationships.get(sprite.goal.name)
        - sprite.memory.relationships[sprite.goal.name] in [
            constants.Relationships.FRIEND.value, 
            constants.Relationships.FAMILY.value
          ]
        - functions.is_near(sprite.position, sprite.goal.position, sprite.mutators.parameters.action.radius)
  # ----------------------------------------------------------------------------------
  follow: 
    - next: speak
      conditions:
        - sprite.goal
        - sprite.psyche.dialogue
        - functions.is_near(sprite.position, sprite.goal.position, sprite.mutators.parameters.vision.radius)
    - next: idle
      conditions:
        - not sprite.goal
  # ----------------------------------------------------------------------------------
  hunt: 
    - next: attack
      conditions: 
        - sprite.goal
        - sprite.goal.category == constants.Goals.TARGET.value
        - functions.is_near(sprite.position, sprite.goal.position, sprite.mutators.parameters.vision.radius)
    - next: idle
      conditions:
        - not sprite.goal
  # ----------------------------------------------------------------------------------
  idle: 
    - next: wander
      conditions:
        - sprite.goal
        - sprite.goal.category == constants.Goals.POSITION.value
    - next: find
      conditions: 
        - sprite.goal
        - sprite.goal.category == constants.Goals.SUBJECT.value
        - not functions.is_near(sprite.position, sprite.goal.position, sprite.mutators.parameters.action.radius)
    - next: idle
      conditions:
        - not sprite.goal
  # ----------------------------------------------------------------------------------
  interact:
    - next: idle
      conditions: 
        - not sprite.goal
  # ----------------------------------------------------------------------------------
  mine:
    - next: build
      conditions:
        - sprite.goal
        - sprite.goal.category == constants.Goals.LOOT.value
        # TODO: figure out how to resolve boundary
        # - sprite.inventory.loot.get(sprite.goal.name, 0) >= 10 
    - next: mine
      conditions:
        - sprite.goal
        - sprite.goal.category == constants.Goals.LOOT.value
        # TODO: figure out how to resolve boundary
        # - sprite.goal.name in constants.MineableAssets
        # - sprite.inventory.loot.get(sprite.goal.name, 0) < 10
    - next: idle
      conditions:
        - not sprite.goal
  # ----------------------------------------------------------------------------------
  mock:
    - next: threaten
      conditions:
        - sprite.goal
        - sprite.goal.category == constants.Goals.TARGET.value
        - sprites.get(sprite.goal.name)
        - sprites.get(sprite.goal.name).state.intention == constants.Intentions.ATTACK.value
    - next: idle
      conditions:
        - not sprite.goal
  # ----------------------------------------------------------------------------------
  return:
    - next: idle
      conditions: 
        - not sprite.goal
  # ----------------------------------------------------------------------------------
  scavenge:
    - next: idle
      conditions:
        - not sprite.goal
  # ----------------------------------------------------------------------------------
  speak:
    - next: idle
      conditions:
        - sprite.goal
        - sprite.goal.name == 'player'
    - next: idle
      conditions:
        - not sprite.psyche.dialogue
  # ----------------------------------------------------------------------------------
  sprint:
    - next: idle
      conditions:
        - not sprite.goal
  # ----------------------------------------------------------------------------------
  threaten:
    - next: attack
      conditions:
        - sprite.goal
        - sprite.goal.category == constants.Goals.SPRITE.value
        - functions.is_near(sprite.position, sprite.goal.position, sprite.mutators.parameters.vision.radius)
    - next: hunt
      conditions:
        - sprite.goal.category == constants.Goals.SPRITE.value
        - not functions.is_near(sprite.position, sprite.goal.position, sprite.mutators.parameters.vision.radius)
    - next: idle
      conditions:
        - not sprite.goal
  # ----------------------------------------------------------------------------------
  wander:
    - next: idle
      conditions:
        - not sprite.goal