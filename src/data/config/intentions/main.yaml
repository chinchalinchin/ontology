intentions:
  attack:
    - next: attack
      conditions:  
        - sprite.goal.category == constants.Goals.SPRITE.value
    - next: hunt
      conditions: 
        - not sprite.goal
        - sprite.memory.goal and sprite.memory.goal.category == constants.Goals.SPRITE.value
    - next: scavenge
      conditions: 
        - sprites.get(sprite.goal.name).mutators.triggers.dead
  attract:
    - next: barter
      conditions:
        - sprite.inventory.loot
        - sprite.psyche.motivation == constants.Motivations.PROFIT.value
    - next: speak
      conditions: 
        - sprite.psyche.dialogue
  barter:
    - next: threaten
      conditions:
        - sprite.memory.goal and sprite.memory.goal.category == constants.Goals.LOOT.value
        - sprite.inventory.wallet < sprite.memory.prices.get(sprite.memory.goal.name, 9999)
        - sprite.psyche.motivation == constants.Motivations.SURVIVAL.value
    - next: idle
      conditions: 
        - not sprite.goal
  build:
    - next: idle
      conditions:
        - not sprite.goal
  escape: 
    - next: escape
      conditions: 
        - sprites.get(sprite.goal.name)
        - sprites.get(sprite.goal.name).state.intention == constants.Intentions.ATTACK.value
    - next: return
      conditions: 
        - not sprite.goal
  find: 
    - next: scavenge
      conditions: 
        - sprite.goal.category == constants.Goals.LOOT.value
        - functions.is_near(sprite.position, sprite.goal.position, 15)
    - next: interact
      conditions: 
        - sprite.goal.category == constants.Goals.ASSET.value
        - functions.is_near(sprite.position, sprite.goal.position, 15)
    - next: speak
      conditions: 
        - sprite.goal.category == constants.Goals.SPRITE.value
        - sprite.psyche.dialogue
        - functions.is_near(sprite.position, sprite.goal.position, 20)
    - next: return
      conditions:
        - not sprite.goal
  follow: 
    - next: follow
      conditions:
        - sprite.goal.category == constants.Goals.SPRITE.value
        - not functions.is_near(sprite.position, sprite.goal.position, 40)
    - next: speak
      conditions:
        - sprite.psyche.dialogue
        - functions.is_near(sprite.position, sprite.goal.position, 20)
    - next: wander
      conditions:
        - not sprite.goal
  hunt: 
    - next: attack
      conditions: 
        - sprite.goal.category == constants.Goals.SPRITE.value
        - functions.is_near(sprite.position, sprite.goal.position, 25)
    - next: return
      conditions:
        - not sprite.goal
  idle: 
    - next: wander
      conditions:
        - sprite.goal
        - sprite.goal.category == constants.Goals.POSITION.value
    - next: idle
      conditions:
        - not sprite.goal
  interact:
    - next: idle
      conditions: 
        - not sprite.goal
  mine:
    - next: build
      conditions:
        - sprite.goal.category == constants.Goals.LOOT.value
        - sprite.inventory.loot.get(sprite.goal.name, 0) >= 10 
    - next: mine
      conditions:
        - sprite.goal.category == constants.Goals.LOOT.value
        - sprite.goal.name in constants.MineableAssets
        - sprite.inventory.loot.get(sprite.goal.name, 0) < 10
    - next: idle
      conditions:
        - not sprite.goal
  mock:
    - next: threaten
      conditions:
        - sprite.goal.category == constants.Goals.SPRITE.value
        - sprites.get(sprite.goal.name)
        - sprites.get(sprite.goal.name).state.intention == constants.Intentions.ATTACK.value
    - next: idle
      conditions:
        - not sprite.goal
  return:
    - next: idle
      conditions: 
        - not sprite.goal
    - next: return
      conditions:
        - sprite.goal
        - not functions.is_near(sprite.position, sprite.goal.position, 10)
  scavenge:
    - next: idle
      conditions:
        - not sprite.goal
  speak:
    - next: follow
      conditions: 
        - sprite.goal.category == constants.Goals.SPRITE.value
        - not functions.is_near(sprite.position, sprite.goal.position, 20)
    - next: idle
      conditions:
        - not sprite.psyche.dialogue
  sprint:
    - next: return
      conditions: 
        - not sprite.goal
    - next: idle
      conditions:
        - sprite.meters.health.current < 10
  threaten:
    - next: attack
      conditions:
        - sprite.goal.category == constants.Goals.SPRITE.value
        - functions.is_near(sprite.position, sprite.goal.position, 25)
    - next: hunt
      conditions:
        - sprite.goal.category == constants.Goals.SPRITE.value
        - not functions.is_near(sprite.position, sprite.goal.position, 25)
    - next: idle
      conditions:
        - not sprite.goal
  wander:
    - next: idle
      conditions:
        - not sprite.goal