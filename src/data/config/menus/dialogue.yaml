menus:
  dialogue:
    controller: scroll
    roots: 
      - id: neutral
        name: dialogue-menu
        position:
          # 480 x 480
          px: 0.175
          py: 0.60
        layout: dock
        alignment: center
        gap: 15
        children:
          - id: transparent-slot 
            name: portrait-slot-container
            layout: overlay
            alignment: center
            gap: 0
            children:
              - instance: buttons
                id: slot
                name: portrait-slot
                status: disabled
              - instance: icons
                id: portraits 
                name: character-portrait-icon
                bind:
                  schema: icon
                  target: 
                    icon: context.sprite.character.portrait
          - instance: pages
            id: notification
            name: character-speech
            bind:
              schema: library
              target:
                plot: context.plot.current
                persona: context.sprite.psyche.persona
                lexicon: context.sprite.psyche.dialogue
          # Use the 40x40 slot to constrain horizontal width
          - id: transparent-slot
            name: text-scroll-buttons
            layout: stack
            alignment: center
            gap: 5
            children:
              - instance: buttons
                id: arrow-up
                name: text-scroll-up
                bind: 
                  schema: select
                  target:
                    selection: scrollup
                    selector: character-speech
              - instance: buttons
                id: arrow-down
                name: text-scroll-down
                bind: 
                  schema: select
                  target:
                    selection: scrolldown
                    selector: character-speech