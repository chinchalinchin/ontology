menus:
  dialogue:
    controller: scroll
    roots: 
      - instance: panes
        id: neutral-small
        name: dialogue-menu
        parameters:
          position:
            # 480 x 480
            px: 0.175
            py: 0.60
          layout: dock
          font: dialogue
          alignment: center
          gap: 5
          margin: 10
          children:
            # ------------------------------- PORTRAIT DISPLAY
            - instance: panes
              id: transparent-block 
              name: character-portrait-container
              parameters:
                layout: overlay
                alignment: start
                gap: 0
                children:
                  - instance: pages
                    id: dark-portrait
                    name: character-portrait-bg
                  - instance: icons
                    id: portraits
                    name: character-portrait-icon
                    bind:
                      schema: icon
                      target: 
                        icon: context.sprite.psyche.persona
            # ------------------------------- DIALOGUE DISPLAY
            - instance: pages
              id: dark-notification
              name: character-speech
              bind:
                schema: library
                target:
                  plot: context.plot.current
                  persona: context.sprite.psyche.persona
                  lexicon: context.sprite.psyche.dialogue
            # ------------------------------- CONTROL DISPLAY
            - id: transparent-slot
              name: text-scroll-buttons
              instance: panes
              parameters:
                layout: stack
                alignment: center
                gap: 5
                children:
                  - instance: buttons
                    id: arrow-up
                    name: text-scroll-up
                    bind: 
                      schema: select
                      target:
                        selection: scrollup
                        selector: character-speech
                  - instance: buttons
                    id: arrow-down
                    name: text-scroll-down
                    bind: 
                      schema: select
                      target:
                        selection: scrolldown
                        selector: character-speech