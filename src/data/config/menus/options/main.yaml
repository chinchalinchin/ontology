# ---------------------------------------------------------------------
themes:
  colors:
    pane: &pane dark-solid
    pane-alt: &pane-alt dark-texture
  alignments:
    center: &center
      horizontal: center
      vertical: center
  dimensions:
    root: &root
      pw: 0.85
      pl: 0.60
    child: &child
      pw: 0.40
      pl: 0.50
    slot: &slot
      pw: 0.30
      pl: 0.06
    sidebar: &sidebar
      pw: 0.35
      pl: 0.40
# ---------------------------------------------------------------------
menus:
  options:
    controller: options
    roots:
      - instance: panes
        id: transparent
        name: options-menu
        parameters:
          dimensions: *root
          justification: *center
          alignment: *center
          layout: dock
          font: menu
          gap: 10
          margins: 5
          children:
            # ---------------------------------------------------------
            # ------------------------------------------ OPTION BUTTONS
            # ---------------------------------------------------------
            - instance: panes
              id: *pane
              name: options-button-pane
              parameters:
                dimensions: *child
                layout: stack
                font: menu
                alignment: *center
                gap: 8
                children:
                  - instance: panes 
                    id: transparent
                    name: option-1-slot
                    parameters:
                      dimensions: *slot
                      layout: overlay
                      alignment: *center
                      children:
                        - instance: buttons
                          id: label
                          name: option-1
                          bind:
                            schema: select
                            target:
                              selection: select
                              selector: options-display
                        - instance: panes
                          id: transparent
                          name: option-1-text
                          parameters:
                            dimensions: *slot
                          bind:
                            schema: text
                            target:
                              content: OPTION 1

                  - instance: panes
                    id: transparent
                    name: option-2-slot
                    parameters:
                      dimensions: *slot
                      layout: overlay
                      alignment: *center
                      children:
                        - instance: buttons
                          id: label
                          name: option-2
                          bind:
                            schema: select
                            target:
                              selection: select
                              selector: options-display
                        - instance: panes
                          id: transparent
                          name: option-2-text
                          parameters:
                            dimensions: *slot
                          bind:
                            schema: text
                            target:
                              content: OPTION 2

                  - instance: panes
                    id: transparent
                    name: option-3-slot
                    parameters:
                      dimensions: *slot
                      layout: overlay
                      alignment: *center
                      children:
                        - instance: buttons
                          id: label
                          name: option-3
                          bind:
                            schema: select
                            target:
                              selection: select
                              selector: options-display
                        - instance: panes
                          id: transparent
                          name: option-3-text
                          parameters:
                            dimensions: *slot
                          bind:
                            schema: text
                            target:
                              content: OPTION 3

                  - instance: panes
                    id: transparent
                    name: option-4-slot
                    parameters:
                      dimensions: *slot
                      layout: overlay
                      alignment: *center
                      children:
                        - instance: buttons
                          id: label
                          name: option-4
                          bind:
                            schema: select
                            target:
                              selection: select
                              selector: options-display
                        - instance: panes
                          id: transparent
                          name: option-4-text
                          parameters:
                            dimensions: *slot
                          bind:
                            schema: text
                            target:
                              content: OPTION 4
            # ---------------------------------------------------------
            # ------------------------------------------ OPTION DISPLAY
            # ---------------------------------------------------------
            - instance: panes
              id: *pane
              name: options-display-pane
              parameters:
                dimensions: *child
                layout: overlay
                alignment: *center
                font: menu
                children:
                  - instance: panes
                    id: *pane-alt
                    name: options-display
                    parameters:
                      dimensions: *sidebar
                    bind:
                      schema: text
                      target:
                        content: "SELECT AN OPTION"