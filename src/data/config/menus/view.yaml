menus:
  view:
    controller: display
    roots: 
      - id: dark-small
        name: hud-menu
        position:
          px: 0.075
          py: 0.75
        layout: dock
        alignment: start
        gap: 10
        margins: 15
        children: 
          - id: transparent-block
            name: hud-meters-pane
            layout: stack
            alignment: center
            gap: 5
            children: 
              - instance: meters
                id: health
                name: health-meter
                bind: 
                  state: context.sprite.state.meters.health
              - instance: meters
                id: magic
                name: magic-meter
                bind: 
                  state: context.sprite.state.meters.magic
          - id: transparent-block
            name: hud-slots-pane
            layout: dock
            alignment: start
            gap: 5
            children:
              # --- bounding box for the slot ---
              - id: transparent-slot 
                name: weapon-slot-container
                layout: overlay
                alignment: center
                gap: 0
                children:
                  # 1. The Background
                  - instance: buttons
                    id: slot
                    name: weapon-slot
                    status: disabled
                  # 2. The Foreground Decal
                  - instance: icons
                    id: weapons
                    name: weapon-icon
                    bind:
                      state: context.sprite.state.inventory.equipment.weapon
              # --- bounding box for the slot ---
              - id: transparent-slot
                name: shield-slot-container
                layout: overlay
                alignment: center
                gap: 0
                children:
                  - instance: buttons
                    id: slot
                    name: shield-slot
                    status: disabled
                  - instance: icons
                    id: shields
                    name: shield-icon
                    bind:
                      state: context.sprite.state.inventory.equipment.shield