# ---------------------------------------------------------------------
# -------------------------------------------------------- MENU: THEMES
# ---------------------------------------------------------------------
themes:
  colors:
    pane: &pane transparent
  alignments:
    top-left: &top-left
      horizontal: start
      vertical: start
    bottom-left: &bottom-left
      horizontal: start
      vertical: end
    bottom-right: &bottom-right
      horizontal: end
      vertical: end
    center: &center
      horizontal: center
      vertical: center
    start: &start
      horizontal: start
      vertical: center
    end: &end
      horizontal: end
      vertical: center
  dimensions:
    meters: &meters
      pw: 0.16
      pl: 0.10
    grip: &grip
      pw: 0.16
      pl: 0.08
    equipment: &equipment
      pw: 0.24
      pl: 0.18
    gear: &gear
      pw: 0.16
      pl: 0.08
    slottables: &slottables
      pw: 0.24
      pl: 0.08
    slot: &slot
      pw: 0.08
      pl: 0.08
  parameters:
    disabled: &disabled
      status: disabled
    slot-pane: &slot-pane
      dimensions: *slot
      layout: overlay
      alignment: *center
      gap: 0
# ---------------------------------------------------------------------
# ---------------------------------------------------------- MENU: VIEW
# ---------------------------------------------------------------------
menus:
  view:
    controller: display
    roots:
      # ---------------------------------------------------------------
      # ---------------------------------------- TOP LEFT: METERS STACK
      # ---------------------------------------------------------------
      - instance: panes
        id: *pane
        name: view-pane-meters
        parameters:
          dimensions: *meters
          justification: *top-left
          alignment: *start
          layout: stack
          gap: 5
          margins: 5
          children:
            # ------------------------------------------- METER: HEALTH
            - instance: meters
              id: health
              name: health-meter
              bind:
                schema: meter
                target:
                  meter: context.sprite.meters.health
            # -------------------------------------------- METER: MAGIC
            - instance: meters
              id: magic
              name: magic-meter
              bind:
                schema: meter
                target:
                  meter: context.sprite.meters.magic
      # ---------------------------------------------------------------
      # --------------------------------------- BOTTOM RIGHT: GRIP DOCK
      # ---------------------------------------------------------------
      - instance: panes
        id: *pane
        name: view-pane-grip
        parameters:
          dimensions: *grip
          justification: *bottom-right
          alignment: *end
          layout: dock
          gap: 5
          margins: 5
          children:
            # ----------------------------------------- SLOT: GRIP LEFT
            - instance: panes
              id: *pane
              name: pane-slot-grip-left
              parameters:
                <<: *slot-pane
                children:
                  - instance: buttons
                    id: slot
                    name: grip-left-slot
                    parameters: *disabled
                  - instance: icons
                    id: items
                    name: grip-left-icon
                    bind:
                      schema: icon
                      target:
                        icon: context.sprite.slots.grip.left
            # ---------------------------------------- SLOT: GRIP RIGHT
            - instance: panes
              id: *pane
              name: pane-slot-grip-right
              parameters:
                <<: *slot-pane
                children:
                  - instance: buttons
                    id: slot
                    name: grip-right-slot
                    parameters: *disabled
                  - instance: icons
                    id: items
                    name: grip-right-icon
                    bind:
                      schema: icon
                      target:
                        icon: context.sprite.slots.grip.right
      # ---------------------------------------------------------------
      # ---------------------------------- BOTTOM LEFT: EQUIPMENT STACK
      # ---------------------------------------------------------------
      - instance: panes
        id: *pane
        name: view-pane-equipment
        parameters:
          dimensions: *equipment
          justification: *bottom-left
          alignment: *start
          layout: stack
          gap: 5
          margins: 5
          children:
            # ---------------------------------------------- DOCK: GEAR
            - instance: panes
              id: *pane
              name: view-pane-gear
              parameters:
                dimensions: *gear
                layout: dock
                alignment: *start
                gap: 5
                margins: 2
                children:
                  # --------------------------------------- SLOT: ARMOR
                  - instance: panes
                    id: *pane
                    name: pane-slot-armor
                    parameters:
                      <<: *slot-pane
                      children:
                        - instance: buttons
                          id: slot
                          name: armor-slot
                          parameters: *disabled
                        - instance: icons
                          id: armor
                          name: armor-icon
                          bind:
                            schema: icon
                            target:
                              icon: context.sprite.slots.equipment.armor
                  # -------------------------------------- SLOT: SHIELD
                  - instance: panes
                    id: *pane
                    name: pane-slot-shield
                    parameters:
                      <<: *slot-pane
                      children:
                        - instance: buttons
                          id: slot
                          name: shield-slot
                          parameters: *disabled
                        - instance: icons
                          id: shields
                          name: shield-icon
                          bind:
                            schema: icon
                            target:
                              icon: context.sprite.slots.equipment.shield
            # ---------------------------------------- DOCK: SLOTTABLES
            - instance: panes
              id: *pane
              name: view-pane-slottables
              parameters:
                dimensions: *slottables
                layout: dock
                alignment: *start
                gap: 5
                margins: 2
                children:
                  # ------------------------------------- SLOT: UTILITY
                  - instance: panes
                    id: *pane
                    name: pane-slot-utility
                    parameters:
                      <<: *slot-pane
                      children:
                        - instance: buttons
                          id: slot
                          name: utility-slot
                          parameters: *disabled
                        - instance: icons
                          id: utilities
                          name: utility-icon
                          bind:
                            schema: icon
                            target:
                              icon: context.sprite.slots.equipment.utility
                  # ---------------------------------------- SLOT: TOOL
                  - instance: panes
                    id: *pane
                    name: pane-slot-tool
                    parameters:
                      <<: *slot-pane
                      children:
                        - instance: buttons
                          id: slot
                          name: tool-slot
                          parameters: *disabled
                        - instance: icons
                          id: tools
                          name: tool-icon
                          bind:
                            schema: icon
                            target:
                              icon: context.sprite.slots.equipment.tool
                  # -------------------------------------- SLOT: WEAPON
                  - instance: panes
                    id: *pane
                    name: pane-slot-weapon
                    parameters:
                      <<: *slot-pane
                      children:
                        - instance: buttons
                          id: slot
                          name: weapon-slot
                          parameters: *disabled
                        - instance: icons
                          id: weapons
                          name: weapon-icon
                          bind:
                            schema: icon
                            target:
                              icon: context.sprite.slots.equipment.weapon