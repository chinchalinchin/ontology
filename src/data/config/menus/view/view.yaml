# ---------------------------------------------------------------------
themes:
  colors:
    pane: &pane dark-solid
    pane-alt: &pane-alt dark-texture
  alignments:
    bottom: &bottom
      horizontal: center
      vertical: end
    center: &center
      horizontal: center
      vertical: center
    start: &start
      horizontal: start
      vertical: center
  dimensions:
    root: &root
      pw: 0.40
      pl: 0.25
    child: &child
      pw: 0.16
      pl: 0.10
    slot: &slot
      pw: 0.08
      pl: 0.08
# ---------------------------------------------------------------------
menus:
  view:
    controller: display
    roots:
      - instance: panes
        id: *pane
        name: hud-menu
        parameters:
          dimensions: *root
          justification: *bottom
          alignment: *center
          layout: dock
          gap: 5
          margins: 5
          children:
            # ----------------------------------------------------------
            - instance: panes
              id: transparent
              name: hud-meters-pane
              parameters:
                dimensions: *child
                layout: stack
                alignment: *center
                gap: 5
                children:
                  - instance: meters
                    id: health
                    name: health-meter
                    bind:
                      schema: meter
                      target:
                        meter: context.sprite.meters.health
                  - instance: meters
                    id: magic
                    name: magic-meter
                    bind:
                      schema: meter
                      target:
                        meter: context.sprite.meters.magic
            # ----------------------------------------------------------
            - instance: panes
              id: transparent
              name: slots-pane
              parameters:
                dimensions: *child
                layout: dock
                alignment: *start
                gap: 5
                children:
                  - instance: panes
                    id: transparent
                    name: slot-weapon-pane
                    parameters:
                      dimensions: *slot
                      layout: overlay
                      alignment: *center
                      gap: 0
                      children:
                        - instance: buttons
                          id: slot
                          name: weapon-slot
                          parameters:
                            status: disabled
                        - instance: icons
                          id: weapons
                          name: weapon-icon
                          bind:
                            schema: icon
                            target:
                              icon: context.sprite.inventory.equipment.weapon
                  - instance: panes
                    id: transparent
                    name: slot-shield-pane
                    parameters:
                      dimensions: *slot
                      layout: overlay
                      alignment: *center
                      gap: 0
                      children:
                        - instance: buttons
                          id: slot
                          name: shield-slot
                          parameters:
                            status: disabled
                        - instance: icons
                          id: shields
                          name: shield-icon
                          bind:
                            schema: icon
                            target:
                              icon: context.sprite.inventory.equipment.shield