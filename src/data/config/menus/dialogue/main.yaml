# ---------------------------------------------------------------------
themes:
  colors:
    pane: &pane dark-solid
    pane-alt: &pane-alt dark-texture
  alignments:
    center: &center
      horizontal: center
      vertical: center
  dimensions:
    root: &root
      pw: 0.65
      pl: 0.25
    slot: &slot
      pw: 0.30
      pl: 0.06
# ---------------------------------------------------------------------
menus:
  dialogue:
    controller: scroll
    roots:
      - id: *pane
        instance: panes
        name: dialogue-menu
        parameters:
          dimensions: *root
          justification: *center
          alignment: *center
          layout: dock
          font: dialogue
          gap: 5
          margins: 10
          children:
            # ------------------------------- PORTRAIT DISPLAY
            - instance: panes
              id: dark-texture
              name: character-portrait-container
              parameters:
                dimensions:
                  pw: 0.10
                  pl: 0.20
                layout: overlay
                alignment: *center
                gap: 0
                children:
                  - instance: icons
                    id: portraits
                    name: character-portrait-icon
                    bind:
                      schema: icon
                      target:
                        icon: context.sprite.psyche.persona
            # ------------------------------- DIALOGUE DISPLAY
            - instance: panes
              id: dark-solid
              name: character-speech
              parameters:
                dimensions:
                  pw: 0.40
                  pl: 0.20
              bind:
                schema: library
                target:
                  plot: context.plot.current
                  persona: context.sprite.psyche.persona
                  lexicon: context.sprite.psyche.dialogue
            # ------------------------------- CONTROL DISPLAY
            - id: transparent
              name: text-scroll-buttons
              instance: panes
              parameters:
                dimensions:
                  pw: 0.08
                  pl: 0.15
                layout: stack
                alignment: *center
                gap: 5
                children:
                  - instance: buttons
                    id: arrow-up
                    name: text-scroll-up
                    bind:
                      schema: select
                      target:
                        selection: scrollup
                        selector: character-speech
                  - instance: buttons
                    id: arrow-down
                    name: text-scroll-down
                    bind:
                      schema: select
                      target:
                        selection: scrolldown
                        selector: character-speech