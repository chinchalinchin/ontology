menus:
  text:
    controller: scroll
    roots: 
      - id: neutral
        name: text-menu
        position:
          px: 0.1
          py: 0.75
        layout: dock
        alignment: start
        gap: 10
        children: 
          - instance: pages
            id: text
            name: text-display
            bind:
              state: context.content
          - instance: buttons
            id: arrow-up
            name: text-scroll-up
            bind: 
              selection: scrollup
              selector: text-display
          - instance: buttons
            id: arrow-down
            name: text-scroll-down
            bind: 
              selection: scrolldown
              selector: text-display
  dialogue:
    controller: scroll
    roots: 
      - id: neutral
        name: dialogue-menu
        position:
          px: 0.1
          py: 0.75
        layout: dock
        alignment: start
        gap: 10
        children: 
          - instance: pages
            id: portrait
            name: character-portrait
            bind: 
              state: context.sprite.state.character.portrait
          - instance: pages
            id: dialogue
            name: character-speech
            bind:
              state: context.sprite.state.psyche.communication
          - instance: buttons
            id: arrow-up
            name: character-speech-scroll-up
            bind: 
              selection: scrollup
              selector: character-speech
          - instance: buttons
            id: arrow-down
            name: character-speech-scroll-down
            bind: 
              selection: scrolldown
              selector: character-speech
  view:
    controller: display
    roots: 
      - id: transparent
        name: hud-menu
        position:
          px: 0.1
          py: 0.85
        layout: dock
        alignment: start
        gap: 10
        children: 
          - instance: meters
            id: health
            name: health-meter
            bind: 
              state: context.sprite.state.meters.health
          - instance: buttons
            id: slot
            name: weapon-slot
            status: disabled
            bind:
              state: context.sprite.state.inventory.equipment.weapon
          - instance: buttons
            id: slot
            name: shield-slot
            status: disabled
            bind:
              state: context.sprite.state.inventory.equipment.shield