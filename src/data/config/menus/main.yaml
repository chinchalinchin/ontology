menus:
  main:
    controller: main
    roots: 
      - id: neutral
        name: main-menu
        position:
          # ---- 360x360
          # px: 0.075
          # py: 0.15
          # ---- 480 x 480
          px: 0.175
          py: 0.275
        layout: stack
        alignment: center
        gap: 10
        children: 
          - instance: buttons
            id: label
            name: new-game
            bind: 
              schema: select
              selection: new
              selector: world-01
          - instance: buttons
            id: label
            name: load-game
            bind: 
              schema: select
              selection: load
              selector: world-01
          - instance: buttons
            id: label
            name: options-menu
            bind:
              schema: select
              selector: options
              selection: menu
          - instance: buttons
            id: label
            name: editor-menu
            bind:
              schema: select
              selector: editor
              selection: menu
  load:
    controller: load
    roots: 
      - id: neutral
        name: main-menu
        position:
          # ---- 360x360
          # px: 0.075
          # py: 0.15
          # ---- 480 x 480
          px: 0.175
          py: 0.275
        layout: stack
        alignment: center
        gap: 10
        children: 
          - instance: meters
            id: health
            name: load-bar
            bind: 
              schema: meter
              target: context.registry