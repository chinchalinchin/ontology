# ---------------------------------------------------------------------
# -------------------------------------------------------- MENU: THEMES
# ---------------------------------------------------------------------
themes:
  colors:
    pane: &pane dark-solid
    pane-alt: &pane-alt dark-texture
  alignments:
    top: &top
      horizontal: center
      vertical: start
    center: &center
      horizontal: center
      vertical: center
  dimensions:
    root: &root
      pw: 0.67
      pl: 0.80
    section: &section
      pw: 0.65
      pl: 0.20
    label: &label
      pw: 0.50
      pl: 0.06
    row: &row
      pw: 0.50
      pl: 0.08
    slot: &slot
      pw: 0.08
      pl: 0.08
    gizmo: &gizmo
      pw: 0.32
      pl: 0.08
  parameters:
    collection: &collection
      capacity: 4
      columns: 4
      gap: 5
      pane: transparent
      button: slot
      dimensions: *gizmo
    disabled: &disabled
      status: disabled
    display: &display
      dimensions: *label
      layout: overlay
      alignment: *center
# ---------------------------------------------------------------------
# ----------------------------------------------------- MENU: INVENTORY
# ---------------------------------------------------------------------
menus:
  inventory:
    controller: inventory
    roots:
      - instance: panes
        id: transparent
        name: inventory-menu
        parameters:
          dimensions: *root
          justification: *top
          alignment: *center
          layout: stack
          font: menu
          gap: 10
          margins: 0
          children:
            # ------------------------------------------
            # --------------------- INVENTORY: EQUIPMENT
            # ------------------------------------------
            - instance: panes
              id: *pane-alt
              name: inventory-equipment-section
              parameters:
                dimensions: *section
                layout: stack
                alignment: *center
                gap: 2
                margins: 3
                children:
                  # -----------------------------------
                  # ------------------ EQUIPMENT: LABEL
                  - instance: panes
                    id: transparent
                    name: inventory-equipment-label-slot
                    parameters: *display
                    bind:
                      schema: text
                      target:
                        content: EQUIPMENT
                  # -----------------------------------
                  # ------------------ EQUIPMENT: SLOTS
                  - id: transparent
                    name: inventory-equipment-row
                    instance: panes
                    parameters:
                      dimensions: *row
                      layout: dock
                      alignment: *center
                      gap: 5
                      children:
                        # ----------------- SLOT: WEAPON
                        - instance: panes
                          id: transparent
                          name: equipment-weapon-slot-pane
                          parameters:
                            dimensions: *slot
                            layout: overlay
                            alignment: *center
                            children:
                              - id: slot
                                name: equipment-weapon-slot
                                instance: buttons
                                parameters: *disabled
                              - id: weapons
                                name: equipment-weapon-icon
                                instance: icons
                                bind:
                                  schema: icon
                                  target:
                                    icon: context.inventory.equipment.weapon
                        # ----------------- SLOT: SHIELD
                        - instance: panes
                          id: transparent
                          name: equipment-shield-slot-pane
                          parameters:
                            dimensions: *slot
                            layout: overlay
                            alignment: *center
                            children:
                              - id: slot
                                name: equipment-shield-slot
                                instance: buttons
                                parameters: *disabled
                              - id: shields
                                name: equipment-shield-icon
                                instance: icons
                                bind:
                                  schema: icon
                                  target:
                                    icon: context.inventory.equipment.shield
                        # ----------------- SLOT: ARMOR
                        - instance: panes
                          id: transparent
                          name: equipment-armor-slot-pane
                          parameters:
                            dimensions: *slot
                            layout: overlay
                            alignment: *center
                            children:
                              - id: slot
                                name: equipment-armor-slot
                                instance: buttons
                                parameters: *disabled
                              - id: armor
                                name: equipment-armor-icon
                                instance: icons
                                bind:
                                  schema: icon
                                  target:
                                    icon: context.inventory.equipment.armor
                        # ----------------- SLOT: TOOL
                        - instance: panes
                          id: transparent
                          name: equipment-tool-slot-pane
                          parameters:
                            dimensions: *slot
                            layout: overlay
                            alignment: *center
                            children:
                              - id: slot
                                name: equipment-tool-slot
                                instance: buttons
                                parameters: *disabled
                              - id: tools
                                name: equipment-tool-icon
                                instance: icons
                                bind:
                                  schema: icon
                                  target:
                                    icon: context.inventory.equipment.tool
                        # ----------------- SLOT: UTILITY
                        - instance: panes
                          id: transparent
                          name: equipment-utility-slot-pane
                          parameters:
                            dimensions: *slot
                            layout: overlay
                            alignment: *center
                            children:
                              - id: slot
                                name: equipment-utility-slot
                                instance: buttons
                                parameters: *disabled
                              - id: utilities
                                name: equipment-utility-icon
                                instance: icons
                                bind:
                                  schema: icon
                                  target:
                                    icon: context.inventory.equipment.utility
                        # -----------------------------
                  # -----------------------------------
            # ------------------------------------------
            # ------------------------- INVENTORY: POUCH
            # ------------------------------------------
            - instance: panes
              id: *pane
              name: inventory-pouch-section
              parameters:
                dimensions: *section
                layout: stack
                alignment: *center
                gap: 2
                margins: 3
                children:
                  # -----------------------------------
                  # ----------------------- POUCH: LABEL
                  - instance: panes
                    id: transparent
                    name: inventory-pouch-label-slot
                    parameters: *display
                    bind:
                      schema: text
                      target:
                        content: POUCH
                  # -----------------------------------
                  # ----------------------- POUCH: SLOTS
                  - instance: panes
                    id: transparent
                    name: inventory-pouch-row
                    parameters:
                      dimensions: *row
                      layout: dock
                      alignment: *center
                      gap: 10
                      children:
                        # ------------------------------
                        # ---------------- CONTROL: LEFT
                        - instance: buttons
                          id: arrow-left
                          name: inventory-pouch-scroll-up
                          bind:
                            schema: select
                            target:
                              selection: scrollup
                              selector: inventory-pouch-grid
                        # ----------------- SLOTS: ITEMS
                        - instance: gizmos
                          id: items
                          name: inventory-pouch-grid
                          bind:
                            schema: collection
                            target:
                              source: context.inventory.pouch
                          parameters: *collection
                        # --------------- CONTROL: RIGHT
                        - instance: buttons 
                          id: arrow-right
                          name: inventory-pouch-scroll-down
                          bind:
                            schema: select
                            target:
                              selection: scrolldown
                              selector: inventory-pouch-grid
                        # ------------------------------
                  # -----------------------------------
            # ------------------------------------------
            # -------------------------- INVENTORY: PACK
            # ------------------------------------------
            - id: *pane
              name: inventory-pack-section
              instance: panes
              parameters:
                dimensions: *section
                layout: stack
                alignment: *center
                gap: 2
                margins: 3
                children:
                  # -----------------------------------
                  # ------------------------- PACK: LABEL
                  - id: transparent
                    name: inventory-pack-label-slot
                    instance: panes
                    parameters: *display
                    bind:
                      schema: text
                      target:
                        content: PACK
                  # -----------------------------------
                  # ----------------------- PACK: SLOTS
                  - id: transparent
                    name: inventory-pack-row
                    instance: panes
                    parameters:
                      dimensions: *row
                      layout: dock
                      alignment: *center
                      gap: 20
                      children:
                        # ------------------------------
                        # ---------------- CONTROL: LEFT
                        - instance: buttons
                          id: arrow-left
                          name: inventory-pack-scroll-up
                          bind:
                            schema: select
                            target:
                              selection: scrollup
                              selector: inventory-pack-grid
                        # ------------- SLOTS: RESOURCES
                        - instance: gizmos
                          id: resources
                          name: inventory-pack-grid
                          bind:
                            schema: collection
                            target:
                              source: context.inventory.pack
                          parameters: *collection
                        # --------------- CONTROL: RIGHT
                        - id: arrow-right
                          name: inventory-pack-scroll-down
                          instance: buttons
                          bind:
                            schema: select
                            target:
                              selection: scrolldown
                              selector: inventory-pack-grid
                        # --------------- CONTROL: RIGHT