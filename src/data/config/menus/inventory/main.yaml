# ---------------------------------------------------------------------
# -------------------------------------------------------- MENU: THEMES
# ---------------------------------------------------------------------
themes:
  colors:
    pane: &pane dark-solid
    pane-alt: &pane-alt dark-texture
  alignments:
    top: &top
      horizontal: center
      vertical: start
    center: &center
      horizontal: center
      vertical: center
  dimensions:
    root: &root
      pw: 0.67
      pl: 0.80
    section: &section
      pw: 0.65
      pl: 0.20
    label: &label
      pw: 0.50
      pl: 0.06
    row: &row
      pw: 0.50
      pl: 0.08
    slot: &slot
      pw: 0.08
      pl: 0.08
    gizmo: &gizmo
      pw: 0.32
      pl: 0.08
# ---------------------------------------------------------------------
# ----------------------------------------------------- MENU: INVENTORY
# ---------------------------------------------------------------------
menus:
  inventory:
    controller: inventory
    roots:
      - id: transparent
        name: inventory-menu
        instance: panes
        parameters:
          dimensions: *root
          justification: *top
          alignment: *center
          layout: stack
          font: menu
          gap: 10
          margins: 0
          children:
            # ------------------------------------------
            # --------------------- INVENTORY: EQUIPMENT
            # ------------------------------------------
            - id: *pane-alt
              name: inventory-equipment-section
              instance: panes
              parameters:
                dimensions: *section
                layout: stack
                alignment: *center
                gap: 2
                margins: 3
                children:
                  - id: transparent
                    name: inventory-equipment-label-slot
                    instance: panes
                    parameters:
                      dimensions: *label
                      layout: overlay
                      alignment: *center
                      children:
                        - id: transparent
                          name: inventory-equipment-label
                          instance: panes
                          parameters:
                            dimensions: *label
                          bind:
                            schema: text
                            target:
                              content: EQUIPMENT
                  - id: transparent
                    name: inventory-equipment-row
                    instance: panes
                    parameters:
                      dimensions: *row
                      layout: dock
                      alignment: *center
                      gap: 5
                      children:
                        - id: transparent
                          name: equipment-weapon-slot-pane
                          instance: panes
                          parameters:
                            dimensions: *slot
                            layout: overlay
                            alignment: *center
                            children:
                              - id: slot
                                name: equipment-weapon-slot
                                instance: buttons
                                parameters:
                                  status: disabled
                              - id: weapons
                                name: equipment-weapon-icon
                                instance: icons
                                bind:
                                  schema: icon
                                  target:
                                    icon: context.inventory.equipment.weapon
                        - id: transparent
                          name: equipment-shield-slot-pane
                          instance: panes
                          parameters:
                            dimensions: *slot
                            layout: overlay
                            alignment: *center
                            children:
                              - id: slot
                                name: equipment-shield-slot
                                instance: buttons
                                parameters:
                                  status: disabled
                              - id: shields
                                name: equipment-shield-icon
                                instance: icons
                                bind:
                                  schema: icon
                                  target:
                                    icon: context.inventory.equipment.shield
                        - id: transparent
                          name: equipment-armor-slot-pane
                          instance: panes
                          parameters:
                            dimensions: *slot
                            layout: overlay
                            alignment: *center
                            children:
                              - id: slot
                                name: equipment-armor-slot
                                instance: buttons
                                parameters:
                                  status: disabled
                              - id: shields
                                name: equipment-armor-icon
                                instance: icons
                                bind:
                                  schema: icon
                                  target:
                                    icon: context.inventory.equipment.armor
                        - id: transparent
                          name: equipment-tool-slot-pane
                          instance: panes
                          parameters:
                            dimensions: *slot
                            layout: overlay
                            alignment: *center
                            children:
                              - id: slot
                                name: equipment-tool-slot
                                instance: buttons
                                parameters:
                                  status: disabled
                              - id: weapons
                                name: equipment-tool-icon
                                instance: icons
                                bind:
                                  schema: icon
                                  target:
                                    icon: context.inventory.equipment.tool
                        - id: transparent
                          name: equipment-utility-slot-pane
                          instance: panes
                          parameters:
                            dimensions: *slot
                            layout: overlay
                            alignment: *center
                            children:
                              - id: slot
                                name: equipment-utility-slot
                                instance: buttons
                                parameters:
                                  status: disabled
                              - id: weapons
                                name: equipment-utility-icon
                                instance: icons
                                bind:
                                  schema: icon
                                  target:
                                    icon: context.inventory.equipment.utility
            # ------------------------------------------
            # ------------------------- INVENTORY: POUCH
            # ------------------------------------------
            - id: *pane
              name: inventory-pouch-section
              instance: panes
              parameters:
                dimensions: *section
                layout: stack
                alignment: *center
                gap: 2
                margins: 3
                children:
                  - id: transparent
                    name: inventory-pouch-label-slot
                    instance: panes
                    parameters:
                      dimensions: *label
                      layout: overlay
                      alignment: *center
                      children:
                        - id: transparent
                          name: inventory-pouch-label
                          instance: panes
                          parameters:
                            dimensions: *label
                          bind:
                            schema: text
                            target:
                              content: POUCH
                  - id: transparent
                    name: inventory-pouch-row
                    instance: panes
                    parameters:
                      dimensions: *row
                      layout: dock
                      alignment: *center
                      gap: 10
                      children:
                        - id: arrow-left
                          name: inventory-pouch-scroll-up
                          instance: buttons
                          bind:
                            schema: select
                            target:
                              selection: scrollup
                              selector: inventory-pouch-grid
                        - id: weapons
                          name: inventory-pouch-grid
                          instance: gizmos
                          bind:
                            schema: collection
                            target:
                              source: context.inventory.pouch
                          parameters:
                            capacity: 4
                            columns: 4
                            gap: 5
                            pane: transparent
                            button: slot
                            dimensions: *gizmo
                        - id: arrow-right
                          name: inventory-pouch-scroll-down
                          instance: buttons
                          bind:
                            schema: select
                            target:
                              selection: scrolldown
                              selector: inventory-pouch-grid
            # ------------------------------------------
            # -------------------------- INVENTORY: PACK
            # ------------------------------------------
            - id: *pane
              name: inventory-pack-section
              instance: panes
              parameters:
                dimensions: *section
                layout: stack
                alignment: *center
                gap: 2
                margins: 3
                children:
                  - id: transparent
                    name: inventory-pack-label-slot
                    instance: panes
                    parameters:
                      dimensions: *label
                      layout: overlay
                      alignment: *center
                      children:
                        - id: transparent
                          name: inventory-pack-label
                          instance: panes
                          parameters:
                            dimensions: *label
                          bind:
                            schema: text
                            target:
                              content: PACK
                  - id: transparent
                    name: inventory-pack-row
                    instance: panes
                    parameters:
                      dimensions: *row
                      layout: dock
                      alignment: *center
                      gap: 20
                      children:
                        - id: arrow-left
                          name: inventory-pack-scroll-up
                          instance: buttons
                          bind:
                            schema: select
                            target:
                              selection: scrollup
                              selector: inventory-pack-grid
                        - id: weapons
                          name: inventory-pack-grid
                          instance: gizmos
                          bind:
                            schema: collection
                            target:
                              source: context.inventory.pack
                          parameters:
                            capacity: 4
                            columns: 4
                            gap: 5
                            pane: transparent
                            button: slot
                            dimensions: *gizmo
                        - id: arrow-right
                          name: inventory-pack-scroll-down
                          instance: buttons
                          bind:
                            schema: select
                            target:
                              selection: scrolldown
                              selector: inventory-pack-grid