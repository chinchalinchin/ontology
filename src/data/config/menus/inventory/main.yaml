menus:
  inventory:
    controller: inventory
    roots:
      - id: transparent
        name: inventory-menu
        instance: panes
        parameters:
          dimensions:
            pw: 0.67
            pl: 0.80
          justification:
            horizontal: center
            vertical: center
          alignment:
            horizontal: center
            vertical: center
          layout: stack
          font: menu
          gap: 10
          margins: 0
          children:
            # ==========================================
            # 1. EQUIPMENT SECTION
            # ==========================================
            - id: neutral
              name: inventory-equipment-section
              instance: panes
              parameters:
                dimensions:
                  pw: 0.65
                  pl: 0.20
                layout: stack
                alignment:
                  horizontal: center
                  vertical: center
                gap: 2
                margins: 3
                children:
                  - id: transparent
                    name: inventory-equipment-label-slot
                    instance: panes
                    parameters:
                      dimensions:
                        pw: 0.30
                        pl: 0.06
                      layout: overlay
                      alignment:
                        horizontal: center
                        vertical: center
                      children:
                        - id: transparent
                          name: inventory-equipment-label
                          instance: panes
                          parameters:
                            dimensions:
                              pw: 0.30
                              pl: 0.06
                          bind:
                            schema: text
                            target:
                              content: EQUIPMENT
                  - id: transparent
                    name: inventory-equipment-row
                    instance: panes
                    parameters:
                      dimensions:
                        pw: 0.50
                        pl: 0.08
                      layout: dock
                      alignment:
                        horizontal: center
                        vertical: center
                      gap: 5
                      children:
                        - id: transparent
                          name: equipment-weapon-slot-pane
                          instance: panes
                          parameters:
                            dimensions:
                              pw: 0.08
                              pl: 0.08
                            layout: overlay
                            alignment:
                              horizontal: center
                              vertical: center
                            children:
                              - id: slot
                                name: equipment-weapon-slot
                                instance: buttons
                                parameters:
                                  status: disabled
                              - id: weapons
                                name: equipment-weapon-icon
                                instance: icons
                                bind:
                                  schema: icon
                                  target:
                                    icon: context.inventory.equipment.weapon
                        - id: transparent
                          name: equipment-shield-slot-pane
                          instance: panes
                          parameters:
                            dimensions:
                              pw: 0.08
                              pl: 0.08
                            layout: overlay
                            alignment:
                              horizontal: center
                              vertical: center
                            children:
                              - id: slot
                                name: equipment-shield-slot
                                instance: buttons
                                parameters:
                                  status: disabled
                              - id: shields
                                name: equipment-shield-icon
                                instance: icons
                                bind:
                                  schema: icon
                                  target:
                                    icon: context.inventory.equipment.shield
                        - id: transparent
                          name: equipment-armor-slot-pane
                          instance: panes
                          parameters:
                            dimensions:
                              pw: 0.08
                              pl: 0.08
                            layout: overlay
                            alignment:
                              horizontal: center
                              vertical: center
                            children:
                              - id: slot
                                name: equipment-armor-slot
                                instance: buttons
                                parameters:
                                  status: disabled
                              - id: shields
                                name: equipment-armor-icon
                                instance: icons
                                bind:
                                  schema: icon
                                  target:
                                    icon: context.inventory.equipment.armor
                        - id: transparent
                          name: equipment-tool-slot-pane
                          instance: panes
                          parameters:
                            dimensions:
                              pw: 0.08
                              pl: 0.08
                            layout: overlay
                            alignment:
                              horizontal: center
                              vertical: center
                            children:
                              - id: slot
                                name: equipment-tool-slot
                                instance: buttons
                                parameters:
                                  status: disabled
                              - id: weapons
                                name: equipment-tool-icon
                                instance: icons
                                bind:
                                  schema: icon
                                  target:
                                    icon: context.inventory.equipment.tool
                        - id: transparent
                          name: equipment-utility-slot-pane
                          instance: panes
                          parameters:
                            dimensions:
                              pw: 0.08
                              pl: 0.08
                            layout: overlay
                            alignment:
                              horizontal: center
                              vertical: center
                            children:
                              - id: slot
                                name: equipment-utility-slot
                                instance: buttons
                                parameters:
                                  status: disabled
                              - id: weapons
                                name: equipment-utility-icon
                                instance: icons
                                bind:
                                  schema: icon
                                  target:
                                    icon: context.inventory.equipment.utility

            # ==========================================
            # 2. POUCH SECTION
            # ==========================================
            - id: neutral
              name: inventory-pouch-section
              instance: panes
              parameters:
                dimensions:
                  pw: 0.65
                  pl: 0.20
                layout: stack
                alignment:
                  horizontal: center
                  vertical: center
                gap: 2
                margins: 3
                children:
                  - id: transparent
                    name: inventory-pouch-label-slot
                    instance: panes
                    parameters:
                      dimensions:
                        pw: 0.30
                        pl: 0.06
                      layout: overlay
                      alignment:
                        horizontal: center
                        vertical: center
                      children:
                        - id: transparent
                          name: inventory-pouch-label
                          instance: panes
                          parameters:
                            dimensions:
                              pw: 0.30
                              pl: 0.06
                          bind:
                            schema: text
                            target:
                              content: POUCH
                  - id: transparent
                    name: inventory-pouch-row
                    instance: panes
                    parameters:
                      dimensions:
                        pw: 0.50
                        pl: 0.08
                      layout: dock
                      alignment:
                        horizontal: center
                        vertical: center
                      gap: 20
                      children:
                        - id: weapons
                          name: inventory-pouch-grid
                          instance: gizmos
                          bind:
                            schema: collection
                            target:
                              source: context.inventory.pouch
                          parameters:
                            capacity: 4
                            columns: 4
                            gap: 5
                            pane: transparent
                            button: slot
                            dimensions:
                              pw: 0.32
                              pl: 0.08
                        - id: transparent
                          name: inventory-pouch-scroll-controls
                          instance: panes
                          parameters:
                            dimensions:
                              pw: 0.10
                              pl: 0.08
                            layout: dock
                            alignment:
                              horizontal: center
                              vertical: center
                            gap: 0
                            children:
                              - id: arrow-up
                                name: inventory-pouch-scroll-up
                                instance: buttons
                                bind:
                                  schema: select
                                  target:
                                    selection: scrollup
                                    selector: inventory-pouch-grid
                              - id: arrow-down
                                name: inventory-pouch-scroll-down
                                instance: buttons
                                bind:
                                  schema: select
                                  target:
                                    selection: scrolldown
                                    selector: inventory-pouch-grid

            # ==========================================
            # 3. PACK SECTION
            # ==========================================
            - id: neutral
              name: inventory-pack-section
              instance: panes
              parameters:
                dimensions:
                  pw: 0.65
                  pl: 0.20
                layout: stack
                alignment:
                  horizontal: center
                  vertical: center
                gap: 2
                margins: 3
                children:
                  - id: transparent
                    name: inventory-pack-label-slot
                    instance: panes
                    parameters:
                      dimensions:
                        pw: 0.30
                        pl: 0.06
                      layout: overlay
                      alignment:
                        horizontal: center
                        vertical: center
                      children:
                        - id: transparent
                          name: inventory-pack-label
                          instance: panes
                          parameters:
                            dimensions:
                              pw: 0.30
                              pl: 0.06
                          bind:
                            schema: text
                            target:
                              content: PACK
                  - id: transparent
                    name: inventory-pack-row
                    instance: panes
                    parameters:
                      dimensions:
                        pw: 0.50
                        pl: 0.08
                      layout: dock
                      alignment:
                        horizontal: center
                        vertical: center
                      gap: 20
                      children:
                        - id: weapons
                          name: inventory-pack-grid
                          instance: gizmos
                          bind:
                            schema: collection
                            target:
                              source: context.inventory.pack
                          parameters:
                            capacity: 4
                            columns: 4
                            gap: 5
                            pane: transparent
                            button: slot
                            dimensions:
                              pw: 0.32
                              pl: 0.08
                        - id: transparent
                          name: inventory-pack-scroll-controls
                          instance: panes
                          parameters:
                            dimensions:
                              pw: 0.10
                              pl: 0.08
                            layout: dock
                            alignment:
                              horizontal: center
                              vertical: center
                            gap: 0
                            children:
                              - id: arrow-up
                                name: inventory-pack-scroll-up
                                instance: buttons
                                bind:
                                  schema: select
                                  target:
                                    selection: scrollup
                                    selector: inventory-pack-grid
                              - id: arrow-down
                                name: inventory-pack-scroll-down
                                instance: buttons
                                bind:
                                  schema: select
                                  target:
                                    selection: scrolldown
                                    selector: inventory-pack-grid