# ---------------------------------------------------------------------
# -------------------------------------------------------- MENU: THEMES
# ---------------------------------------------------------------------
themes:
  colors:
    pane: &pane dark-solid
    pane-alt: &pane-alt dark-texture
  alignments:
    bottom: &bottom
      horizontal: center
      vertical: end
    center: &center
      horizontal: center
      vertical: center
  dimensions:
    root: &root
      pw: 0.65
      pl: 0.25
    child: &child
      pw: 0.40
      pl: 0.20
    scroll: &scroll
      pw: 0.08
      pl: 0.15
# ---------------------------------------------------------------------
# ---------------------------------------------------------- MENU: TEXT
# ---------------------------------------------------------------------
menus:
  text:
    controller: scroll
    roots:
      - instance: panes
        id: *pane-alt
        name: text-menu
        parameters:
          dimensions: *root
          justification: *bottom
          alignment: *center
          layout: dock
          gap: 15
          margins: 10
          font: dialogue
          children:
            - id: *pane
              instance: panes
              name: text-display
              parameters:
                dimensions: *child
              bind:
                schema: library
                target:
                  plot: context.plot.current
                  persona: context.object.persona
                  lexicon: context.object.lexicon
            - instance: panes
              id: transparent
              name: text-scroll-buttons
              parameters:
                dimensions: *scroll
                layout: stack
                alignment: *center
                gap: 5
                children:
                  - instance: buttons
                    id: arrow-up
                    name: text-scroll-up
                    bind:
                      schema: select
                      target:
                        selection: scrollup
                        selector: text-display
                  - instance: buttons
                    id: arrow-down
                    name: text-scroll-down
                    bind:
                      schema: select
                      target:
                        selection: scrolldown
                        selector: text-display