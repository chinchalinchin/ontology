# ---------------------------------------------------------------------
themes:
  colors:
    pane: &pane transculent
    pane-alt: &pane-alt dark-texture
  alignments:
    center: &center
      horizontal: center
      vertical: center
  dimensions:
    root: &root
      pw: 0.65
      pl: 0.375
    slot: &slot
      pw: 0.30
      pl: 0.06
# ---------------------------------------------------------------------
menus:
  main:
    controller: main
    roots:
      - id: *pane
        instance: panes
        name: main-menu
        parameters:
          dimensions: *root
          justification: *center
          alignment: *center
          layout: stack
          font: menu
          gap: 2
          margins: 10
          children:
            # --- NEW GAME ---
            - instance: panes
              id: transparent
              name: new-game-slot
              parameters:
                dimensions: *slot
                layout: overlay
                alignment: *center
                children:
                  - instance: buttons
                    id: label
                    name: new-game
                    bind:
                      schema: select
                      target:
                        selection: new
                        selector: world-01
                  - instance: panes
                    id: transparent
                    name: new-game-text
                    parameters:
                      dimensions: *slot
                    bind:
                      schema: text
                      target:
                        content: NEW

            # --- LOAD GAME ---
            - instance: panes
              id: transparent
              name: load-game-slot
              parameters:
                dimensions: *slot
                layout: overlay
                alignment: *center
                children:
                  - instance: buttons
                    id: label
                    name: load-game
                    bind:
                      schema: select
                      target:
                        selection: load
                        selector: world-01
                  - instance: panes
                    id: transparent
                    name: load-game-text
                    parameters:
                      dimensions: *slot
                    bind:
                      schema: text
                      target:
                        content: LOAD

            # --- OPTIONS ---
            - instance: panes
              id: transparent
              name: options-menu-slot
              parameters:
                dimensions: *slot
                layout: overlay
                alignment: *center
                children:
                  - instance: buttons
                    id: label
                    name: options-menu
                    bind:
                      schema: select
                      target:
                        selector: options
                        selection: menu
                  - instance: panes
                    id: transparent
                    name: options-menu-text
                    parameters:
                      dimensions: *slot
                    bind:
                      schema: text
                      target:
                        content: OPTIONS

            # --- EDITOR ---
            - instance: panes
              id: transparent
              name: editor-menu-slot
              parameters:
                dimensions: *slot
                layout: overlay
                alignment: *center
                children:
                  - instance: buttons
                    id: label
                    name: editor-menu
                    bind:
                      schema: select
                      target:
                        selector: editor
                        selection: menu
                  - instance: panes
                    id: transparent
                    name: editor-menu-text
                    parameters:
                      dimensions: *slot
                    bind:
                      schema: text
                      target:
                        content: EDITOR