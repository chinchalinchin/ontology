# ---------------------------------------------------------------------
themes:
  colors:
    pane: &pane dark-solid
    pane-alt: &pane-alt dark-texture
  alignments:
    center: &center
      horizontal: center
      vertical: center
  dimensions:
    root: &root
      pw: 0.65
      pl: 0.375
    child: &child
      pw: 0.40
      pl: 0.50
    slot: &slot
      pw: 0.30
      pl: 0.06
    sidebar: &sidebar
      pw: 0.35
      pl: 0.40
# ---------------------------------------------------------------------
menus:
  pause:
    controller: pause
    roots:
      - instance: panes
        id: *pane
        name: pause-menu
        parameters:
          font: menu
          dimensions: *root
          justification: *center
          alignment: *center
          layout: stack
          gap: 10
          children:
            # --------------------------------------------------------
            # --------------------------------------- PAUSE: SAVE GAME
            # --------------------------------------------------------
            - instance: panes
              id: transparent
              name: pause-save-slot
              parameters:
                dimensions: *slot
                layout: overlay
                alignment: *center
                children:
                  - instance: buttons
                    id: label
                    name: pause-save
                    bind:
                      schema: select
                      target:
                        selection: save
                        selector: save-01
                  - instance: panes
                    id: transparent
                    name: pause-save-text
                    parameters:
                      dimensions: *slot
                    bind:
                      schema: text
                      target:
                        content: SAVE

            # --- LOAD GAME ---
            - instance: panes
              id: transparent
              name: pause-load-slot
              parameters:
                dimensions: *slot
                layout: overlay
                alignment: *center
                children:
                  - instance: buttons
                    id: label
                    name: pause-load
                    bind:
                      schema: select
                      target:
                        selection: load
                        selector: save-01
                  - instance: panes
                    id: transparent
                    name: pause-load-text
                    parameters:
                      dimensions: *slot
                    bind:
                      schema: text
                      target:
                        content: LOAD

            # --- OPTIONS ---
            - instance: panes
              id: transparent
              name: pause-options-slot
              parameters:
                dimensions: *slot
                layout: overlay
                alignment: *center
                children:
                  - instance: buttons
                    id: label
                    name: pause-options
                    bind:
                      schema: select
                      target:
                        selection: menu
                        selector: options
                  - instance: panes
                    id: transparent
                    name: pause-options-text
                    parameters:
                      dimensions: *slot
                    bind:
                      schema: text
                      target:
                        content: OPTIONS

            # --- QUIT ---
            - instance: panes
              id: transparent
              name: pause-quit-slot
              parameters:
                dimensions: *slot
                layout: overlay
                alignment: *center
                children:
                  - instance: buttons
                    id: label
                    name: pause-quit
                    bind:
                      schema: select
                      target:
                        selection: quit
                        selector: main
                  - instance: panes
                    id: transparent
                    name: pause-quit-text
                    parameters:
                      dimensions: *slot
                    bind:
                      schema: text
                      target:
                        content: QUIT