menus:
  text:
    controller: scroll
    roots: 
      - id: neutral
        name: text-menu
        position:
          # 480 x 480
          px: 0.175
          py: 0.60
        layout: dock
        alignment: center
        gap: 15
        children: 
          - instance: pages
            id: notification
            name: text-display
            bind:
              state: context.content
          
          # Use the 40x40 slot to constrain horizontal width
          - id: transparent-slot
            name: text-scroll-buttons
            layout: stack
            alignment: center
            gap: 5
            children:
              - instance: buttons
                id: arrow-up
                name: text-scroll-up
                bind: 
                  selection: scrollup
                  selector: text-display
              - instance: buttons
                id: arrow-down
                name: text-scroll-down
                bind: 
                  selection: scrolldown
                  selector: text-display