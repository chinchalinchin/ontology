menus:
  text:
    controller: scroll
    roots: 
      - id: neutral
        name: text-menu
        position:
          px: 0.1
          py: 0.55
        layout: dock
        alignment: start
        gap: 10
        children: 
          - instance: pages
            id: dialogue
            name: text-display
            bind:
              state: context.content
          - instance: buttons
            id: arrow-up
            name: text-scroll-up
            bind: 
              selection: scrollup
              selector: text-display
          - instance: buttons
            id: arrow-down
            name: text-scroll-down
            bind: 
              selection: scrolldown
              selector: text-display