compositions:
  brick-house:
    root:
      strut: 
        id: frame-brick
        name: house
        elevation: 0
      components:
        objects:
          doors:
            - id: door-house
              name: entrance
              outlayer: brick-house-compose-layer
              elevation: 0
              position:
                x: 32
                y: 118
              anchor: 24
              out:
                x: 82
                y: 143
    branches:
      - strut: 
          id: wall-up-blue
          name: house-interior
          owner: bind(root.owner)
          layer: brick-house-compose-layer
          elevation: 0
          position:
            x: 0
            y: 0
        components:
          crafts: 
            struts:
              - id: floor-area-wood
                name: house-floor
                layer: brick-house-compose-layer
                owner: bind(root.owner)
                elevation: -1
                position:
                  x: 0
                  y: 96
          effects:
            passive:
              - id: grandfather-clock
                name: grandfather-clock-00 
                layer: brick-house-compose-layer
                elevation: 0
                position:
                  x: -4
                  y: 30
          objects:
            doors:
              - id: door-shadow
                name: house-doorframe
                layer: brick-house-compose-layer
                outlayer: bind(root.layer)
                elevation: 0
                position:
                  x: 47
                  y: 142
                out:
                  x: 43
                  y: 163
            crates:
              - id: wood-bookshelf
                name: house-bookshelf
                layer: brick-house-compose-layer
                elevation: 0
                position: 
                  x: 29
                  y: 44