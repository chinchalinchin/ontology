compositions:
  brick-house:
    root:
      strut: 
        id: frame-brick
        name: house
      components:
        objects:
          doors:
            - id: door-house
              name: entrance
              outlayer: brick-house-compose-layer
              depth: 1
              height: bind(parent.height) 
              position:
                x: 32
                y: 118
              out:
                x: 82
                y: 143
    branches:
      - strut: 
          id: wall-blue
          name: house-interior
          owner: bind(root.owner)
          layer: brick-house-compose-layer
          depth: 0 
          position:
            x: 0
            y: 0
        components:
          effects:
            passive:
              - id: grandfather-clock
                name: grandfather-clock-00 
                position:
                  x: -4
                  y: 30
                layer: brick-house-compose-layer                
                depth: 0
          objects:
            doors:
              - id: door-shadow
                name: house-doorframe
                layer: brick-house-compose-layer
                outlayer: bind(root.layer)
                depth: 0
                position:
                  x: 47
                  y: 142
                out:
                  x: 43
                  y: 163
            crate:
              - id: bookshelf
                name: house-bookshelf
                layer: brick-house-compose-layer
                depth: 0
                position: 
                  x: 29
                  y: 44
          crafts: 
            struts:
              - id: floor-wood
                name: house-floor
                layer: brick-house-compose-layer
                owner: bind(root.owner)
                depth: 0
                height: -100 # FORCE TO BOTTOM: Always render behind the player
                position:
                  x: 0
                  y: 96