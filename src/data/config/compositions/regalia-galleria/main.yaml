            struts:
              - id: mansion
                name: room-8-floor
                layer: *room-8-layer
                material: *geologic-alt
                blueprint: floors
                multiple:
                  nx: 3
                  ny: 3
                position:
                  x: 0
                  y: bind(parent.span.l)