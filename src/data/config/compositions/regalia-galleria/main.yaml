# -------------------- COMPOSITION THEME
theme:
  geologic: &geologic marble
  geologic-alt: &geologic-alt granite
  chromatic: &chromatic red
  chromatic-alt: &chromatic-alt blue
  neutral: &neutral neutral
layers:
  hallway: &hallway-layer galleria-hallway-layer
  room-1: &room-1-layer galleria-reactions-layer
  room-2: &room-2-layer galleria-elevations-layer
  room-3: &room-3-layer galleria-passivity-layer
  room-4: &room-4-layer galleria-vanity-layer
  room-5: &room-5-layer galleria-study-layer
  room-6: &room-6-layer galleria-annex-1-layer
  room-7: &room-7-layer galleria-annex-2-layer
  room-8: &room-8-layer galleria-annex-3-layer
# --------------------------------------------------
compositions:
  regalia-galleria:
    # ==================================================
    # EXTERIOR (ROOT)
    # ==================================================
    root:
      strut:
        id: mansion
        name: exterior-roof
        material: *geologic
        blueprint: roofs
        multiple:
          nx: 3
          ny: 1
      components:
        crafts:
          struts:
            - id: mansion
              name: exterior-walls
              material: *geologic-alt
              blueprint: walls
              multiple:
                nx: 3
                ny: 1
              position:
                x: 0
                y: bind(parent.span.l)
            - id: pillar
              name: exterior-pillar-west
              material: *geologic
              blueprint: shafts
              multiple:
                nx: 1
                ny: 1
              anchor: anchor(exterior-walls)
              position:
                x: bind(self.dimensions.w)
                y: bind(exterior-walls.position.y)
            - id: pillar
              name: exterior-pillar-east
              material: *geologic
              blueprint: shafts
              multiple:
                nx: 1
                ny: 1
              anchor: anchor(exterior-walls)
              position:
                x: bind(parent.span.w) - (2 * bind(self.dimensions.w))
                y: bind(exterior-walls.position.y)
            - id: banner
              name: exterior-banner-west
              material: *chromatic
              blueprint: decor
              anchor: anchor(exterior-walls)
              position:
                x: (bind(parent.dimensions.w) - bind(self.dimensions.w)) // 2
                y: bind(exterior-walls.position.y) + (bind(exterior-walls.span.l) - bind(self.dimensions.l)) // 2
            - id: banner
              name: exterior-banner-east
              material: *chromatic-alt
              blueprint: decor
              anchor: anchor(exterior-walls)
              position:
                x: bind(parent.span.w) - (bind(parent.dimensions.w) + bind(self.dimensions.w)) // 2
                y: bind(exterior-walls.position.y) + (bind(exterior-walls.span.l) - bind(self.dimensions.l)) // 2
        objects:
          doors:
            - id: panel
              name: entrance-door
              material: *chromatic
              anchor: anchor(exterior-walls)
              outlayer: *hallway-layer
              position:
                x: (bind(parent.span.w) - bind(self.dimensions.w)) // 2
                y: bind(exterior-walls.position.y) + bind(exterior-walls.span.l) - bind(self.dimensions.l)
              out:
                x: bind(hallway-wall.position.x) + (bind(hallway-floor.span.w) - bind(self.dimensions.w)) // 2
                y: bind(hallway-wall.position.y) + bind(hallway-floor.position.y) + bind(hallway-floor.span.l) - bind(self.dimensions.l)

    # ==================================================
    # INTERIOR BRANCHES
    # ==================================================
    branches:
      # ------------------------------------------------
      # MAIN GALLERY HALLWAY
      # ------------------------------------------------
      - strut:
          id: mansion
          name: hallway-wall
          layer: *hallway-layer
          material: *geologic
          blueprint: halls
          multiple:
            nx: 3
            ny: 1
          position:
            x: 10
            y: 10
        components:
          crafts:
            struts:
              - id: mansion
                name: hallway-floor
                layer: *hallway-layer
                material: *geologic-alt
                blueprint: floors
                multiple:
                  nx: 3
                  ny: 5
                position:
                  x: 0
                  y: bind(parent.span.l)
              - id: carpet
                name: hallway-runner
                layer: *hallway-layer
                material: *chromatic
                blueprint: designs
                multiple:
                  nx: 1
                  ny: 5
                position:
                  x: (bind(parent.span.w) - bind(self.dimensions.w)) // 2
                  y: bind(parent.span.l)
          objects:
            doors:
              # --- WEST DOORS (ROOMS 1, 3, 5, 7)
              - id: panel
                name: door-room-1
                layer: *hallway-layer
                material: *chromatic
                anchor: anchor(parent)
                outlayer: *room-1-layer
                position:
                  x: 16
                  y: bind(parent.span.l) - bind(self.dimensions.l)
                out:
                  x: bind(room-1-wall.position.x) + (bind(room-1-floor.span.w) - bind(self.dimensions.w)) // 2
                  y: bind(room-1-wall.position.y) + bind(room-1-floor.position.y) + bind(room-1-floor.span.l) - bind(self.dimensions.l)
              - id: panel
                name: door-room-3
                layer: *hallway-layer
                material: *chromatic
                outlayer: *room-3-layer
                position:
                  x: 16
                  y: bind(parent.span.l) + bind(parent.dimensions.l) - bind(self.dimensions.l)
                out:
                  x: bind(room-3-wall.position.x) + (bind(room-3-floor.span.w) - bind(self.dimensions.w)) // 2
                  y: bind(room-3-wall.position.y) + bind(room-3-floor.position.y) + bind(room-3-floor.span.l) - bind(self.dimensions.l)
              - id: panel
                name: door-room-5
                layer: *hallway-layer
                material: *chromatic
                outlayer: *room-5-layer
                position:
                  x: 16
                  y: bind(parent.span.l) + (2 * bind(parent.dimensions.l)) - bind(self.dimensions.l)
                out:
                  x: bind(room-5-wall.position.x) + (bind(room-5-floor.span.w) - bind(self.dimensions.w)) // 2
                  y: bind(room-5-wall.position.y) + bind(room-5-floor.position.y) + bind(room-5-floor.span.l) - bind(self.dimensions.l)
              - id: panel
                name: door-room-7
                layer: *hallway-layer
                material: *neutral
                outlayer: *room-7-layer
                position:
                  x: 16
                  y: bind(parent.span.l) + (3 * bind(parent.dimensions.l)) - bind(self.dimensions.l)
                out:
                  x: bind(room-7-wall.position.x) + (bind(room-7-floor.span.w) - bind(self.dimensions.w)) // 2
                  y: bind(room-7-wall.position.y) + bind(room-7-floor.position.y) + bind(room-7-floor.span.l) - bind(self.dimensions.l)
              # --- EAST DOORS (ROOMS 2, 4, 6, 8)
              - id: panel
                name: door-room-2
                layer: *hallway-layer
                material: *chromatic-alt
                anchor: anchor(parent)
                outlayer: *room-2-layer
                position:
                  x: bind(parent.span.w) - bind(self.dimensions.w) - 16
                  y: bind(parent.span.l) - bind(self.dimensions.l)
                out:
                  x: bind(room-2-wall.position.x) + (bind(room-2-floor.span.w) - bind(self.dimensions.w)) // 2
                  y: bind(room-2-wall.position.y) + bind(room-2-floor.position.y) + bind(room-2-floor.span.l) - bind(self.dimensions.l)
              - id: panel
                name: door-room-4
                layer: *hallway-layer
                material: *chromatic-alt
                outlayer: *room-4-layer
                position:
                  x: bind(parent.span.w) - bind(self.dimensions.w) - 16
                  y: bind(parent.span.l) + bind(parent.dimensions.l) - bind(self.dimensions.l)
                out:
                  x: bind(room-4-wall.position.x) + (bind(room-4-floor.span.w) - bind(self.dimensions.w)) // 2
                  y: bind(room-4-wall.position.y) + bind(room-4-floor.position.y) + bind(room-4-floor.span.l) - bind(self.dimensions.l)
              - id: panel
                name: door-room-6
                layer: *hallway-layer
                material: *neutral
                outlayer: *room-6-layer
                position:
                  x: bind(parent.span.w) - bind(self.dimensions.w) - 16
                  y: bind(parent.span.l) + (2 * bind(parent.dimensions.l)) - bind(self.dimensions.l)
                out:
                  x: bind(room-6-wall.position.x) + (bind(room-6-floor.span.w) - bind(self.dimensions.w)) // 2
                  y: bind(room-6-wall.position.y) + bind(room-6-floor.position.y) + bind(room-6-floor.span.l) - bind(self.dimensions.l)
              - id: panel
                name: door-room-8
                layer: *hallway-layer
                material: *neutral
                outlayer: *room-8-layer
                position:
                  x: bind(parent.span.w) - bind(self.dimensions.w) - 16
                  y: bind(parent.span.l) + (3 * bind(parent.dimensions.l)) - bind(self.dimensions.l)
                out:
                  x: bind(room-8-wall.position.x) + (bind(room-8-floor.span.w) - bind(self.dimensions.w)) // 2
                  y: bind(room-8-wall.position.y) + bind(room-8-floor.position.y) + bind(room-8-floor.span.l) - bind(self.dimensions.l)

      # ------------------------------------------------
      # ROOM 1 — THE HALL OF REACTIONS
      # ------------------------------------------------
      - strut:
          id: mansion
          name: room-1-wall
          layer: *room-1-layer
          material: *geologic
          blueprint: halls
          multiple:
            nx: 3
            ny: 1
          position:
            x: 10
            y: 10
        components:
          crafts:
            struts:
              - id: mansion
                name: room-1-floor
                layer: *room-1-layer
                material: *geologic-alt
                blueprint: floors
                multiple:
                  nx: 3
                  ny: 3
                position:
                  x: 0
                  y: bind(parent.span.l)
          effects:
            reactables:
              - id: spinning-dummy
                name: dummy-west
                layer: *room-1-layer
                intention: attack
                position:
                  x: (bind(parent.dimensions.w) - bind(self.dimensions.w)) // 2
                  y: bind(room-1-floor.position.y) + bind(parent.dimensions.l)
              - id: spinning-dummy
                name: dummy-center
                layer: *room-1-layer
                intention: attack
                position:
                  x: (bind(room-1-floor.span.w) - bind(self.dimensions.w)) // 2
