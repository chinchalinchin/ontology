                blueprint: floors
                elevation: 0
                multiple:
                  nx: 3
                  ny: 3
                position:
                  x: 0
                  y: bind(parent.span.l)
              - id: mansion
                name: surface-tier-1-west
                layer: *room-2-layer
                material: *geologic
                blueprint: flats
                elevation: 1
                multiple:
                  nx: 2
                  ny: 1
                position:
                  x: 0
                  y: bind(room-2-floor.position.y)
              - id: mansion
                name: surface-tier-2-east
                layer: *room-2-layer
                material: *geologic-alt
                blueprint: flats
                elevation: 2
                multiple:
                  nx: 1
                  ny: 1
                position:
                  x: bind(surface-tier-1-west.span.w)
                  y: bind(room-2-floor.position.y)
              - id: mansion
                name: surface-tier-1-south
                layer: *room-2-layer
                material: *geologic
                blueprint: flats
                elevation: 1
                multiple:
                  nx: 1
                  ny: 1
                position:
                  x: bind(surface-tier-1-west.span.w)
                  y: bind(room-2-floor.position.y) + bind(parent.dimensions.l)
            stairs:
              - id: steps
                name: stairs-ground-to-tier-1
                layer: *room-2-layer
                material: *geologic
                blueprint: up
                elevation: 0
                delta: 1
                position:
                  x: (bind(parent.dimensions.w) - bind(self.dimensions.w)) // 2
                  y: bind(room-2-floor.position.y) + bind(parent.dimensions.l)
              - id: steps
                name: stairs-tier-1-to-tier-2
                layer: *room-2-layer
                material: *geologic-alt
                blueprint: right
                elevation: 1
                delta: 1
                position:
                  x: bind(surface-tier-1-west.span.w) - bind(self.dimensions.w)
                  y: bind(surface-tier-1-west.position.y)
              - id: steps
                name: stairs-tier-2-to-tier-1
                layer: *room-2-layer
                material: *geologic
                blueprint: up
                elevation: 1
                delta: 1
                position:
                  x: bind(surface-tier-2-east.position.x) + (bind(surface-tier-2-east.span.w) - bind(self.dimensions.w)) // 2
                  y: bind(surface-tier-2-east.position.y) + bind(surface-tier-2-east.span.l)
              - id: steps
                name: stairs-tier-1-to-ground
                layer: *room-2-layer
                material: *geologic-alt
                blueprint: left
                elevation: 0
                delta: 1
                position:
                  x: bind(surface-tier-1-south.position.x) - bind(self.dimensions.w)
                  y: bind(surface-tier-1-south.position.y)

      # ------------------------------------------------
      # ROOM 3 — THE HALL OF PASSIVITY
      # ------------------------------------------------
      - strut:
          id: mansion
          name: room-3-wall
          layer: *room-3-layer
          material: *geologic
          blueprint: halls
          multiple:
            nx: 3
            ny: 1
          position:
            x: 10
            y: 10
        components:
          crafts:
            struts:
              - id: mansion
                name: room-3-floor
                layer: *room-3-layer
                material: *geologic-alt
                blueprint: floors
                multiple:
                  nx: 3
                  ny: 3
                position:
                  x: 0
                  y: bind(parent.span.l)
          effects:
            passive:
              - id: torch
                name: passivity-torch-west
                layer: *room-3-layer
                anchor: anchor(parent)
                position:
                  x: (bind(parent.dimensions.w) - bind(self.dimensions.w)) // 2
                  y: (bind(parent.span.l) - bind(self.dimensions.l)) // 2
              - id: grandfather-clock
                name: passivity-clock-center
                layer: *room-3-layer
                anchor: anchor(parent)
                position:
                  x: (bind(parent.span.w) - bind(self.dimensions.w)) // 2
                  y: bind(parent.span.l) - bind(self.dimensions.l)
              - id: torch
                name: passivity-torch-east
                layer: *room-3-layer
                anchor: anchor(parent)
                position:
                  x: bind(parent.span.w) - (bind(parent.dimensions.w) + bind(self.dimensions.w)) // 2
                  y: (bind(parent.span.l) - bind(self.dimensions.l)) // 2
              - id: birdbath
                name: passivity-birdbath-west
                layer: *room-3-layer
                position:
                  x: (bind(parent.dimensions.w) - bind(self.dimensions.w)) // 2
                  y: bind(room-3-floor.position.y) + bind(parent.dimensions.l)
              - id: birdbath
                name: passivity-birdbath-east
                layer: *room-3-layer
                position:
                  x: bind(room-3-floor.span.w) - (bind(parent.dimensions.w) + bind(self.dimensions.w)) // 2
                  y: bind(room-3-floor.position.y) + bind(parent.dimensions.l)

      # ------------------------------------------------
      # ROOM 4 — THE HALL OF VANITY
      # ------------------------------------------------
      - strut:
          id: mansion
          name: room-4-wall
          layer: *room-4-layer
          material: *geologic
          blueprint: halls
          multiple:
            nx: 3
            ny: 1
          position:
            x: 10
            y: 10
        components:
          crafts:
            struts:
              - id: mansion
                name: room-4-floor
                layer: *room-4-layer
                material: *geologic-alt
                blueprint: floors
                multiple:
                  nx: 3
                  ny: 3
                position:
                  x: 0
                  y: bind(parent.span.l)
              - id: curtain
                name: vanity-curtain
                layer: *room-4-layer
                material: *chromatic
                blueprint: decor
                anchor: anchor(parent)
                position:
                  x: 8
                  y: bind(parent.span.l) - bind(self.dimensions.l)
              - id: banner
                name: vanity-banner
                layer: *room-4-layer
                material: *chromatic-alt
                blueprint: decor
                anchor: anchor(parent)
                position:
                  x: 48
                  y: (bind(parent.span.l) - bind(self.dimensions.l)) // 2
              - id: painting
                name: vanity-painting
                layer: *room-4-layer
                material: *chromatic
                blueprint: decor
                anchor: anchor(parent)
                position:
                  x: 84
                  y: (bind(parent.span.l) - bind(self.dimensions.l)) // 2
              - id: fireplace
                name: vanity-fireplace
                layer: *room-4-layer
                material: *geologic
                blueprint: decor
                anchor: anchor(parent)
                position:
                  x: (bind(parent.span.w) - bind(self.dimensions.w)) // 2
                  y: bind(parent.span.l) - bind(self.dimensions.l)
              - id: portrait
                name: vanity-portrait
                layer: *room-4-layer
                material: *chromatic-alt
                blueprint: decor
                anchor: anchor(parent)
                position:
                  x: 192
                  y: (bind(parent.span.l) - bind(self.dimensions.l)) // 2
              - id: taxidermy
                name: vanity-taxidermy
                layer: *room-4-layer
                material: *neutral
                blueprint: decor
                anchor: anchor(parent)
                position:
                  x: 240
                  y: (bind(parent.span.l) - bind(self.dimensions.l)) // 2
              - id: dresser
                name: vanity-dresser
                layer: *room-4-layer
                material: *chromatic
                blueprint: decor
                position:
                  x: 16
                  y: bind(room-4-floor.position.y) + 16
              - id: table
                name: vanity-table
                layer: *room-4-layer
                material: *chromatic
                blueprint: decor
                position:
                  x: (bind(room-4-floor.span.w) - bind(self.dimensions.w)) // 2
                  y: bind(room-4-floor.position.y) + bind(parent.dimensions.l)
              - id: palette
                name: vanity-palette
                layer: *room-4-layer
                material: *chromatic-alt
                blueprint: decor
                position:
                  x: bind(room-4-floor.span.w) - bind(self.dimensions.w) - 16
                  y: bind(room-4-floor.position.y) + 16

      # ------------------------------------------------
      # ROOM 5 — THE HALL OF STUDY
      # ------------------------------------------------
      - strut:
          id: mansion
          name: room-5-wall
          layer: *room-5-layer
          material: *geologic
          blueprint: halls
          multiple:
            nx: 3
            ny: 1
          position:
            x: 10
            y: 10
        components:
          crafts:
            struts:
              - id: mansion
                name: room-5-floor
                layer: *room-5-layer
                material: *geologic-alt
                blueprint: floors
                multiple:
                  nx: 3
                  ny: 3
                position:
                  x: 0
                  y: bind(parent.span.l)
          objects:
            signs:
              - id: plaque
                name: study-plaque
                layer: *room-5-layer
                material: *geologic
                persona: galleria-plaque
                lexicon: spring
                anchor: anchor(parent)
                position:
                  x: (bind(parent.dimensions.w) - bind(self.dimensions.w)) // 2
                  y: bind(parent.span.l) - bind(self.dimensions.l)
              - id: poster
