              - id: spinning-dummy
                name: dummy-east
                layer: *room-1-layer
                intention: attack
                position:
                  x: bind(room-1-floor.span.w) - (bind(parent.dimensions.w) + bind(self.dimensions.w)) // 2
                  y: bind(room-1-floor.position.y) + bind(parent.dimensions.l)

      # ------------------------------------------------
      # ROOM 2 — THE HALL OF ELEVATIONS
