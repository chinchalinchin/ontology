                  y: bind(parent.span.l) - bind(self.dimensions.l)

      # ------------------------------------------------
      # ROOM 6 — EXHIBITION ANNEX I (EMPTY)
      # ------------------------------------------------
      - strut:
          id: mansion
          name: room-6-wall
          layer: *room-6-layer
          material: *geologic
          blueprint: halls
          multiple:
            nx: 3
            ny: 1
          position:
            x: 10
            y: 10
        components:
