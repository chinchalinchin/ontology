              elevation: -1
              name: galleria-ext-plaza-3
              position: { x: 288, y: 96 }
            - id: carpet-cotton-gold-border
              elevation: -1
              name: galleria-ext-runner
              position: { x: 145, y: 97 }
        objects:
          doors:
            # Occupies root-relative x: 160..224, y: 128..192 (local y: 32..96)
            - id: door-double
              name: galleria-ext-entrance
              position: { x: 160, y: 32 }
              anchor: anchor(galleria-ext-wall-center)
              outlayer: 'galleria-hallway'
              out: { x: 352, y: 152 }
          signs:
            - id: bulletin
              name: galleria-ext-directory
              position: { x: 312, y: 120 }
              persona: galleria-exterior-sign
              lexicon: spring
        effects:
          passive:
            - id: torch
