              position: { x: 96, y: -96 }
            - id: wall-stone-gold-plated
              name: galleria-ext-crown-center-east
              position: { x: 192, y: -96 }
            - id: wall-stone-gold-plated
              name: galleria-ext-crown-east
              position: { x: 288, y: -96 }
            - id: skylight-iron-octagon
              name: galleria-ext-skylight
              position: { x: 80, y: -96 }
              anchor: anchor(galleria-ext-wall-center)
