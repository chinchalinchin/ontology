              position: { x: 256, y: -32 }
            - id: pillar-stone-corinthian
              name: galleria-ext-pillar-ne
              position: { x: 352, y: -32 }
            # --- Facade Arched Windows ---
            - id: window-mansion-glass-arched
              name: galleria-ext-window-west
              position: { x: 33, y: 12 }
              anchor: anchor(parent)
            - id: window-mansion-glass-arched
              name: galleria-ext-window-east
              position: { x: 289, y: 12 }
              anchor: anchor(galleria-ext-wall-east)
            # --- Forecourt Plaza Surfaces (y: 192..288, w: 384) ---
            - id: support-granite-border
              elevation: -1
              name: galleria-ext-plaza-0
              position: { x: 0, y: 96 }
            - id: support-granite-border
              elevation: -1
              name: galleria-ext-plaza-1
              position: { x: 96, y: 96 }
