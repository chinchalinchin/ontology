compositions:
  castle-dawn:
    root:
      strut: 
        id: wall-up-stone
        name: castle-dawn-exterior
        elevation: 0
      components:
        crafts: 
          struts:
            # Overhang canopy / high roof
            - id: roof-slate
              name: castle-dawn-roof
              owner: bind(root.owner)
              elevation: 0
              position:
                x: -34
                y: -255
            - id: window-stone
              name: castle-dawn-window
              owner: bind(root.owner)
              elevation: 0
              position:
                x: -33
                y: -194
            - id: buttress-stone
              name: castle-dawn-buttress
              owner: bind(root.owner)
              elevation: 0
              position:
                x: 0
                y: -33
            - id: turret-stone
              name: castle-dawn-turret-00
              owner: bind(root.owner)
              elevation: 0
              position:
                x: -66
                y: -33
            - id: turret-stone
              name: castle-dawn-turret-01
              owner: bind(root.owner)
              elevation: 0
              position:
                x: 188
                y: -33
            - id: tower-stone
              name: castle-dawn-tower-00
              owner: bind(root.owner)
              elevation: 0
              position:
                x: -65
                y: -219
            - id: tower-stone
              name: castle-dawn-tower-01
              owner: bind(root.owner)
              elevation: 0
              position:
                x: 220
                y: -219
            # Exterior upper walkway deck (elevation: 1)
            - id: floor-horizontal-stone
              name: castle-dawn-flatroof-00
              owner: bind(root.owner)
              elevation: -1
              position:
                x: -49
                y: -82
            - id: railing-up-stone
              name: castle-dawn-railing-00
              owner: bind(root.owner)
              elevation: 1
              position:
                x: -10
                y: -48
            - id: railing-right-stone
              name: castle-dawn-railing-01
              owner: bind(root.owner)
              elevation: 1
              position:
                x: 235
                y: -82
            - id: railing-left-stone
              name: castle-dawn-railing-02
              owner: bind(root.owner)
              elevation: 1
              position:
                x: -65
                y: -85
        effects:
          passive:
            - id: torch
              name: exterior-torch-01
              elevation: 0
              anchor: 15
              position:
                x: 143
                y: 3
            - id: torch
              name: exterior-torch-02
              elevation: 0
              anchor: 15
              position:
                x: 11
                y: 3
              animation:
                frame: 4
        objects:
          gates:
            - id: castle-gate
              name: castle-entrance
              link: castle-gate-link
              elevation: 0
              position:
                x: 62
                y: 16
          plates:
            - id: stone-switch
              name: castle-entrance-switch
              link: castle-gate-link
              elevation: 0
              position:
                x: -47
                y: 111
          doors: 
            - id: door-castle-open
              name: castle-entrance-open
              elevation: 0
              position:
                x: 62
                y: 16
              outlayer: castle-atrium-layer
              out:
                x: 160
                y: 320
            # Walkway doors on upper deck (elevation: 1)
            - id: door-mansion
              name: castle-dawn-roof-door-left
              elevation: 1
              position:
                x: 6
                y: -130
              outlayer: castle-atrium-layer
              out:
                x: 16
                y: 140
            - id: door-mansion
              name: castle-dawn-roof-door-right
              elevation: 1
              position:
                x: 150
                y: -130
              outlayer: castle-atrium-layer
              out:
                x: 303
                y: 140
    branches:
      - strut: 
          id: floor-area-marble-checkered
          name: castle-atrium-floor
          owner: bind(root.owner)
          layer: castle-atrium-layer
          elevation: -1
          position:
            x: 0
            y: 0
        components:
          crafts: 
            platforms:
              - id: platform-marble
                name: castle-dawn-platform-01
                owner: bind(root.owner)
                elevation: 0
                position:
                  x: 0
                  y: 136
              - id: platform-marble
                name: castle-dawn-platform-02
                owner: bind(root.owner)
                elevation: 0
                position:
                  x: 222
                  y: 136
              - id: platform-marble
                name: castle-dawn-platform-03
                owner: bind(root.owner)
                elevation: 1
                position:
                  x: 222
                  y: 0
              - id: platform-marble
                name: castle-dawn-platform-04
                owner: bind(root.owner)
                elevation: 1
                position:
                  x: 0
                  y: 0
              
            struts:
              # --------------- SUBSTRATE FLOORS (elevation: -1)
              - id: floor-area-marble-checkered
                name: castle-dawn-floor-02
                owner: bind(root.owner)
                elevation: -1
                position:
                  x: 23
                  y: 213
              - id: floor-area-marble-checkered
                name: castle-dawn-floor-03
                owner: bind(root.owner)
                elevation: -1
                position:
                  x: 23
                  y: 81   
              - id: floor-area-carpet-palace
                name: castle-dawn-floor-01
                owner: bind(root.owner)
                elevation: -1
                position:
                  x: 75
                  y: 219  
              - id: floor-vertical-marble-diamonds
                name: castle-dawn-floor-04
                owner: bind(root.owner)
                elevation: -1
                position:
                  x: 252
                  y: 187  
              - id: floor-vertical-marble-diamonds
                name: castle-dawn-floor-05
                owner: bind(root.owner)
                elevation: -1
                position:
                  x: 0
                  y: 187  
              # --------------- GROUND WALL FACADES (elevation: 0)
              - id: wall-up-palace
                name: castle-dawn-wall-00
                owner: bind(root.owner)
                elevation: 0
                position:
                  x: 96
                  y: -2
              - id: wall-up-stone-gold-plated
                name: castle-dawn-wall-01
                owner: bind(root.owner)
                elevation: 0
                position:
                  x: 0
                  y: 41
              - id: wall-up-stone-gold-plated
                name: castle-dawn-wall-02
                owner: bind(root.owner)
                elevation: 0
                position:
                  x: 222
                  y: 41
              # --------------- PILLARS (elevation: 1)
              - id: pillar-marble
                name: castle-dawn-pillar-01
                owner: bind(root.owner)
                # anchor = (platform.y + platform.l) - (pillar.y + pillar.l)
                # = (136 + 111) - (19 + 96) = 247 - 215 = 32                
                anchor: anchor(castle-dawn-platform-01)
                elevation: 1
                position:
                  x: 76
                  y: 119
              - id: pillar-marble
                name: castle-dawn-pillar-02
                owner: bind(root.owner)
                elevation: 1
                # anchor = (platform.y + platform.l) - (pillar.y + pillar.l)
                # = (136 + 111) - (19 + 96) = 247 - 215 = 32
                anchor: anchor(castle-dawn-platform-02)
                position:
                  x: 223
                  y: 119
            stairs:
              - id: stairs-up-stone
                name: castle-dawn-stairs-01
                owner: bind(root.owner)
                direction: up
                elevation: 0
                delta: 1
                position:
                  x: 0
                  y: 216
              - id: stairs-up-stone
                name: castle-dawn-stairs-02
                owner: bind(root.owner)
                direction: up
                elevation: 0
                delta: 1
                position:
                  x: 286
                  y: 216
          effects:
            passive:
              - id: torch
                name: interior-torch-02
                elevation: 0
                anchor: 28
                position:
                  x: 96
                  y: 2
              - id: torch
                name: interior-torch-01
                elevation: 0
                anchor: 28
                position:
                  x: 192
                  y: 2
          objects:
            doors:
              # Lower exits/entrances on ground tier (elevation: 0)
              - id: door-double
                name: throne-room-entrance
                elevation: 0
                position:
                  x: 128
                  y: 29
                outlayer: throne-room-layer
                out:
                  x: 0
                  y: 0
              - id: door-shadow-double
                name: atrium-exit
                elevation: 0
                position:
                  x: 127
                  y: 350
                outlayer: bind(root.layer)
                out:
                  x: 94
                  y: 95
              # Balcony exits on upper deck (elevation: 1)
              - id: door-mansion
                name: castle-roof-exit-00
                elevation: 1
                position:
                  x: 0
                  y: 88
                outlayer: bind(root.layer)
                out:
                  x: 22
                  y: -75
              - id: door-mansion
                name: castle-roof-exit-01
                elevation: 1
                position:
                  x: 287
                  y: 88
                outlayer: bind(root.layer)
                out:
                  x: 166
                  y: -75