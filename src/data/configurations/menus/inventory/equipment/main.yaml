# ---------------------------------------------------------------------
# -------------------------------------------------------- MENU: THEMES
# ---------------------------------------------------------------------
themes:
  colors:
    pane: &pane dark-solid
    pane-alt: &pane-alt dark-texture
  alignments:
    top: &top
      horizontal: center
      vertical: start
    center: &center
      horizontal: center
      vertical: center
    start: &start
      horizontal: start
      vertical: center
  dimensions:
    root: &root
      pw: 0.67
      pl: 0.80
    column: &column
      pw: 0.32
      pl: 0.60
    body: &body
      pw: 0.65
      pl: 0.65
    label: &label
      pw: 0.50
      pl: 0.06
    sublabel: &sublabel
      pw: 0.30
      pl: 0.06
    row: &row
      pw: 0.50
      pl: 0.08
    slot: &slot
      pw: 0.08
      pl: 0.08
    gizmo-strip: &gizmo-strip
      pw: 0.32
      pl: 0.08
    gizmo-grid: &gizmo-grid
      pw: 0.32
      pl: 0.16
  parameters:
    collection-strip: &collection-strip
      capacity: 4
      columns: 4
      gap: 5
      pane: transparent
      button: slot
      dimensions: *gizmo-strip
    collection-grid: &collection-grid
      capacity: 8
      columns: 4
      gap: 5
      pane: transparent
      button: slot
      dimensions: *gizmo-grid
    disabled: &disabled
      status: disabled
    selected: &selected
      status: selected
    display: &display
      dimensions: *label
      layout: overlay
      alignment: *center
    subdisplay: &subdisplay
      dimensions: *sublabel
      layout: overlay
      alignment: *center
# ---------------------------------------------------------------------
# ---------------------------------------------------- MENU: EQUIPMENT
# ---------------------------------------------------------------------
menus:
  equipment:
    controller: inventory
    roots:
      - instance: panes
        id: *pane-alt
        name: equipment-menu
        parameters:
          dimensions: *root
          justification: *top
          alignment: *center
          layout: stack
          font: menu
          gap: 10
          margins: 5
          children:
            # ------------------------------------------
            # ------------------------ EQUIPMENT: HEADER
            # ------------------------------------------
            - instance: panes
              id: transparent
              name: equipment-header-pane
              parameters: *display
              bind:
                schema: text
                target:
                  content: EQUIPMENT
            # ------------------------------------------
            # -------------------------- EQUIPMENT: GEAR
            # ------------------------------------------
            - instance: panes
              id: transparent
              name: equipment-gear-row
              parameters:
                dimensions: *row
                layout: dock
                alignment: *center
                gap: 10
                children:
                  # ----------------------- SLOT: ARMOR
                  - instance: panes
                    id: transparent
                    name: equipment-armor-slot-pane
                    parameters:
                      dimensions: *slot
                      layout: overlay
                      alignment: *center
                      children:
                        - instance: buttons
                          id: slot
                          name: equipment-armor-slot
                          parameters: *disabled
                        - instance: icons
                          id: armor
                          name: equipment-armor-icon
                          bind:
                            schema: icon
                            target:
                              icon: context.slots.equipment.armor
                  # ---------------------- SLOT: SHIELD
                  - instance: panes
                    id: transparent
                    name: equipment-shield-slot-pane
                    parameters:
                      dimensions: *slot
                      layout: overlay
                      alignment: *center
                      children:
                        - instance: buttons
                          id: slot
                          name: equipment-shield-slot
                          parameters: *disabled
                        - instance: icons
                          id: shields
                          name: equipment-shield-icon
                          bind:
                            schema: icon
                            target:
                              icon: context.slots.equipment.shield
            # ------------------------------------------
            # ------------------------ EQUIPMENT: WEAPON
            # ------------------------------------------
            - instance: panes
              id: transparent
              name: equipment-weapon-row
              parameters:
                dimensions: *row
                layout: dock
                alignment: *center
                gap: 10
                children:
                  - instance: panes
                    id: transparent
                    name: equipment-weapon-slot-pane
                    parameters:
                      dimensions: *slot
                      layout: overlay
                      alignment: *center
                      children:
                        - instance: buttons
                          id: slot
                          name: equipment-weapon-slot
                          parameters: *disabled
                        - instance: icons
                          id: weapons
                          name: equipment-weapon-icon
                          bind:
                            schema: icon
                            target:
                              icon: context.slots.equipment.weapon
                  - instance: gizmos
                    id: weapons
                    name: equipment-weapons-grid
                    bind:
                      schema: collection
                      target:
                        source: context.inventory.sheathe
                        capacity: 4
                        columns: 4
                    parameters: *collection-strip
            # ------------------------------------------
            # -------------------------- EQUIPMENT: TOOL
            # ------------------------------------------
            - instance: panes
              id: transparent
              name: equipment-tool-row
              parameters:
                dimensions: *row
                layout: dock
                alignment: *center
                gap: 10
                children:
                  - instance: panes
                    id: transparent
                    name: equipment-tool-slot-pane
                    parameters:
                      dimensions: *slot
                      layout: overlay
                      alignment: *center
                      children:
                        - instance: buttons
                          id: slot
                          name: equipment-tool-slot
                          parameters: *disabled
                        - instance: icons
                          id: tools
                          name: equipment-tool-icon
                          bind:
                            schema: icon
                            target:
                              icon: context.slots.equipment.tool
                  - instance: gizmos
                    id: tools
                    name: equipment-tools-grid
                    bind:
                      schema: collection
                      target:
                        source: context.inventory.belt
                        capacity: 4
                        columns: 4
                    parameters: *collection-strip
            # ------------------------------------------
            # ----------------------- EQUIPMENT: UTILITY
            # ------------------------------------------
            - instance: panes
              id: transparent
              name: equipment-utility-row
              parameters:
                dimensions: *row
                layout: dock
                alignment: *center
                gap: 10
                children:
                  - instance: panes
                    id: transparent
                    name: equipment-utility-slot-pane
                    parameters:
                      dimensions: *slot
                      layout: overlay
                      alignment: *center
                      children:
                        - instance: buttons
                          id: slot
                          name: equipment-utility-slot
                          parameters: *disabled
                        - instance: icons
                          id: utilities
                          name: equipment-utility-icon
                          bind:
                            schema: icon
                            target:
                              icon: context.slots.equipment.utility
                  - instance: gizmos
                    id: utilities
                    name: equipment-utilities-grid
                    bind:
                      schema: collection
                      target:
                        source: context.inventory.bag
                        capacity: 4
                        columns: 4
                    parameters: *collection-strip