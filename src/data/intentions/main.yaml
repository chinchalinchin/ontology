intentions:
  attack:
    - next: attack
      conditions:  
        - sprite.goal.category == 'sprite'
    - next: hunt
      conditions: 
        - not sprite.goal
        - sprite.memory.goal.category == 'sprite'
    - next: scavenge
      conditions: 
        - sprites[sprite.goal.name].mutators.triggers.dead
  attract:
    - next: barter
      conditions:
        - sprite.inventory.loot
        - sprite.psyche.motivation == 'profit'
    - next: speak
      conditions: 
        - sprite.memory.communications
  barter:
    - next: threaten
      conditions:
        - sprite.memory.goal.category == 'loot'
        - sprite.inventory.wallet < sprite.prices[sprite.memory.goal.name]
        - sprite.psyche.motivation == 'survival'
    - next: speak
      conditions: 
        - sprite.intention
  build:
    - next: find
      conditions:
        - sprite.intention 
  escape: 
    - next: escape
      conditions: 
        - sprites[sprite.goal.name].intention == 'attack'
    - next: return
      conditions: 
        - not sprite.goal
  find: 
    - next: scavenge
      conditions: 
        - sprite.intention
    - next: return
      conditions:
        - sprite.intention
  follow: 
    - next: follow
      conditions:
        - sprite.intention
    - next: hunt
      conditions:
        - sprite.intention  
    - next: wander
      conditions:
        - sprite.intention 
  hunt: 
    - next: attack
      conditions: 
        - sprite.intention 
  idle: 
    - next: idle
      conditions:
        - sprite.intention
    - next: wander
      conditions:
        - sprite.intention
  interact:
    - next: find
      conditions: 
        - sprite.intention
  mine:
    - next: build
      conditions:
        - sprite.intention
  mock:
    - next: mock
      conditions:
        - sprite.intention 
    - next: threaten
      conditions:
        - sprite.intention 
  return:
    - next: idle
      conditions: 
        - sprite.intention
    - next: return
      conditions:
        - sprite.intention
    - next: wander
      conditions: 
        - sprite.intention
  scavenge:
    - next: return
      conditions:
        - sprite.intention
  speak:
    - next: follow
      conditions: 
        - sprite.intention
  sprint:
    - next: return
      conditions: 
        - sprite.intention
  threaten:
    - next: attack
      conditions:
        - sprite.intention
    - next: hunt
      conditions:
        - sprite.intention   
    - next: threaten
      conditions:
        - sprite.intention
  wander:
    - next: idle
      conditions:
        - sprite.intention