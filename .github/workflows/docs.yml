name: ontology-docs

on:
  workflow_run:
    workflows:
      - ontology-tests
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  docs:
    name: ontology-docs
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    container:
      image: chinchalinchin/ontology-builder:latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup
        run: |
          uv venv --python 3.14
          uv pip install --group docs --group analysis --group build

      - name: cache-cython
        id: cache-cython
        uses: actions/cache@v4
        with:
          path: |
            src/libs/**/*.so
            src/libs/**/*.c
            build/
          key: ${{ runner.os }}-cython-v2-${{ hashFiles('src/libs/**/*.pyx', 'src/libs/**/*.pxd', 'setup.cicd.py') }}

      - name: compile
        if: steps.cache-cython.outputs.cache-hit != 'true'
        run: |
          uv run python setup.cicd.py build_ext --inplace --force

      - name: download-coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: docs/coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: dependency-trees
        run: | 
          chmod +x scripts/dependencies/main.sh
          uv run ./scripts/dependencies/main.sh

      - name: generate-schemas
        run: |
          mkdir -p docs/static/yaml
          PYTHONPATH=src uv run python src/cli.py schema --target all --format yaml --out docs/static/yaml

      - name: documentation
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git config --global --add safe.directory /__w/ontology/ontology
          uv run mkdocs gh-deploy --force