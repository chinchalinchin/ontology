name: ontology-tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: ontology-tests
    runs-on: ubuntu-latest
    container:
      image: chinchalinchin/ontology-builder:latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup
        run: |
          uv venv --python 3.14
          uv pip install -r requirements.txt

      - name: cache
        id: cache-cython
        uses: actions/cache@v4
        with:
          path: |
            libs/**/*.so
            libs/**/*.c
            build/
          # Invalidate cache if any Cython source file or the build script changes
          key: ${{ runner.os }}-cython-${{ hashFiles('libs/**/*.pyx', 'libs/**/*.pxd', 'setup.py') }}

      - name: compile
        # Only run compilation if an exact cache match was not found
        if: steps.cache-cython.outputs.cache-hit != 'true'
        run: |
          uv run python setup.py build_ext --inplace

      - name: test
        run: |
          uv run pytest --cov=src --cov=libs --cov-report=html:coverage-html tests/unit/

      - name: upload-coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-html/