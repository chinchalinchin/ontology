name: ontology-tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: ontology-tests
    runs-on: ubuntu-latest
    container:
      image: chinchalinchin/ontology-builder:latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup
        run: |
          uv venv --python 3.14
          uv pip install -r requirements.txt
          uv pip install pytest

      - name: compile
        run: |
          uv run python setup.py build_ext --inplace

      - name: test
        run: |
          uv run pytest tests/unit/