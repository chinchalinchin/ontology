name: ontology-tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: ontology-tests
    runs-on: ubuntu-latest
    container:
      image: chinchalinchin/ontology-builder:latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup
        run: |
          uv venv --python 3.14
          uv pip install -r requirements.txt

      - name: cache
        id: cache-cython
        uses: actions/cache@v4
        with:
          path: |
            src/libs/**/*.so
            src/libs/**/*.c
            build/
          key: ${{ runner.os }}-cython-v2-${{ hashFiles('src/libs/**/*.pyx', 'src/libs/**/*.pxd', 'setup.cicd.py') }}

      - name: compile
        if: steps.cache-cython.outputs.cache-hit != 'true'
        run: |
          uv run python setup.cicd.py build_ext --inplace --force

      - name: test
        env:
          COVERAGE_CORE: ctrace
        run: |
          uv run pytest --cov=src --cov-report=html:coverage-html tests/unit/

      - name: upload-coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-html/