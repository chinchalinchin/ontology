# ----------------------------------------------------
tools:
# ----------------------------------------------------
  views:
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: MANAGER
    # --------------------------------------------
    manager:
      board: false
      specs: false
      docs: true
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: SOURCE
    # --------------------------------------------
    source:
      data: true
      filter: true
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: SHELL
    # --------------------------------------------
    shell:
      directory: true
      commands: false
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: TESTS
    # --------------------------------------------
    tests:  
      pipeline: false
      fixtures: false
      session: false
      workflow: false
# ----------------------------------------------------
  parameters:
    # --------------------------------------------
    # ------------------------ PARAMETERS: MANAGER
    # --------------------------------------------
    manager:
      board:
        phase: '07-04'
        action: refactor
      docs:
        exclude:
          - index.md
          # - 00-overview.md
          # - 01-assets.md
          - 02-sprites.md
          # - 03-compositions.md
          - 04-intentions.md
          - 05-mechanics.md
          - 06-widgets.md
          - 07-sounds.md
          - 08-plots.md
          - 09-ecology.md
          - 10-emergence.md
          # - 11-architecture.md
      specs: []
    # --------------------------------------------
    # ------------------------ PARAMETERS: SOURCE
    # --------------------------------------------
    source:
      filter:
        default: OR
        queries:
            # ------------------------------------
            # - title: TITLE
            #   strategy: AND | OR
            #   scan:
            #     app: [ 
            #             base, core, component,
            #             config, schema, semantics,
            #             input, mechanics 
            #     ]
            #     asset: [ 
            #             property, state, frame,
            #             animation, hitbox 
            #     ]
            #     domain: [ 
            #               abstract, concrete, model,
            #               logic, graphics
            #     ]
            #     category: [ 
            #               crafts, cursors, effects,
            #               geography, objects, resources,
            #               sheets, tiles, widgets 
            #     ]
            #     main: [ 
            #               cli, hydration 
            #     ]
            #     physics: [ 
            #               fields, motion, space 
            #     ]
            #     workflows: [ 
            #               collisions, combat, compositions,
            #               ecology, fluids, intentions,
            #               menus, motion, orchestration,
            #               navgiation, rendering, seasons,
            #               telemetry 
            #     ]
            # ------------------------------------
            - title: Abstracts
              strategy: AND
              scan:
                app: [ component ]
                domain: [ abstract ]
            # ------------------------------------
            - title: Components
              strategy: AND
              scan:
                app: [ core, component ]
                domain: [ system ]
            # ------------------------------------
            - title: Implementations
              strategy: AND
              scan:
                app: [ asset ]
                domain: [ concrete ]
                category: [ crafts ]
            # ------------------------------------
            - title: Models
              strategy: AND
              scan:
                domain: [ model ]
                category: [ crafts ]
            # ------------------------------------
            - title: Composition Logic
              strategy: AND 
              scan:
                domain: [ logic ]
                app: [ module ]
                workflows: [ compositions ]
            - title: Composition Services
              strategy: AND
              scan:
                app: [ services ]
                workflows: [ compositions ]
      data: 
        # properties: [ 
        #                   crafts, cursors, effects,
        #                   fonts, geography, objects
        #                   resources, sheets, sounds
        #                   tiles, widgets
        # ]
        properties: [ crafts ]
        # state: [
        #                   crafts, effects, objects
        #                   objects, resources, sheets,
        #                   tiles, world
        # ]
        state: []
        # configurations: [
        #                   actions, compositions, intentions,
        #                   library, mappings, materials,
        #                   mechanics, menus, plots,
        #                   recipes, stages
        # ]
        configurations: [ materials, recipes]
        # templates: [
        #                   menu-dump, registry-dump, sdl-dump, 
        #                   state-dump
        # ]
        templates: [  ]
    # --------------------------------------------
    # ------------------------ PARAMETERS: SHELL
    # --------------------------------------------
    shell:
      directory: |
        tree -L 3 --gitignore -I "build|*.so|*.png|__pycache__|__init__.py"
      commands: []
    # --------------------------------------------
    # ------------------------ PARAMETERS: TESTS
    # --------------------------------------------
    tests:
      pipeline:
        command: pytest -m
        marker: collisions
      workflow: collisions
      fixtures:
        # ----------------------- FIXTURES: CONFIGURATIONS
        # - configuration/compositions
        # - configuration/groups
        # - configuration/recipes
        # - configuration/transitions
        # - configuration/schemas
        # ----------------------- FIXTURES: PROPERTIES
        # - properties/crafts
        # - properties/cursors
        - properties/effects
        # - properties/fonts
        # - properties/geography
        - properties/objects
        # - properties/resources
        - properties/sheets
        - properties/tiles
        # - properties/widgets
        - properties/schemas
        # ----------------------- FIXTURES: STATE
        # - state/crafts
        - state/effects
        - state/objects
        # - state/resources
        - state/sheets
        # - state/world
        - state/schemas
        # ----------------------- FIXTURES: APPLICATIONS
        - assets
        - components
        # - menus
        # - services
        # - structures
      session:
        description: |
          - Player is unable to traverse stairs to platform. 
          - Stairs render on top of Player after (player.state.position.y + player.state.dimensions.l > stairs.state.position.y + stairs.state.dimensions.l)

          **NOTE**: The Stairs functionality has never actually been tested.