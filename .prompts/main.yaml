  # template: design/style/mermaid.md.j2
# ----------------------------------------------------
  # PLACEHOLDER UNTIL STRUCTURE EMERGES FOR TOOL
  parameters:
    automata: stages 
    composition: castle-dawn
    diagram: executor-centennial-transitions.mmd
    table: executor-centennial-transitions.md
# ----------------------------------------------------
# ----------------------------------------------------
# ---------------------------------------------- TOOLS
# ----------------------------------------------------
# ----------------------------------------------------
tools:
# ----------------------------------------------------
  views:
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: MANAGER
    # --------------------------------------------
    manager:
      board: false
      specs: false
      docs: false
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: SOURCE
    # --------------------------------------------
    source:
      data: true
      filter: false
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: SHELL
    # --------------------------------------------
    shell:
      directory: false
      commands: false
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: TESTS
    # --------------------------------------------
    tests:  
      configuration: true
      pipeline: true
      session: false
# ----------------------------------------------------
  parameters:
    # --------------------------------------------
    # ------------------------ PARAMETERS: MANAGER
    # --------------------------------------------
    manager:
      board:
        phase: '07-04'
        action: refactor
      docs:
        exclude:
          - index.md
          # - 00-overview.md
          # - 01-assets.md
          - 02-sprites.md
          - 03-compositions.md
          - 04-intentions.md
          # - 05-mechanics.md
          - 06-widgets.md
          - 07-sounds.md
          - 08-plots.md
          # - 09-ecology.md
          - 10-emergence.md
          # - 11-architecture.md
      specs: []
    # --------------------------------------------
    # ------------------------ PARAMETERS: SOURCE
    # --------------------------------------------
    source:
      filter:
        default: AND
        queries:
          - title: Test Fixtures
            scan:
              test: [ fixtures ]
      data:
        properties: [ effects, geography, gates, crafts, sheets, objects, tiles, resources ]
        state: [ world-testbed ]
        configurations: [ ]
        templates: [  ]
    # --------------------------------------------
    # -------------------------- PARAMETERS: SHELL
    # --------------------------------------------
    shell:
      directory: |
        tree -L 3 --gitignore -I "build|*.so|*.png|__pycache__|__init__.py"
      commands: 
        - python /Users/gmoore/Home/projects/ontology/src/main.py start
    # --------------------------------------------
    # ------------------------ PARAMETERS: TESTS
    # --------------------------------------------
    tests:
      pipeline:
        command: pytest -m
        marker: workflow_fluids
      session:
        description: |
          description