# ----------------------------------------------------
task:
# ----------------------------------------------------
  template: iterate/grooming.md.j2
# ----------------------------------------------------
  parameters:
    diagram: mechanics-fluid.mmd
# ----------------------------------------------------
tools:
# ----------------------------------------------------
  views:
    manager:
      board: true
      specs: false
      docs: true
    source:
      workflow: true
    shell:
      directory: true
      commands: false
    tests:  
      pipeline: false
      fixtures: false
      session: false
      workflow: false
# ----------------------------------------------------
  parameters:
    manager:
      board:
        phase: '10'
        action: achieve
      docs:
        exclude:
          - index.md
          - 02-sprites.md
          - 03-compositions.md
          - 04-intentions.md
          - 06-widgets.md
          - 07-sounds.md
          - 08-plots.md
          - 09-emergence.md
      specs: []
    source:
      workflow: main
    shell:
      directory: |
        tree -L 3 --gitignore -I "build|*.so|*.png|__pycache__|__init__.py"
      commands: []
    tests:
      pipeline:
        command: pytest -m
        marker: fluids
      fixtures:
        - assets
        - components
        - properties/crafts
        - properties/effects
        - properties/objects
        - state/crafts
        - state/effects
        - state/objects
        - services
        - structures
        # - menus
      workflow: fluids
      session:
        description: null
        conditions:
          - src/assets/effects/fluids/main.yaml
          - src/assets/crafts/bridges.yaml
          - src/data/state/world-01/effects/fluids.yaml
          - src/data/state/world-01/crafts/bridges.yaml
