tools:
# ----------------------------------------------------
  views:
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: MANAGER
    # --------------------------------------------
    manager:
      board: false
      specs: false
      docs: true
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: METRICS
    # --------------------------------------------
    metrics:
      pstats: false
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: SOURCE
    # --------------------------------------------
    source:
      data: false
      filter: true
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: SHELL
    # --------------------------------------------
    shell:
      directory: true
      commands: false
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: TESTS
    # --------------------------------------------
    tests:  
      configuration: true
      pipeline: false
      session: false
# ----------------------------------------------------
  parameters:
    # --------------------------------------------
    # ------------------------ PARAMETERS: MANAGER
    # --------------------------------------------
    manager:
      board:
        phase: '07-04'
        action: refactor
      docs:
        exclude:
          # - 00-overview
          # - 01-assets
          - 02-sprites
          - 03-compositions
          - 04-intentions
          - 05-mechanics
          - 06-widgets
          - 07-sounds
          - 08-plots
          - 09-ecology
          - 10-chemistry
          - 11-emergence
          # - 12-architecture
      specs:
        - 00-dialogue
        - 01-interaction
        - 02-wander
    metrics:
      pstats: 
        run: |
          python -m cProfile -o $ROOT/engine-run.pstats src/main.py start world-01
        dot: |
          gprof2dot -f pstats --node-thres=1.0 --edge-thres=0.5 $ROOT/engine-run.pstats
    # --------------------------------------------
    # ------------------------ PARAMETERS: SOURCE
    # --------------------------------------------
    source:
      filter:
        default: AND
        queries:
          # - title: Asset Abstract
          #   scan: 
          #     domain: [ abstract ]
          #     app: [ asset ]
          # - title: Mechanic Abstract
          #   scan:
          #     domain: [ abstract ]
          #     app: [ mechanic ]
          # - title: Sheet Implementations
          #   scan:
          #     domain: [ concrete ]
          #     app: [ asset ]
          #     category: [ sheets ]
          # - title: Sheet Models
          #   scan:
          #     domain: [ model ]
          #     category: [ sheets ]
          # - title: Navigation Workflow
          #   scan:
          #     workflows: [ navigation ]

          - title: Cython Subsystems
            scan:
              domain: [ system ]
              app: [ library ]
              workflows: [ rendering ]
          - title: Application Orchestration
            scan: 
              domain: [ system ]
              app: [ orchestration ]
          - title: Test Fixtures
            scan:
              test: [ fixtures ]
      data:
        properties: [ ]
        state: [ ]
        configurations: [ ]
        templates: [ ]
    # --------------------------------------------
    # -------------------------- PARAMETERS: SHELL
    # --------------------------------------------
    shell:
      directory: |
        tree -L 3 --gitignore -I "build|*.so|*.png|__pycache__|__init__.py"
      commands: 
        - python /Users/gmoore/Home/projects/ontology/src/main.py start
    # --------------------------------------------
    # -------------------------- PARAMETERS: TESTS
    # --------------------------------------------
    tests:
      pipeline:
        command: pytest -m
        marker: workflow_navigation
        # scope: '**/test_{actuator,cartographer}.py'
      session:
        description: |
          description