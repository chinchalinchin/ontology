# ----------------------------------------------------
properties:
  files:
    index: index.md
    mkdocs: mkdocs.yaml
  paths:
    # ---------------------------------------
    root: <path>
    # ---------------------------------------
    actions: .githubs/workflows/
    # ---------------------------------------
    blocks: .prompts/tasks/blocks/
    board: .prompts/board/
    docs: docs/
    diagrams: docs/static/mmd/
    dumps: src/data/dumps/
    fixtures: tests/unit/fixtures/
    logs: src/data/logs/
    phases: .prompts/board/phases/
    templates: .prompts/board/templates
    tests: tests/unit/
  project:
    title: ontology
  user:
    username: <username>
    ssh: <keypath>
    hostname: <hostname>
  urls: 
    github: github.com/chinchalinchin
# ----------------------------------------------------
task:
# ----------------------------------------------------
  template: <path>/<file>.md.j2
# ----------------------------------------------------
  parameters:
    diagram: <diagram>.mmd
    workflow: <workflow>
# ----------------------------------------------------
tools:
# ----------------------------------------------------
  views:
    manager:
      board: false
      specs: false
      docs: false
    source:
      data: false
      filter: false
    shell:
      directory: false
      commands: false
    tests:  
      console: false
      fixtures: false
      session: false
      workflow: false
# ----------------------------------------------------
  parameters:
    manager:
      board:
        phase: <phase>
        action: <action>
      docs:
        exclude:
          - <doc-page>.md
      specs:
        - <spec-page>.md
    source:
    source:
      filter:
        default: <AND | OR | NOT>
        queries:
            - strategy: <AND | OR | NOT>
              scan: 
                app: [ <app-tag> ]
                asset: [ <asset-tag> ]
                category: [ <category-tag> ]
                main: [ <main-tag> ]
                workflows: [ <workflow-tag> ]
      data:
        configurations: 
          - <configuration>
        properties: 
          - <property>
        state: 
          - <state>
    shell:
      directory: <cmd>
      commands: []
    tests:
      console:
        pytest: pytest -m 
        marker: <workflow>
      fixtures:
        - <fixture>
      workflow: <workflow>
      session:
        description: |
          <description>