# ----------------------------------------------------
task:
# ----------------------------------------------------
  template: <path>/<file>.md.j2
# ----------------------------------------------------
  parameters:
    diagram: <diagram>.mmd
    workflow: <workflow>
# ----------------------------------------------------
tools:
# ----------------------------------------------------
  views:
    # ------------------------------------------------
    manager:
      board: false
      specs: false
      docs: false
    # ------------------------------------------------
    source:
      data: false
      filter: false
    # ------------------------------------------------
    shell:
      directory: false
      commands: false
    # ------------------------------------------------
    tests:  
      console: false
      fixtures: false
      session: false
      workflow: false
# ----------------------------------------------------
  parameters:
    # ------------------------------------------------
    manager:
      board:
        phase: <phase>
        action: <action>
      docs:
        exclude:
          - <doc-page>.md
      specs:
        - <spec-page>.md
    # ------------------------------------------------
    source:
      filter:
        default: <AND | OR>
        queries:
            - title: <title>
              strategy: <AND | OR>
              scan: 
                <tag-prefix>: [ <tag> ]
      data:
        configurations: 
          - <configuration>
        properties: 
          - <property>
        state: 
          - <state>
    # ------------------------------------------------
    shell:
      directory: <cmd>
      commands: []
    # ------------------------------------------------
    tests:
      console:
        pytest: pytest -m 
        marker: <workflow>
      fixtures:
        - <fixture>
      workflow: <workflow>
      session:
        description: |
          <description>