# ----------------------------------------------------
properties:
  files:
    index: index.md
    mkdocs: mkdocs.yaml
  paths:
    # ---------------------------------------
    root: <path>
    # ---------------------------------------
    actions: .githubs/workflows/
    # ---------------------------------------
    blocks: .prompts/tasks/blocks/
    board: .prompts/board/
    docs: docs/
    diagrams: docs/static/mmd/
    dumps: src/data/dumps/
    fixtures: tests/unit/fixtures/
    logs: src/data/logs/
    phases: .prompts/board/phases/
    templates: .prompts/board/templates
    tests: tests/unit/
  project:
    title: ontology
  user:
    username: <username>
    ssh: <keypath>
    hostname: <hostname>
  urls: 
    github: github.com/chinchalinchin
# ----------------------------------------------------
task:
# ----------------------------------------------------
  template: <path>/<file>.md.j2
# ----------------------------------------------------
  parameters:
    diagram: <diagram>.mmd
    workflow: <workflow>
# ----------------------------------------------------
tools:
# ----------------------------------------------------
  views:
    manager:
      board: false
      specs: false
      docs: false
    source:
      workflow: false
    shell:
      directory: false
      commands: false
    tests:  
      console: false
      fixtures: false
      workflow: false
# ----------------------------------------------------
  parameters:
    manager:
      board:
        phase: <board-phase>
        action: <board-action>
      docs:
        exclude:
          - <doc-page>.md
      specs:
        - <spec-page>.md
    source:
      workflow: <workflow>
    shell:
      directory: tree -L 3 --gitignore -I "build|*.so|*.png|__pycache__|__init__.py"
      commands: []
    tests:
      console:
        pytest: pytest -m <workflow>
      fixtures:
        - <fixture>
      workflow: <workflow>