# ----------------------------------------------------
# ----------------------------------------------------
# ----------------------------------------------- TASK
# ----------------------------------------------------
# ----------------------------------------------------
task:
# ----------------------------------------------------
  template: draft.md.j2
# ----------------------------------------------------
# ----------------------------------------------------
# ---------------------------------------------- TOOLS
# ----------------------------------------------------
# ----------------------------------------------------
tools:
# ----------------------------------------------------
  views:
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: MANAGER
    # --------------------------------------------
    manager:
      board: false
      specs: false
      docs: true
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: SOURCE
    # --------------------------------------------
    source:
      data: true
      filter: true
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: SHELL
    # --------------------------------------------
    shell:
      directory: false
      commands: false
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: TESTS
    # --------------------------------------------
    tests:  
      configuration: true
      pipeline: true
      session: false
# ----------------------------------------------------
  parameters:
    # --------------------------------------------
    # ------------------------ PARAMETERS: MANAGER
    # --------------------------------------------
    manager:
      board:
        phase: '07-04'
        action: refactor
      docs:
        exclude:
          - index.md
          # - 00-overview.md
          # - 01-assets.md
          - 02-sprites.md
          # - 03-compositions.md
          - 04-intentions.md
          - 05-mechanics.md
          - 06-widgets.md
          - 07-sounds.md
          - 08-plots.md
          - 09-ecology.md
          - 10-emergence.md
          # - 11-architecture.md
      specs: []
    # --------------------------------------------
    # ------------------------ PARAMETERS: SOURCE
    # --------------------------------------------
    source:
      filter:
        default: AND
        queries:
          - title: Test Fixtures
            scan:
              test: [ fixtures ]
          - title: Composition Services
            scan:
              app: [ services ]
              workflows: [ compositions ]
          - title: Perimeter Services
            scan:
              app: [ services ]
              workflows: [ generation, collisions ]
      data:
        properties: [ crafts ]
        state: [ world-testbed ]
        configurations: [ compositions/brick-house ]
        templates: [  ]
    # --------------------------------------------
    # -------------------------- PARAMETERS: SHELL
    # --------------------------------------------
    shell:
      directory: |
        tree -L 3 --gitignore -I "build|*.so|*.png|__pycache__|__init__.py"
      commands: []
    # --------------------------------------------
    # ------------------------ PARAMETERS: TESTS
    # --------------------------------------------
    tests:
      pipeline:
        command: pytest -m
        marker: workflow_compositions
        # scope: '**/test_{actuator,cartographer}.py'
      session:
        description: |
          description