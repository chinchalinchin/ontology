queries:
  compositions:
    - title: Asset Abstracts
      strategy: AND
      scan:
        app: [ asset ]
        domain: [ abstract ]
    # ------------------------------------
    - title: Material Implementations
      scan:
        app: [ asset ]
        domain: [ concrete ]
        modality: [ material ]
    # ------------------------------------
    - title: Material Models
      scan:
        domain: [ model ]
        modality: [ material ]
    # ------------------------------------
    - title: Composition Logic
      scan:
        domain: [ logic ]
        workflows: [ compositions ]
    # ------------------------------------
    - title: Plot Services
      scan:
        app: [ services ]
        workflows: [ plot ]
