queries:
  # -------------------------------------------------------
  # ------------------------ QUERY: COMPOSITION SOURCE CODE
  # -------------------------------------------------------
  compositions:
    # ------------------------------------
    - title: Asset Abstracts
      strategy: AND
      scan:
        domain: [ abstract ]
        app: [ asset ]
    # ------------------------------------
    - title: Material Modality
      scan:
        domain: [ model ]
        modality: [ material ]
    # ------------------------------------
    - title: Material Implementations
      scan:
        app: [ asset ]
        domain: [ concrete ]
        modality: [ material ]
    # ------------------------------------
    - title: Composition Logic
      scan:
        domain: [ logic ]
        workflows: [ compositions ]
    # ------------------------------------
    - title: Plot Services
      scan:
        app: [ services ]
        workflows: [ plot ]
  # -------------------------------------------------------
  # ----------------------------- QUERY: SPRITE SOURCE CODE
  # -------------------------------------------------------
  sprites:
    # ------------------------------------
    - title: Asset Abstracts
      scan:
        domain: [ abstract ]
        app: [ asset ]
    # ------------------------------------
    - title: Sheet Models
      scan:
        domain: [ model ]
        category: [ sheets ]
    # ------------------------------------
    - title: Sheet Implementations
      scan:
        domain: [ concrete ]
        app: [ asset ]
        category: [ sheets ]
    # ------------------------------------
    - title: Action and Intention Modality
      strategy: OR
      scan:
        modality: [ action, intention ]
    # ------------------------------------
    - title: Navigation Modules
      scan:
        app: [ module ]
        domain: [ logic ]
        workflows: [ navigation ]
    # ------------------------------------
    - title: Navigation Libraries
      scan:
        app: [ library ]
        workflows: [ navigation ]