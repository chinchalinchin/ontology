# ------------------------------------------------------------------
# ------------------------------------------------------------ TILES
tiles:
  fore:
    - id: Asset ID
      name: Deployment Name
      layer: Layer Key
      position:
        x: Horizontal Position
        y: Vertical Position
      multiple:
        nx: Number of Horizontal Multiples
        ny: Number of Vertical Multiples
  back:
    - id: Asset ID
      name: Deployment Name
      layer: Layer Key
      position:
        x: Horizontal Position
        y: Vertical Position
      multiple:
        nx: Number of Horizontal Multiples
        ny: Number of Vertical Multiples
# ------------------------------------------------------------------
# ---------------------------------------------------------- CRAFTS
crafts:
  struts:
    - id: Asset ID
      name: Deployment Name
      layer: Layer Key
      owner: Owner Name
      position:
        x: Horizontal Position
        y: Vertical Position
# ------------------------------------------------------------------
# ---------------------------------------------------------- CURSORS
cursors:
  expressions:
    - id: Cursor Asset ID
      name: Deployment Name
      layer: Layer Key
      position: 
        x: Horizontal Position
        y: Vertical Position
  projectiles:
    - id: Asset ID
      name: Deployment Name
      layer: Layer Key
      position: 
        x: Horizontal Position
        y: Vertical Position
      initial:
        x: Horizontal Position
        y: Vertical Position
# ------------------------------------------------------------------
# ---------------------------------------------------------- EFFECTS
effects:
  persistent:
    - id: Asset ID
      name: Deployment Name
      layer: Layer Key
      position:
        x: Horizontal Position
        y: Vertical Position
  temporary:
    - id: Asset ID
      name: Deployment Name
      layer: Layer Key
      position:
        x: Horizontal Position
        y: Vertical Positions
# ------------------------------------------------------------------
# ---------------------------------------------------------- OBJECTS
objects:
  chests:
    - id: Asset ID
      name: Deployment Key
      layer: Layer Key
      position:
        x: Horizontal Position
        y: Vertical Position
      switch: Switch Flag
      content:
        - Content Key
  crates:
    - id: Asset ID
      name: Deployment Key
      layer: Layer Key
      position: 
        x: Horizontal Position
        y: Vertical Position
  doors:
    - id: Asset ID
      name: Deployment Key
      layer: Layer Key
      outlayer: Out Layer Key
      position:
        x: Horizontal Position
        y: Vertical Position
      out:
        x: Horizontal Position
        y: Vertical Position
  gates:
    - id: Asset ID
      name: Deployment Key
      layer: Layer Key
      link: Plate Link Key
      position:
        x: Horizontal Position
        y: Vertical Position
      switch: Switch Flag
  plates:
    - id: Asset ID
      name: Deployment Key
      layer: Layer Key
      link: Gate Link Key
      position:
        x: Horizontal Position
        y: Vertical Position
      switch: Switch Flag
# ------------------------------------------------------------------
# ----------------------------------------------------------- SHEETS
sheets:
  players:
    - id: Asset ID
      name: Deployment Key
      layer: Layer Key
      position:
        x: Horizontal Position
        y: Vertical Position
      meters:
        health: 
          current: Current Health Meter
          maximum: Maximum Health Meter
        magic: 
          current: Current Magic Meter
          maximum: Maximum Magic Meter
      character:
        strength: Strength
        defense: Defense
        speed: Maximum Speed
        impulse: Acceleration Delta
      intention: Intention Key
      goal:
        name: Goal Name Key
        category: Goal Category Key
        position:
          x: Goal Position X
          y: Goal Position Y
  pixies:
    - id: Asset ID
      name: Pixie Deployment
      layer: Layer Key
      position:
        x: Horizontal Position
        y: Vertical Position
  sprites:
    - id: Asset ID
      name: Deployment Key
      layer: Layer Key
      position:
        x: Horizontal Position
        y: Vertical Position
      meters:
        health: 
          current: Current Health Meter
          maximum: Maximum Health Meter
        magic: 
          current: Current Magic Meter
          maximum: Maximum Magic Meter
      character:
        strength: Strength
        defense: Defense
        speed: Maximum Speed
        impulse: Acceleration Delta
      mutators:
        fear:
          radius: Pixel Length
          limit: Health Percentage
          enemy: Enemy Count
        vision:
          radius: Pixel Length
      intention: Intention Key
      psyche:
        communication: Communication Key
        expression: Expression Key
        motivation: Motivation Key
      goal:
        name: Goal Identifier
        category: Goal Category Identifier
        position: # last KNOWN position
          x: Current X Coordinate Goal
          y: Current Y Coordinate Goal
      memory:
        goal:
          name: Goal Identifier
          category: Goal Category Identifier
          position:
            x: Saved X Coordinate Goal
            y: Saved Y Coordinate Goal
        communications: 
          - Communication Key
          # unforgettable
          - Communication Key
        prices: 
          <loot-key>: Loot Price
        relationships:
          <sprite-name>: Relationship Key
        property:
          - <property-name>
      inventory: 
        loot:
          <loot-key>: Loot Key Quantity
        equipment:
          armor: Armor Key
          tool: Tool Key
          utility: Utility Key
          weapon: Weapon Key
        wallet: Money Quantity