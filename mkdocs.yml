  - Reports:
    - Unit Test Coverage: coverage/index
markdown_extensions:  
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.blocks.caption
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true 
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path: docs
exclude:
  - '**/.*.md'
  - '**/.*/**'
  - '**/patch/**'
  - '**/.drafts/**'
  - 'static/assets/**'
  - 'static/md/**'
exclude_docs: |
  **/.*.md
  **/.*/**
  **/patch/**
  **/.drafts/**
  static/assets/**
  static/md/**
extra_javascript:
  - static/js/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
plugins:
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google