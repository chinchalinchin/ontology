site_name: Ontology
site_url: https://chinchalinchin.github.io/ontology/
repo_url: https://github.com/chinchalinchin/ontology
repo_name: chinchalinchin/ontology
theme:
  name: material
  palette: 
    scheme: slate
    primary: deep purple
    accent: blue
  features:
    - content.code.copy
    - navigation.expand
    - navigation.indexes
