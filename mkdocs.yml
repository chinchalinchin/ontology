site_name: Ontology
site_url: https://chinchalinchin.github.io/ontology/
repo_url: https://github.com/chinchalinchin/ontology
repo_name: chinchalinchin/ontology

theme:
  name: material
  palette: 
    scheme: slate
    primary: deep purple
    accent: blue
  features:
    - content.code.copy
    - navigation.expand
    - navigation.indexes

nav:
  - Index: index.md
  - Overview: 00-overview.md
  - Assets: 01-assets.md
  - Sprites: 02-sprites.md
  - Compositions: 03-compositions.md
  - Intentions: 04-intentions.md
  - Mechanics: 05-mechanics.md
  - Widgets: 06-widgets.md
  - Sounds: 07-sounds.md
  - Plots: 08-plots.md
  - Ecology: 09-ecology.md
  - Chemistry: 10-chemistry.md
  - Emergence: 11-emergence.md
  - Architecture: 12-architecture.md
  - Specifications:
    - Index: specs/index.md
    - Dialogue Loop: specs/00-dialogue.md
    - Interaction Loop: specs/01-interaction.md
    - Wander Loop: specs/02-wander.md
  - Roadmap:
    - Index: board/index.md
    - Phases: 
      - Design:
        - C000 - Castle Dawn: board/phases/design/design-comp-000.md
        - C001 - Citadel of Trials: board/phases/design/design-comp-001.md
        - C002 - Regalia Galleria: board/phases/design/design-comp-002.md
      - Implement:
        - Phase 01 - Renderer: board/phases/implement/implement-01.md
        - Phase 02 - Game: board/phases/implement/implement-02.md
        - Phase 03 - Physics: board/phases/implement/implement-03.md
        - Phase 04 - Widgets: board/phases/implement/implement-04.md
        - Phase 05 - Editor: board/phases/implement/implement-05.md
        - Phase 06 - Intentions: board/phases/implement/implement-06.md
        - Phase 07 - Compositions: board/phases/implement/implement-07.md
        - Phase 08 - Pathfinding: board/phases/implement/implement-08.md
        - Phase 09 - Hydrodynamics: board/phases/implement/implement-09.md
        - Phase 10 - Seasons: board/phases/implement/implement-10.md
        - Phase 11 - Geology: board/phases/implement/implement-11.md
        - Phase 12 - Chemistry: board/phases/implement/implement-12.md
        - Phase 13 - Acoustics: board/phases/implement/implement-13.md
        - Phase 14 - Narratives: board/phases/implement/implement-14.md
        - Phase n - Commerce: board/phases/implement/implement-n.md
        - Phase n+1 - Towns: board/phases/implement/implement-n+1.md
  - Appendix: 
    - Index: appendices/index.md
    - References: appendices/00-references.md
    - Schemas: appendices/01-schemas.md
    - Diagrams: appendices/02-diagrams.md
  - Reports:
    - Unit Test Coverage: coverage/index

markdown_extensions:  
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.blocks.caption
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true 
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path: docs

exclude:
  - '**/.*.md'
  - '**/.*/**'
  - '**/.drafts/**'
  - 'static/assets/**'
  - 'static/md/**'

exclude_docs: |
  **/.*.md
  **/.*/**
  **/.drafts/**
  static/assets/**
  static/md/**
  
extra_javascript:
  - static/js/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google