site_name: Ontology
site_url: https://chinchalinchin.github.io/ontology/
repo_url: https://github.com/chinchalinchin/ontology
repo_name: chinchalinchin/ontology

theme:
  name: material
  palette: 
    scheme: slate
    primary: deep purple
    accent: blue
  features:
    - content.code.copy
    - navigation.expand
    - navigation.indexes

nav:
  - Home: index.md
  - Overview: 00-overview.md
  - Assets: 01-assets.md
  - Sprites: 02-sprites.md
  - Player: 03-player.md
  - Intentions: 04-intentions.md
  - Menus: 05-menus.md
  - Sounds: 06-sounds.md
  - Plots: 07-plots.md
  - Architecture: 08-architecture.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true 
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true

exclude:
  - '**/.*/*.md'
  - '**/.*.md'
  
extra_javascript:
  - .static/js/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google