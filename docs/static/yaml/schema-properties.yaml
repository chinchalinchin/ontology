  FontProperties:
    properties:
      alignment:
        $ref: '#/$defs/Alignments'
        default: start
      color:
        $ref: '#/$defs/RGBA'
      outline:
        anyOf:
        - $ref: '#/$defs/Outline'
        - type: 'null'
        default: null
      bold:
        default: false
        title: Bold
        type: boolean
      italics:
        default: false
        title: Italics
        type: boolean
      strikethrough:
        default: false
        title: Strikethrough
        type: boolean
      underline:
        default: false
        title: Underline
        type: boolean
      margins:
        default: 0
        title: Margins
        type: number
      size:
        default: 24
