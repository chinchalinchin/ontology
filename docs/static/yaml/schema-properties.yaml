    - continuous
    - periodic
    - temporary
    title: Frequencies
    type: string
  Frequency:
    properties:
      type:
        $ref: '#/$defs/Frequencies'
        default: continuous
      delay:
        default: 1
        title: Delay
        type: integer
      frequency:
        default: 0
        title: Frequency
        type: integer
      cooldown:
        default: 60
        title: Cooldown
        type: integer
      persist:
        default: false
        title: Persist
        type: boolean
    title: Frequency
    type: object
