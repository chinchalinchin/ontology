$defs:
  Action:
    properties:
      count:
        title: Count
        type: integer
      directions:
        additionalProperties:
          $ref: '#/$defs/Direction'
        propertyNames:
          $ref: '#/$defs/Directions'
        title: Directions
        type: object
      delay:
        default: 1
        title: Delay
        type: integer
    required:
    - count
    - directions
    title: Action
    type: object
  Actions:
    enum:
    - cast
    - thrust
    - walk
    - slash
    - shoot
    - die
    title: Actions
    type: string
  Alignments:
    enum:
    - start
    - end
    - center
    title: Alignments
    type: string
  CraftProperties:
    properties:
      dimensions:
        title: Dimensions
      priority:
        default: 0
        title: Priority
        type: integer
      mass:
        default: 0
        title: Mass
        type: integer
      material:
        anyOf:
        - $ref: '#/$defs/Material'
        - type: 'null'
        default: null
      blueprints:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Blueprints
      hitboxes:
        anyOf:
        - additionalProperties:
            items: {}
            type: array
          type: object
        - additionalProperties:
            anyOf:
            - items: {}
              type: array
            - type: 'null'
          type: object
        - items: {}
          type: array
        - type: 'null'
        default: null
        title: Hitboxes
    required:
    - dimensions
    title: CraftProperties
    type: object
  CraftPropertyInstances:
    properties:
      struts:
        additionalProperties:
          $ref: '#/$defs/CraftProperties'
        title: Struts
        type: object
      bridges:
        additionalProperties:
          $ref: '#/$defs/CraftProperties'
        title: Bridges
        type: object
      platforms:
        additionalProperties:
