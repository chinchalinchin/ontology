    - row
    title: Direction
    type: object
  Directions:
    enum:
    - up
    - left
    - down
    - right
    title: Directions
    type: string
  EffectProperties:
    properties:
      dimensions:
        title: Dimensions
      priority:
        default: 0
        title: Priority
        type: integer
      count:
        default: 1
        title: Count
        type: integer
      frequency:
        $ref: '#/$defs/Frequency'
      mass:
        default: -1
        title: Mass
        type: integer
      hitboxes:
        anyOf:
        - items: {}
          type: array
        - type: 'null'
        default: null
