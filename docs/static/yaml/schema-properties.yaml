        type: object
      stairs:
        additionalProperties:
          $ref: '#/$defs/CraftProperties'
        title: Stairs
        type: object
    title: CraftPropertyInstances
    type: object
  CursorProperties:
    properties:
      dimensions:
        title: Dimensions
      priority:
        default: 0
        title: Priority
        type: integer
      frames:
        items:
          type: string
        title: Frames
        type: array
    required:
    - dimensions
    title: CursorProperties
    type: object
  CursorPropertyInstances:
