menus:
  dialogue:
    roots: 
      - id: dialogue
        name: dialogue-menu
        position:
          px: 0.1
          py: 0.75
        layout: dock
        alignment: left
        gap: 10
        children: 
          - category: widgets
            instance: buttons
            id: slot
            name: character-portrait
            bind: 
              ref: state
              data: sprite.state.character.portrait
          - category: widgets
            instance: pages
            id: scroll
            name: character-speech
            bind: 
              ref: state
              data: sprite.state.psyche.communication
          - category: widgets
            instance: buttons
            id: arrow-up
            name: character-speech-scroll-up
            bind: 
              ref: traversal
              data: self.children[1] # Bind to scroller
          - category: widget
            instance: button
            id: arrow-down
            name: character-speech-scroll-down
            bind: 
              ref: traversal
              data: self.children[1] # Bind to scroller
  editor:
  inventory:
    roots:
      - id: main_inventory_pane
        position: 
          px: 0.1
          py: 0.1
        layout: tab
        gap: 10 
        headers:
          - category: widget
            instance: button
            id: icon
            symbols:
              - icons-equipment
        children:
          - category: widget
            instance: button
            id: icon
            pane:
              layout: stack
              widgets:
                - category: widget
                  instance: container
                  bind: sprite.state.inventory.equipment
  market:
  pause: