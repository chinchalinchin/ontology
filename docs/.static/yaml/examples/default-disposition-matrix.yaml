intents:
  dispositions:
    attack:
      actions:
        - cast
        - slash
        - shoot
        - thrust
      extensions: null
      transitions:
        - next: attack
          conditions:  
            - sprite.goal.category == 'sprite'
        - next: hunt
          conditions: 
            - not sprite.goal
            - sprite.memory.goal.category == 'sprite'
        - next: scavenge
          conditions: 
            - sprites[sprite.goal.name].mutators.triggers.dead
    attract:
      actions: null
      extensions:
        - interact
        - speak
      transitions:
        - next: barter
          conditions:
            - sprite.inventory.loot
            - sprite.intention.motivation == 'profit'
        - next: communicate
          conditions: 
            - sprite.memory.communications
    barter:
      actions: null
      extensions:
        - trade
        - speak
      transitions: 
        - next: threaten
          conditions:
            - sprite.memory.goal.category == 'loot'
            - sprite.inventory.wallet < sprite.prices[sprite.memory.goal.name]
