# ------------------------------------------------------------------
# ------------------------------------------------------------ TILES
tiles:
  - key: Tile Asset Key
    layer: Layer Key
    position:
      x: horizontal position
      y: vertical position
    multiply:
      nx: number of horizontal multiples
      ny: number of vertical multiples
# ------------------------------------------------------------------
# ----------------------------------------------------------- STRUTS
struts:
  - key: Strut AssetlKey
    mame: Strut Key
    layer: Layer ID
    owner: Owner ID
    position:
      x: horizontal position
      y: vertical position
# ------------------------------------------------------------------
# ---------------------------------------------------------- CURSORS
cursors:
  expressions:
    - name: Cursor Key
      key: Cursor Asset Key
      layer: Layer Key
      position: 
        x: Horizontal Position
        y: Vertical Position
  projectiles:
    - name: Cursor Key
      key: Cursor Asset Key
      layer: Layer Key
      position: 
        x: Horizontal Position
        y: Vertical Position
      initial:
        x: Horizontal Position
        y: Vertical Position
# ------------------------------------------------------------------
# ---------------------------------------------------------- EFFECTS
effects:
  # ------------------------------------------- PERSISTENT EFFECTS
  persistent:
    - key: Effect Asset Key
      name: Effect Key
      layer: Layer Key
      position:
        x: Horizontal Position
        y: Vertical Position
  # ------------------------------------------- TEMPORARY EFFECTS
  temporary:
    - key: Effect Asset Key
      name: Effect Key
      layer: Layer Key
      position:
        x: Horizontal Position
        y: Vertical Positions
# ------------------------------------------------------------------
# ---------------------------------------------------------- OBJECTS
objects:
  # ------------------------------------------- CHESTS
  chests:
    - name: Chest Key
      key: Chest Asset Key
      layer: Layer Key
      position:
        x: Horizontal Position
        y: Vertical Position
      switch: Switch Flag
      content:
        - Content Key
  # ------------------------------------------- CRATES
  crates:
    - name: Crate Key
      key: Crate Asset Key
      layer: Layer Key
      position: 
        x: Horizontal Position
        y: Vertical Position
  # ------------------------------------------- DOORS
  doors:
    - name: Door Key
      key: Door Asset Key
      layer: Layer Key
      outlayer: Out Layer Key
      position:
        x: Horizontal Position
        y: Vertical Position
      out:
        x: Horizontal Position
        y: Vertical Position
  # ------------------------------------------- GATES
  gates:
    - name: Gate Key
      key: Gate Asset Key
      layer: Layer Key
      link: Plate Link Key
      position:
        x: Horizontal Position
        y: Vertical Position
      switch: Switch Flag
  # ------------------------------------------- PLATES
  plates:
    - name: Plate Key
      key: Plate Asset Key
      layer: Layer Key
      link: Gate Link Key
      position:
        x: Horizontal Position
        y: Vertical Position
      switch: Switch Flag
# ------------------------------------------------------------------
# ----------------------------------------------------------- SHEETS
sheets:
  # ------------------------------------------- PIXIES
  pixies:
    - name: Pixie Key
      key: Pixie Asset Key
      layer: Layer Key
      position:
        x: Horizontal Position
        y: Vertical Position
  # ------------------------------------------- SPRITES
  sprites:
    - name: Sprite Key
      key: Sprite Asset Key
      layer: Layer Key
      position:
        x: Horizontal Position
        y: Vertical Position
      meters:
        health: 
          current: Current Health Meter
          maximum: Maximum Health Meter
        magic: 
          current: Current Magic Meter
          maximum: Maximum Magic Meter
      character:
        strength: Strength
        defense: Defense
        speed: Speed
      mutators:
        fear:
          radius: Pixel Length
          limit: Health Percentage
          enemy: Enemy Count
        vision:
          radius: Pixel Length
      intention:
        disposition: Disposition Key
        extension: Extension Key
        expression: Expression Key
        motivation: Motivation Key
        communication: Communication Key
      goal:
        name: Goal Identifier
        category: Goal Category Identifier
        intention:
          extension: Extension Key
          action: Action Key
      memory:
        name: Goal Identifier
        category: Goal Category Identifier
        intention:
          extension: Extension Key
          action: Action Key
        communications: 
          - Communication Key
          # unforgettable
          - Communication Key
        prices: 
          <loot-key>: Loot Price
      inventory: 
        loot:
          <loot-key>: Loot Key Quantity
        equipment:
          armor: Armor Key
          tool: Tool Key
          utility: Utility Key
          weapon: Weapon Key
        wallet: Money Quantity