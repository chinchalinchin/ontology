# ------------------------------------------------------------------
# ------------------------------------------------------------ TILES
tiles:
  - key: ID of Tile Asset
    layer: Layer ID
    position:
      x: horizontal position
      y: vertical position
    multiply:
      nx: number of horizontal multiples
      ny: number of vertical multiples
# ------------------------------------------------------------------
# ---------------------------------------------------------- EFFECTS
effects:
  # ------------------------------------------- PERSISTENT EFFECTS
  persistent:
    - key: Effect Asset Key
      layer: Layer Key
      position:
        x: Horizontal Position
        y: Vertical Position
  # ------------------------------------------- TEMPORARY EFFECTS
  temporary:
    - key: Effect Asset Key
      layer: Layer Key
      position:
        x: Horizontal Position
        y: Vertical Positions
# ------------------------------------------------------------------
# ---------------------------------------------------------- OBJECTS
objects:
  # ------------------------------------------- CHESTS
  chests:
    - name: Chest Identifier
      key: Chest Asset Key
      layer: Layer Key
      position:
        x: Horizontal Position
        y: Vertical Position
  # ------------------------------------------- CRATES
  crates:
    - name: Crate Identifier
      key: Crate Asset Key
      layer: Layer Key
      position: 
        x: Horizontal Position
        y: Vertical Position
  # ------------------------------------------- DOORS
  cursors: 
    - name: Cursor Identifier
      key: Cursor Asset Key
      layer: Layer Key
      position: 
        x: Horizontal Position
        y: Vertical Position
  # ------------------------------------------- DOORS
  doors:
    - name: Door Identifier
      key: Door Asset Key
      layer: Layer Key
      outlayer: Out Layer Key
      position:
        x: Horizontal Position
        y: Vertical Position
  # ------------------------------------------- GATES
  gates:
    - name: Gate Identifier
      key: Gate Asset Key
      layer: Layer Key
      link: Plate Link Key
      position:
        x: Horizontal Position
        y: Vertical Position
  # ------------------------------------------- PLATES
  plates:
    - name: Plate Identifier
      key: Plate Asset Key
      layer: Layer Key
      link: Gate Link Key
      position:
        x: Horizontal Position
        y: Vertical Position
# ------------------------------------------------------------------
# ----------------------------------------------------------- SHEETS
sheets:
  # ------------------------------------------- PIXIES
  pixies:
    - name: Pixie Identifier
      key: Pixie Asset Key
      layer: Layer Key
      position:
        x: Horizontal Position
        y: Vertical Position
  # ------------------------------------------- SPRITES
  sprites:
    - name: Sprite Identifier
      key: Sprite Asset Key
      layer: Layer Key
      position:
        x: Horizontal Position
        y: Vertical Position
      meters:
        health: 
          current: Current Health Meter
          maximum: Maximum Health Meter
        magic: 
          current: Current Magic Meter
          maximum: Maximum Magic Meter
      character:
        strength: Strength
        defense: Defense
        speed: Speed
      mutators:
        frightened:
          radius: Pixel Length
          limit: Health Percentage
          enemy: Enemy Count
        vision:
          radius: Pixel Length
      mutators:
        parameters:
          frightened:
            radius: Radius of Frightened Mutator
            limit: Health Percentage Boundary of Frightened Mutator
            enemy: Enemy Boundary of Frightened Mutator
          vision:
            radius: Radius of Vision Mutator
      intention:
        communication: Communication Key
        disposition: Disposition Key
        extension: Extension Key
        expression: Expression Key
        motivation: Motivation Key
      frame: Frame Number
      goal:
        name: Asset Identifier
        intention:
          extension: Extension Key
          action: Action Key
      memory:
        goal: 
          name: Asset Identifier
          intention:
            extension: Extension Key
            action: Action Key
        communications: 
          - Communication Key
          # unforgettable
          - Communication Key
      inventory: 
        loot:
          <loot-key>: Loot Key Quantity
        equipment:
          armor: Armor Key
          tool: Tool Key
          utility: Utility Key
          weapon: Weapon Key
        wallet: Money Quantity