assets:
  # <asset-category> tiles, cursors, effects, objects, sheets
  # **NOTE**: The <asset-category> encodes the Asset property type.
  <asset-category>:
    # <asset-instance>: fore, back,
    #                   expressions, projectiles, 
    #                   temporary, persistent, 
    #                   chests, crates, doors, gates, plates, struts
    #                   pixies, sprites
    <asset-instance>: 
      frame: <frame-implementation> 
        # single, iterable, state
      animation: <animation-implementation> 
        # temporary, persistent, binary, state
      state: <state-implementation> 
        # sprite, switch, door, positional, 
        # property, container, animator, metric
        # multiplier