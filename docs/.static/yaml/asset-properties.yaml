# ------------------------------------------------------------------
# ------------------------------------------------------------ TILES
tiles:
  back:
    dimensions:
      l: 32
      w: 32
    keys:
      - clay
      - coal
      - dirt
      - grass
      - lava
      - mud
      - sand
      - soil
      - water
      - wheat
  fore:
    dimensions:
      l: 32
      w: 32
    keys:
      - canopy
      - cloudy
# ------------------------------------------------------------------
# ----------------------------------------------------------- CRAFTS
crafts:
  struts:
    <key>:
      dim:
        l:
        w:
      hitboxes:
        - pos: 
            x:
            y:
          dim:
            l:
            w:
      cost:
        - item: <inventory-key>
          quantity: <quantity-key>
# ------------------------------------------------------------------
# ---------------------------------------------------------- CURSORS
cursors:
  expressions:
    <expression-key>:
      dimensions:
        l: Pixel Length
        w: Pixel Width
  projectiles:
    <projectile-key>:
      dimensions:
        l: Pixel Length
        w: Pixel Width
# ------------------------------------------------------------------
# ---------------------------------------------------------- EFFECTS
effects:
  persistent:
    <key>:
      count: Number of Frames
      dim:
        l: Pixel Length
        w: Pixel Width
      hitboxes:
        - pos: 
            x: Relative Horizontal Position
            y: Relative Vertical Postion
          dim:
            l: Pixel Length
            w: Pixel Width
  temporary:
    <key>:
      count: Number of Frames
      dim:
        l: Pixel Length
        w: Pixel Width
      hitboxes:
        - pos: 
            x: Relative Horizontal Position
            y: Relative Vertical Postion
          dim:
            l: Pixel Length
            w: Pixel Width
