# ------------------------------------------------------------------
# ----------------------------------------------------------- SHEETS
sheets:
  pixies:
    personas:
      <key>:
        dim:
          l: pixel length
          w: pixel width
        hitboxes:
          - pos: 
              x: relative horizontal position
              y: relative vertical position
            dim:
              l: hitbox pixel length
              w: hitbox pixel width 
        stack:
          - <sheet-asset-key>
    actions:
      <action-key>:
        count: Frame Count of Pixie Sheets
        directions:
          <direction-key>:
            row: <row-index>
            attackboxes: null
  sprites:
    personas:
      <key>:
        dim:
          l: pixel length
          w: pixel width
        hitboxes:
          - pos: 
              x: relative horizontal position
              y: relative vertical position
            dim:
              l: hitbox pixel length
              w: hitbox pixel width 
        stack:
          - <sheet-asset-key>
    actions:
      <action-key>:
        count: Frame Count of Action Row Group
        directions:
          <direction-key>:
            row: <row-index>
            attackboxes:
              - pos: 
                  x: relative horizontal position
                  y: relative vertical position
                dim:
                  l: hitbox pixel length
                  w: hitbox pixel width 
                hitframe: <hitframe-index>