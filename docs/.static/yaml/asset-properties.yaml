# ------------------------------------------------------------------
# ---------------------------------------------------------- CURSORS
cursors:
  expressions:
    <expression-key>:
      dimensions:
        l: Pixel Length
        w: Pixel Width
  projectiles:
    <projectile-key>:
      dimensions:
        l: Pixel Length
        w: Pixel Width
# ------------------------------------------------------------------
# ---------------------------------------------------------- EFFECTS
effects:
  persistent:
    <key>:
      count: Number of Frames
      shape:
        dim:
          l: Pixel Length
          w: Pixel Width
        hitboxes:
          - pos: 
              x: Relative Horizontal Position
              y: Relative Vertical Postion
            dim:
              l: Pixel Length
              w: Pixel Width
  temporary:
    <key>:
      count: Number of Frames
      shape:
        dim:
          l: Pixel Length
          w: Pixel Width
        hitboxes:
          - pos: 
              x: Relative Horizontal Position
              y: Relative Vertical Postion
            dim:
              l: Pixel Length
              w: Pixel Width
# ------------------------------------------------------------------
