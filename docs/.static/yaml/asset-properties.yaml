# ------------------------------------------------------------------
# ------------------------------------------------------------ TILES
tiles:
  back:
    dimensions:
      w: Pixel Horizontal Size
      l: Pixel Vertical Size
    ids:
      - <asset-id>
  fore:
    dimensions:
      w: Pixel Horizontal Size
      l: Pixel Vertical Size
    ids:
      - <asset-id>
# ------------------------------------------------------------------
# ----------------------------------------------------------- CRAFTS
crafts:
  struts:
    <id>:
      dimensions:
        w: Pixel Horizontal Size
        l: Pixel Vertical Size
      hitboxes:
        - position: 
            x: Relative Horizontal Position
            y: Relative Vertical Position
          dimensions:
            w: Pixel Horizontal Size
            l: Pixel Vertical Size
      cost:
        - item: <inventory-key>
          quantity: <quantity-key>
# ------------------------------------------------------------------
# ---------------------------------------------------------- CURSORS
cursors:
  expressions:
    <id>:
      dimensions:
        w: Pixel Horizontal Size
        l: Pixel Vertical Sizeh
  projectiles:
    <id>:
      dimensions:
        w: Pixel Horizontal Size
        l: Pixel Vertical Size
# ------------------------------------------------------------------
# ---------------------------------------------------------- EFFECTS
effects:
  persistent:
