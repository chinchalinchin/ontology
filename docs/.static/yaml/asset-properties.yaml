# ------------------------------------------------------------------
# ----------------------------------------------------------- SHEETS
sheets:
  pixies:
    entities:
      <key>:
        shape:
          dim:
            l: pixel length
            w: pixel width
          hitboxes:
            - pos: 
                x: relative horizontal position
                y: relative vertical position
              dim:
                l: hitbox pixel length
                w: hitbox pixel width 
    count: Frame Count of Pixie Sheets
    directions:
      - <direction-key>
  sprites:
    personas:
      - key: hero
        base: <base-asset-key>
        features:
          - <feature-asset-key>
    shape:
      dim:
        l: pixel length
        w: pixel width
      hitboxes:
        - pos: 
            x: relative horizontal position
            y: relative vertical position
          dim:
            l: hitbox pixel length
            w: hitbox pixel width 
    actions:
      <action-key>:
        count: Frame Count of Action Row Group
        directions:
          <direction-key>:
            attackboxes:
              - pos: 
                  x: relative horizontal position
                  y: relative vertical position
                dim:
                  l: hitbox pixel length
                  w: hitbox pixel width 
                hitframe: <hitframe-index>