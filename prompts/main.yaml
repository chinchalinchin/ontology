# ----------------------------------------------------
context: true
# ----------------------------------------------------
# ----------------------------------------------------
# ----------------------------------------------- TASK
# ----------------------------------------------------
# ----------------------------------------------------
task:
# ----------------------------------------------------
  template: maintain/patch.md.j2
# ----------------------------------------------------
  parameters:
    description: |
      todo
    title: todo
# ----------------------------------------------------
# ----------------------------------------------------
# ---------------------------------------------- TOOLS
# ----------------------------------------------------
# ----------------------------------------------------
tools:
# ----------------------------------------------------
  views:
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: MANAGER
    # --------------------------------------------
    manager:
      board: false
      bugs: true
      docs: true
      templates: true
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: METRICS
    # --------------------------------------------
    metrics:
      pstats: false
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: METRICS
    # --------------------------------------------
    package:
      cloud: false
      pipeline: false
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: SOURCE
    # --------------------------------------------
    source:
      data: false
      filter: true
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: SHELL
    # --------------------------------------------
    shell:
      directory: true
      commands: false
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: TESTS
    # --------------------------------------------
    tests:  
      configuration: false
      pipeline: false
      session: false
# ----------------------------------------------------
  parameters:
    # --------------------------------------------
    # ------------------- TOOL PARAMETERS: MANAGER
    # --------------------------------------------
    manager:
      board:
        phase: 01-02
        action: refactor
      bugs: []
      docs:
        exclude:
          # - 00-overview
          # - 01-assets
          # - 02-sprites
          - 03-compositions
          - 04-intentions
          # - 05-mechanics
          - 06-widgets
          - 07-acoustics
          - 08-narratives
          # - 09-ecology
          - 10-chemistry
          - 11-emergence
          # - 12-architecture
      templates:
        # - template-docs
        - template-backlog
        - template-bug
        # - template-design
        # - template-merge
        # - template-review
        # - template-spec
    metrics:
      pstats: 
        run: |
          python -m cProfile -o $ROOT/docs/static/pstats/latest.pstats src/main.py start world-01
        dot: |
          gprof2dot -f pstats --node-thres=1.0 --edge-thres=0.5 $ROOT/docs/static/pstats/latest.pstats
    # --------------------------------------------
    # -------------------- TOOL PARAMETERS: SOURCE
    # --------------------------------------------
    source:
      filter:
        default: AND
        queries:
          - title: 'Application - Core'
            scan:
              domain: [ system ]
              app: [ core, component ]
          - title: 'Application - Predicates'
            scan:
              domain: [ logic ]
              app: [ module, semantics ]
          - title: 'Board - Cache'
            scan:
              domain: [ system ]
              app: [ module, board ]
          - title: 'Asset - Abstract'
            scan:
              domain: [ abstract ]
              app: [ asset ]
          - title: 'Asset - Models'
            scan:
              domain: [ model ]
              app: [ asset ]
          - title: 'Asset - Hitboxes'
            scan:
              domain: [ concrete ]
              app: [ asset ]
              asset: [ hitbox ]
          - title: 'Relation - Material'
            scan:
              domain: [ logic ]
              app: [ module ]
              modality: [ material ]
          - title: 'Services - Generation'
            scan:
              domain: [ logic ]
              app: [ service ]
              workflows: [ generation ]
          - title: 'Libraries - Models'
            scan: 
              domain: [ model ]
              app: [ library ]
      data:
        properties: [ ]
        state: [ ]
        configurations: [  ]
        templates: [ ]
    # --------------------------------------------
    # --------------------- TOOL PARAMETERS: SHELL
    # --------------------------------------------
    shell:
      directory: |
        tree -L 3 --gitignore -I "build|*.so|*.png|__pycache__|__init__.py"
      commands: 
        - python /Users/gmoore/Home/projects/ontology/src/main.py start
    # --------------------------------------------
    # --------------------- TOOL PARAMETERS: TESTS
    # --------------------------------------------
    tests:
      pipeline:
        command: pytest -m
        marker: '"app_core or workflow_collisions"'
        # scope: '**/test_{actuator,cartographer}.py'