tools:
# ----------------------------------------------------
  views:
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: MANAGER
    # --------------------------------------------
    manager:
      board: false
      docs: false
      templates: true
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: METRICS
    # --------------------------------------------
    metrics:
      pstats: false
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: METRICS
    # --------------------------------------------
    package:
      cloud: false
      pipeline: false
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: SOURCE
    # --------------------------------------------
    source:
      data: false
      filter: false
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: SHELL
    # --------------------------------------------
    shell:
      directory: false
      commands: false
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: TESTS
    # --------------------------------------------
    tests:  
      configuration: false
      pipeline: false
      session: false
# ----------------------------------------------------
  parameters:
    # --------------------------------------------
    # ------------------------ PARAMETERS: MANAGER
    # --------------------------------------------
    manager:
      board:
        phase: 04-06
        action: refactor
      docs:
        exclude:
          # - 00-overview
          # - 01-assets
          # - 02-sprites
          - 03-compositions
          - 04-intentions
          # - 05-mechanics
          - 06-widgets
          - 07-acoustics
          - 08-narratives
          - 09-ecology
          - 10-chemistry
          - 11-emergence
          # - 12-architecture
      templates: 
        # - template-backlog
        # - template-bug
        # - template-design
        - template-merge
        # - template-review
        # - template-spec
    metrics:
      pstats: 
        run: |
          python -m cProfile -o $ROOT/engine-run.pstats src/main.py start world-01
        dot: |
          gprof2dot -f pstats --node-thres=1.0 --edge-thres=0.5 $ROOT/engine-run.pstats
    # --------------------------------------------
    # ------------------------ PARAMETERS: SOURCE
    # --------------------------------------------
    source:
      filter:
        default: AND
        queries:
          - title: Asset Abstract
            scan: 
              domain: [ abstract ]
              app: [ asset ]
          - title: Mechanic Abstract
            scan:
              domain: [ abstract ]
              app: [ mechanic ]
          - title: Asset Hitboxes
            scan:
              domain: [ concrete ]
              app: [ asset ]
              asset: [ hitbox ]
          - title: Application Core Components
            scan:
              domain: [ system ]
              app: [ core, component ]
          - title: Workflow - Collisions
            scan:
              app: [ mechanic ]
              workflows: [ collisions ]
          - title: Libraries - Collisions
            scan: 
              app: [ library ]
              workflows: [ collisions ]
          - title: Test Fixtures
            scan:
              domain: [ test ]
              test: [ fixtures ]
      data:
        properties: [ objects ]
        state: [ world-testbed ]
        configurations: [ ]
        templates: [ ]
    # --------------------------------------------
    # -------------------------- PARAMETERS: SHELL
    # --------------------------------------------
    shell:
      directory: |
        tree -L 3 --gitignore -I "build|*.so|*.png|__pycache__|__init__.py"
      commands: 
        - python /Users/gmoore/Home/projects/ontology/src/main.py start
    # --------------------------------------------
    # -------------------------- PARAMETERS: TESTS
    # --------------------------------------------
    tests:
      pipeline:
        command: pytest -m
        marker: workflow_collisions
        # scope: '**/test_{actuator,cartographer}.py'