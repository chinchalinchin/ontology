# ----------------------------------------------------
# ----------------------------------------------------
# ---------------------------------------------- TOOLS
# ----------------------------------------------------
# ----------------------------------------------------
tools:
# ----------------------------------------------------
  views:
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: MANAGER
    # --------------------------------------------
    manager:
      board: false
      docs: true
      templates: true
      specs: false
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: METRICS
    # --------------------------------------------
    metrics:
      pstats: false
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: SOURCE
    # --------------------------------------------
    source:
      data: false
      filter: true
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: SHELL
    # --------------------------------------------
    shell:
      directory: false
      commands: false
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: TESTS
    # --------------------------------------------
    tests:  
      configuration: false
      pipeline: false
      session: false
# ----------------------------------------------------
  parameters:
    # --------------------------------------------
    # ------------------------ PARAMETERS: MANAGER
    # --------------------------------------------
    manager:
      board:
        phase: 04-06
        action: refactor
      docs:
        exclude:
          - 00-overview
          - 01-assets
          - 02-sprites
          # - 03-compositions
          - 04-intentions
          - 05-mechanics
          - 06-widgets
          - 07-acoustics
          - 08-narratives
          - 09-ecology
          - 10-chemistry
          - 11-emergence
          - 12-architecture
      templates: 
        - template-backlog
      specs:
        - 00-dialogue
        - 01-interaction
        - 02-wander
    metrics:
      pstats: 
        run: |
          python -m cProfile -o $ROOT/engine-run.pstats src/main.py start world-01
        dot: |
          gprof2dot -f pstats --node-thres=1.0 --edge-thres=0.5 $ROOT/engine-run.pstats
    # --------------------------------------------
    # ------------------------ PARAMETERS: SOURCE
    # --------------------------------------------
    source:
      filter:
        default: AND
        queries:
          - title: Multiplier Abstract
            scan:
              domain: [ abstract ]
              app: [ module ]
              workflows: [ compositions ]
          - title: Composition Logic
            scan:
              domain: [ logic ]
              app: [ module ]
              workflows: [ compositions ]
          - title: Orchestration Services
            scan:
              domain: [ system ]
              app: [ orchestration ]
          - title: Hydration Services
            scan:
              domain: [ system ]
              workflows: [ hydration ]
      data:
        properties: [ ]
        state: [ ]
        configurations: [ ]
        templates: [ ]
    # --------------------------------------------
    # -------------------------- PARAMETERS: SHELL
    # --------------------------------------------
    shell:
      directory: |
        tree -L 3 --gitignore -I "build|*.so|*.png|__pycache__|__init__.py"
      commands: 
        - python /Users/gmoore/Home/projects/ontology/src/main.py start
    # --------------------------------------------
    # -------------------------- PARAMETERS: TESTS
    # --------------------------------------------
    tests:
      pipeline:
        command: pytest -m
        marker: workflow_navigation
        # scope: '**/test_{actuator,cartographer}.py'