# ----------------------------------------------------
# --------------------- TOOLS.PARAMETERS.SOURCE.FILTER
# ----------------------------------------------------
# default: AND | OR
# queries:
# - title: TITLE
#   strategy: AND | OR
#   scan:
#     app: [ 
#             asset, base, core, 
#             component, config, device,
#             schema, semantics, service, 
#             mechanic 
#     ]
#     asset: [ 
#             property, state, frame,
#             animation, hitbox 
#     ]
#     domain: [ 
#               abstract, automata, concrete, 
#               model, logic, graphics, 
#               test, system, user,
#               script
#     ]
#     category: [ 
#               crafts, cursors, effects,
#               geography, objects, resources,
#               sheets, tiles, widgets 
#     ]
#     physics: [ 
#               fields, motion, space 
#     ]
#     script: [
#               synthesize
# ]
#     test: [
#               unit, integration
#     ]
#     workflows: [ 
#               cli, collisions, combat,
#               compositions, cognition, ecology, 
#               fluids, hydration, interactions, 
#               main, menus, orchestration,
#               navgiation, rendering, seasons,
#               telemetry, transitions
#     ]
# ----------------------------------------------------
# ------------------------ TOOL.PARAMETERS.SOURCE.DATA
# ----------------------------------------------------
#     properties: [ 
#               crafts, cursors, effects,
#               fonts, geography, objects
#               resources, sheets, sounds
#               tiles, widgets
#     ]
#     state: [
#               world-01, world-testbed
#     ]
#     configurations: [
#               actions, compositions, intentions,
#               library, mappings, materials,
#               mechanics, menus, plots,
#               recipes, stages
#     ]
#     templates: [
#               menu-dump, registry-dump, sdl-dump, 
#               state-dump
#     ]
# ----------------------------------------------------
# ----------------------------------------------- TASK
# ----------------------------------------------------
task:
# ----------------------------------------------------
  template: <path>
# ----------------------------------------------------
  parameters:
    automata: <automata>
    composition: <composition>
    description: <description>
    diagram: <diagram>
    table: <table>
    title: <title>
# ----------------------------------------------------
# ---------------------------------------------- TOOLS
# ----------------------------------------------------
tools:
# ----------------------------------------------------
  views:
    # ------------------------------------------------
    manager:
      board: false
      specs: false
      docs: false
    # ------------------------------------------------
    metrics:
      pstats: false
    # ------------------------------------------------
    source:
      data: false
      filter: false
    # ------------------------------------------------
    shell:
      directory: false
      commands: false
    # ------------------------------------------------
    tests:  
      console: false
      fixtures: false
      session: false
      workflow: false
# ----------------------------------------------------
  parameters:
    # ------------------------------------------------
    manager:
      board:
        phase: <phase>
        action: <action>
      docs:
        exclude:
          - <doc-page>
      template: 
        - <template>
      specs:
        - <spec-page>
    # ------------------------------------------------
    metrics:
      pstats:
        run: <run-command>
        dot: <dot-command>
    # ------------------------------------------------
    source:
      filter:
        default: <AND | OR>
        queries:
            - title: <title>
              strategy: <AND | OR>
              scan: 
                <tag-prefix>: [ <tag> ]
      data:
        configurations: 
          - <configuration>
        properties: 
          - <property>
        state: 
          - <state>
    # ------------------------------------------------
    shell:
      directory: <cmd>
      commands: []
    # ------------------------------------------------
    tests:
      console:
        pytest: pytest -m 
        marker: <workflow>
        # scope: BASH Expansion Expression
        scope: <scope>
      fixtures:
        - <fixture>
      workflow: <workflow>
      session:
        description: |
          <description>