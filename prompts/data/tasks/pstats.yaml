context: true
# ----------------------------------------------------
task:
# ----------------------------------------------------
  template: analyze/engine.md.j2
# ----------------------------------------------------
tools:
# ----------------------------------------------------
  views:
    # --------------------------------------------
    manager:
      docs: true
      templates: true
    # --------------------------------------------
    metrics:
      pstats: true
    # --------------------------------------------
    source:
      filter: true
      data: true
    # --------------------------------------------
    shell:
      directory: true
# ----------------------------------------------------
  parameters:
    # --------------------------------------------
    manager:
      docs:
        exclude:
          # - 00-overview
          # - 01-assets
          - 02-sprites
          - 03-compositions
          - 04-intentions
          # - 05-mechanics
          - 06-widgets
          - 07-acoustics
          - 08-narratives
          - 09-ecology
          - 10-chemistry
          - 11-emergence
          # - 12-architecture
      templates:
        - template-review
        - template-bug
    # --------------------------------------------
    metrics:
      pstats: 
        run: |
          python -m cProfile -o $ROOT/docs/static/pstats/latest.pstats src/main.py start world-01
        dot: |
          gprof2dot -f pstats --node-thres=1.0 --edge-thres=0.5 $ROOT/docs/static/pstats/latest.pstats
    # --------------------------------------------
    source:
      filter:
        default: AND
        queries:
          - title: 'Services - Injection'
            scan:
              domain: [ system ]
              app: [ service ]
              workflows: [ injection ]
          - title: 'Application - Core'
            scan:
              domain: [ system ]
              app: [ core, component ]
          - title: 'Abstract - Asset'
            scan:
              domain: [ abstract ]
              app: [ asset ]
          - title: 'Abstract - Mechanic'
            scan:
              domain: [ abstract ]
              app: [ mechanic ]
          - title: 'Implementation - Asset: Hitboxes'
            scan:
              domain: [ concrete ]
              app: [ asset ]
              asset: [ hitbox ]
          - title: 'Implementation - Mechanic: Collisions'
            scan:
              domain: [ logic ]
              app: [ mechanic]
              workflows: [ collisions ]
          - title: 'Implementation - Mechanic: Navigation'
            scan:
              domain: [ logic ]
              app: [ mechanic ]
              workflows: [ navigation ]
          - title: 'Module - Relation: Material'
            scan:
              domain: [ logic ]
              app: [ module ]
              modality: [ material ]
          - title: 'Service - Generator: Perimeter'
            scan:
              domain: [ system ]
              app: [ service ]
              workflows: [ collisions ]
          - title: 'Libraries - Collisions'
            scan:
              domain: [ system ]
              app: [ library ]
              workflows: [ collisions ]
      data:
        properties: [ ]
        state: [  ]
        configurations: [ assets/materials  ]
        templates: [ ]
    # --------------------------------------------
    shell:
      directory: |
        tree -L 3 --gitignore -I "build|*.so|*.png|__pycache__|__init__.py"