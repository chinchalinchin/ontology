context: true
# ----------------------------------------------------
# ----------------------------------------------------
# ----------------------------------------------- TASK
# ----------------------------------------------------
# ----------------------------------------------------
task:
# ----------------------------------------------------
  template: iterate/review.md.j2
# ----------------------------------------------------
# ----------------------------------------------------
# ---------------------------------------------- TOOLS
# ----------------------------------------------------
# ----------------------------------------------------
tools:
# ----------------------------------------------------
  views:
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: MANAGER
    # --------------------------------------------
    manager:
      board: true
      docs: true
      templates: true
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: METRICS
    # --------------------------------------------
    metrics:
      pstats: false
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: SOURCE
    # --------------------------------------------
    source:
      filter: true
      data: true
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: SHELL
    # --------------------------------------------
    shell:
      directory: true
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: TESTS
    # --------------------------------------------
    tests:  
      configuration: false
      pipeline: true
      session: false
# ----------------------------------------------------
  parameters:
    # --------------------------------------------
    # ------------------------ PARAMETERS: MANAGER
    # --------------------------------------------
    manager:
      board:
        phase: '03-04'
        action: refactor
      docs:
        exclude:
          # - 00-overview
          # - 01-assets
          # - 02-sprites
          - 03-compositions
          - 04-intentions
          # - 05-mechanics
          - 06-widgets
          - 07-acoustics
          - 08-narratives
          - 09-ecology
          - 10-chemistry
          - 11-emergence
          # - 12-architecture
      templates:
        # - template-backlog
        - template-bug
        - template-docs
        - template-review
    # --------------------------------------------
    # ------------------------ PARAMETERS: METRICS
    # --------------------------------------------
    metrics:
      pstats: 
        run: |
          python -m cProfile -o $ROOT/engine-run.pstats src/main.py start world-01
        dot: |
          gprof2dot -f pstats --node-thres=1.0 --edge-thres=0.5 $ROOT/engine-run.pstats
    # --------------------------------------------
    # ------------------------- PARAMETERS: SOURCE
    # --------------------------------------------
    source:
      filter:
        default: AND
        queries:
          - title: Application - Core
            scan:
              domain: [ system ]
              app: [ core, component ]
          - title: Application - Devices
            scan:
              domain: [ user ]
              app: [ device ]
          - title: Asset - Abstract
            scan:
              domain: [ abstract ]
              app: [ asset ]
          - title: Mechanic - Abstract
            scan:
              domain: [ abstract ]
              app: [ mechanic ]
          - title: Models - Core
            scan:
              domain: [ model ]
              app: [ core, asset ]
          - title: Models - Sheets
            scan:
              domain: [ model ]
              category: [ sheets ]
          - title: 'Implementation - All: Sheets'
            scan:
              domain: [ concrete ]
              app: [ asset ]
              category: [ sheets ]
          - title: 'Implementations -  All: Cursors'
            scan:
              domain: [ concrete ]
              app: [ asset ]
              category: [ cursors ]
          - title: Logic - Combat
            scan:
              domain: [ logic ]
              workflows: [ combat ]
          - title: Logic - Projectiles
            scan:
              domain: [ logic ]
              workflows: [ projectiles ]
          - title: Service - Cradle
            scan:
              domain: [ system ]
              app: [ service ]
              workflows: [ combat ]
          - title: Combat Tests
            scan:
              domain: [ test ]
              workflows: [ combat ]
          - title: Projectile Tests
            scan: 
              domain: [ test ]
              workflows: [ projectiles ]
          - title: Device Tests 
            scan:
              domain: [ test ]
              app: [ device ]
          # - title: Test Fixtures
          #   scan:
          #     domain: [ test ]
          #     test: [ fixtures ]
      data:
        properties: [ cursors, sheets/equipment ]
        state: [ ]
        configurations: [ actions, intentions ]
        templates: [ ]
    # --------------------------------------------
    # -------------------------- PARAMETERS: SHELL
    # --------------------------------------------
    shell:
      directory: |
        tree -L 3 --gitignore -I "build|*.so|*.png|__pycache__|__init__.py"
      commands: 
        - python /Users/gmoore/Home/projects/ontology/src/main.py start
    # --------------------------------------------
    # -------------------------- PARAMETERS: TESTS
    # --------------------------------------------
    tests:
      pipeline:
        command: pytest -m
        marker: '"workflow_combat or workflow_projectile"'
        # scope: '**/test_{actuator,cartographer}.py'