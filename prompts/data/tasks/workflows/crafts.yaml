# ----------------------------------------------------
context: true
# ----------------------------------------------------
task:
# ----------------------------------------------------
  template: iterate/groom.md.j2
# ----------------------------------------------------
  parameters:
    description:  TODO
    title: TODO
# ----------------------------------------------------
tools:
# ----------------------------------------------------
  views:
    # --------------------------------------------
    manager:
      board: true
      docs: true
      templates: true
    # --------------------------------------------
    source:
      data: true
      filter: true
    # --------------------------------------------
    shell:
      directory: true
      commands: false
    # --------------------------------------------
    tests:  
      configuration: false
      pipeline: false
      session: false
# -----------------------------------------------------
  parameters:
    # --------------------------------------------
    manager:
      board:
        phase: 07-06
        action: refactor
      docs:
        exclude:
          # - 00-overview
          # - 01-assets
          # - 02-sprites
          # - 03-compositions
          - 04-intentions
          - 05-mechanics
          # - 06-widgets
          - 07-acoustics
          - 08-narratives
          - 09-ecology
          - 10-chemistry
          - 11-emergence
          # - 12-architecture
      templates:
        - template-backlog
        - template-docs
        - template-bug
    # --------------------------------------------
    source:
      filter:
        default: AND
        queries:
          # -------------------------------------
          - title: Application Core Components
            scan:
              domain: [ system ]
              app: [ core, component ]
          # -------------------------------------
          - title: Asset Abstract
            scan:
              domain: [ abstract ]
              app: [ asset ]
          # -------------------------------------
          - title: Widget Implementations
            scan:
              domain: [ concrete ]
              app: [ asset ]
              category: [ widgets ]
          # -------------------------------------
          - title: Widget Models
            scan:
              domain: [ model ]
              category: [ widgets ]
          # -------------------------------------
          - title: Menu Abstracts
            scan:
              domain: [ abstract ]
              app: [ menu ]
          # -------------------------------------
          - title: Menu Models
            scan:
              domain: [ model ]
              app: [ menu ]
          # -------------------------------------
          - title: Menu Bindings
            scan:
              domain: [ concrete ]
              app: [ menu ]
              menu: [ binding ]
          # -------------------------------------
          - title: Menu Mechanics
            scan:
              domain: [ concrete ]
              app: [ menu, mechanic ]
          # ------------------------------------
          - title: Material Models
            scan:
              domain: [ model ]
              modality: [ material ]
          # ------------------------------------
          - title: Composition Modules
            scan:
              domain: [ logic ]
              app: [ module ]
              workflows: [ compositions ]
          # -------------------------------------
          - title: Craft Controller
            scan:
              domain: [ concrete ]
              app: [ menu ]
              menu: [ controller ]
              workflows: [ crafting ]
          # -------------------------------------
          - title: Craft Services
            scan:
              domain: [ concrete ]
              app: [ menu ]
              menu: [ controller ]
              workflows: [ crafting ]
          # -------------------------------------
      data:
        properties: [ widgets, crafts ]
        state: [ ]
        configurations: [ menus/inventory/pack, materials, compositions/armatures ]
        templates: [ ]
    # --------------------------------------------
    shell:
      directory: |
        tree -L 3 --gitignore -I "build|*.so|*.png|__pycache__|__init__.py"
    # --------------------------------------------
    tests:
      pipeline:
        command: pytest -m
        marker: "'app_menu or app_device'"
        # scope: '**/test_{actuator,cartographer}.py'