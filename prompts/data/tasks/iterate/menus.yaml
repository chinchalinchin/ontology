# ----------------------------------------------------
description: &description |
  DESCRIPTION GOES HERE
# ----------------------------------------------------
context: true
# ----------------------------------------------------
task:
# ----------------------------------------------------
  template: iterate/grooming.md.j2
# ----------------------------------------------------
  parameters:
    description: *description
    title: Collection Refactor
# ----------------------------------------------------
tools:
# ----------------------------------------------------
  views:
    # --------------------------------------------
    manager:
      board: true
      docs: true
      templates: true
    # --------------------------------------------
    source:
      data: true
      filter: true
    # --------------------------------------------
    shell:
      directory: false
    # --------------------------------------------
    tests:  
      configuration: false
      pipeline: false
      session: false
# -----------------------------------------------------
  parameters:
    # --------------------------------------------
    manager:
      board:
        phase: 04-06
        action: refactor
      docs:
        exclude:
          # - 00-overview
          # - 01-assets
          - 02-sprites
          - 03-compositions
          - 04-intentions
          - 05-mechanics
          # - 06-widgets
          - 07-sounds
          - 08-plots
          - 09-ecology
          - 10-chemistry
          - 11-emergence
          # - 12-architecture
      templates: 
        - template-backlog
        - template-docs
        - template-bug
    # --------------------------------------------
    source:
      filter:
        default: AND
        queries:
          - title: Orchestration Services
            scan:
              domain: [ system ]
              workflows: [ orchestration ]
          - title: Application Core Components
            scan:
              domain: [ system ]
              app: [ core, component ]
          - title: Asset Abstract
            scan:
              domain: [ abstract ]
              app: [ asset ]
          - title: Widget Implementations
            scan:
              domain: [ concrete ]
              app: [ asset ]
              category: [ widgets ]
          - title: Widget Models
            scan:
              domain: [ model ]
              category: [ widgets ]
          - title: Menu Abstracts
            scan:
              domain: [ abstract ]
              app: [ menu ]
          - title: Menu Models
            scan:
              domain: [ model ]
              app: [ menu ]
          # - title: Gizmo Bindings
          #   scan:
          #     domain: [ concrete ]
          #     app: [ menu ]
          #     menu: [ binding, gizmo ]
          - title: Menu Services
            scan:
              domain: [ system ]
              app: [ service, menu ]
          - title: Menu Mechanics
            scan:
              domain: [ concrete ]
              app: [ menu, mechanic ]
          # - title: Traversal Controllers
          #   scan:
          #     domain: [ concrete ]
          #     app: [ menu ]
          #     menu: [ controller ]
          #     workflows: [ traversal ]
          # - title: Render Handlers
          #   scan:
          #     domain: [ concrete ]
          #     app: [ menu ]
          #     menu: [ handler ]
          #     workflows: [ rendering ]
          - title: Multiplier Abstract
            scan:
              domain: [ abstract ]
              app: [ module ]
              workflows: [ compositions ]
          - title: Composition Logic
            scan:
              domain: [ logic ]
              app: [ module ]
              workflows: [ compositions ]
      data:
        properties: [ widgets ]
        state: [ ]
        configurations: [ menus/main, menus/load, menus/dialogue ]
        templates: [ ]
    # --------------------------------------------
    shell:
      directory: |
        tree -L 3 --gitignore -I "build|*.so|*.png|__pycache__|__init__.py"
    # --------------------------------------------
    tests:
      pipeline:
        command: pytest -m
        marker: workflow_navigation
        # scope: '**/test_{actuator,cartographer}.py'