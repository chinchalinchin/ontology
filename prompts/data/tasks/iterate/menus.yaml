# ----------------------------------------------------
context: true
# ----------------------------------------------------
task:
# ----------------------------------------------------
  template: index.md.j2
# ----------------------------------------------------
  parameters:
    description: |
      Okay, now, let's do the following:

      1. Refactor CollectionBinding entirely.
      2. Refactor the `inventory` menu YAML.
      3. Refactor inventory controller.

      Idea is thus:

      - three rows: equipment, pouch, pack. each row should have a label. above it.
      - Players cannot "carry" equipment in a bag or inventory slot. They have to wear it. There will be mechanics that govern the exchange of equipment independent of the inventory menu. inventory menu is only meant to display currently equipped equipment. If no equipment is displayed, slot is empty.
      - inventory menu should have a row for the pouch, and a row for the pack. Each should bind to the appropriate Sprite field.

      Review the traversal logic. The Widgets should be unpacking into traversal graphs and flat lists in such a way that traversing the pouch and pack should be seamless. Identify any bugs. 

    title: Collection Refactor
# ----------------------------------------------------
tools:
# ----------------------------------------------------
  views:
    # --------------------------------------------
    manager:
      board: false
      docs: false
      templates: false
    # --------------------------------------------
    source:
      data: true
      filter: false
    # --------------------------------------------
    shell:
      directory: false
    # --------------------------------------------
    tests:  
      configuration: false
      pipeline: false
      session: false
# -----------------------------------------------------
  parameters:
    # --------------------------------------------
    manager:
      board:
        phase: 04-06
        action: refactor
      docs:
        exclude:
          # - 00-overview
          # - 01-assets
          # - 02-sprites
          - 03-compositions
          - 04-intentions
          - 05-mechanics
          # - 06-widgets
          - 07-sounds
          - 08-plots
          - 09-ecology
          - 10-chemistry
          - 11-emergence
          # - 12-architecture
      templates: 
        - template-review
        - template-docs
        - template-bug
    # --------------------------------------------
    source:
      filter:
        default: AND
        queries:
          - title: Application Core Components
            scan:
              domain: [ system ]
              app: [ core, component ]
          - title: Asset Abstract
            scan:
              domain: [ abstract ]
              app: [ asset ]
          - title: Widget Implementations
            scan:
              domain: [ concrete ]
              app: [ asset ]
              category: [ widgets ]
          - title: Widget Models
            scan:
              domain: [ model ]
              category: [ widgets ]
          - title: Menu Abstracts
            scan:
              domain: [ abstract ]
              app: [ menu ]
          - title: Menu Models
            scan:
              domain: [ model ]
              app: [ menu ]
          - title: Gizmo Bindings
            scan:
              domain: [ concrete ]
              app: [ menu ]
              menu: [ binding, gizmo ]
          - title: Menu Services
            scan:
              domain: [ system ]
              app: [ service, menu ]
          - title: Menu Mechanics
            scan:
              domain: [ concrete ]
              app: [ menu, mechanic ]
          - title: Traversal Controllers
            scan:
              domain: [ concrete ]
              app: [ menu ]
              menu: [ controller ]
              workflows: [ traversal ]
          - title: Render Handlers
            scan:
              domain: [ concrete ]
              app: [ menu ]
              menu: [ handler ]
              workflows: [ rendering ]
      data:
        properties: [ widgets ]
        state: [ ]
        # configurations: [ menus/main, menus/inventory, menus/load, menus/dialogue ]
        templates: [ ]
    # --------------------------------------------
    shell:
      directory: |
        tree -L 3 --gitignore -I "build|*.so|*.png|__pycache__|__init__.py"
    # --------------------------------------------
    tests:
      pipeline:
        command: pytest -m
        marker: workflow_navigation
        # scope: '**/test_{actuator,cartographer}.py'