# ----------------------------------------------------
anchors:
  title: &title Ontology - Instruments
  description: &description TODO
  board: &board
    phase: '13'
    action: implement
# ----------------------------------------------------
context: true
# ----------------------------------------------------
task:
# ----------------------------------------------------
  template: iterate/grooming.md.j2
# ----------------------------------------------------
  parameters:
    title: *title
    description: *description
# ----------------------------------------------------
tools:
# ----------------------------------------------------
  views:
    # --------------------------------------------
    manager:
      board: true
      docs: true
      templates: true
      specs: false
    # --------------------------------------------
    metrics:
      pstats: false
    # --------------------------------------------
    source:
      data: true
      filter: true
    # --------------------------------------------
    shell:
      directory: false
      commands: false
    # --------------------------------------------
    tests:  
      configuration: false
      pipeline: false
      session: false
# ----------------------------------------------------
  parameters:
    # --------------------------------------------
    manager:
      board: *board
      docs:
        exclude:
          # - 00-overview
          # - 01-assets
          - 02-sprites
          - 03-compositions
          - 04-intentions
          - 05-mechanics
          # - 06-widgets
          # - 07-sounds
          - 08-plots
          - 09-ecology
          - 10-chemistry
          - 11-emergence
          # - 12-architecture
      templates: 
        - template-backlog
        - template-docs
        - template-bug
      specs: []
    metrics:
      pstats: 
        run: |
          python -m cProfile -o $ROOT/engine-run.pstats src/main.py start world-01
        dot: |
          gprof2dot -f pstats --node-thres=1.0 --edge-thres=0.5 $ROOT/engine-run.pstats
    # --------------------------------------------
    source:
      filter:
        default: AND
        queries:
          - title: Script - Synthesize
            scan:
              script: [ synthesize ]
          - title: Application - Asset Abstracts
            scan:
              domain: [ abstract ]
              app: [ asset ]
          - title: Application - Core Models
            scan:
              domain: [ model ]
              app: [ core ]
          - title: Application - Core System Components
            scan:
              domain: [ system ]
              app: [ core, component ]
          - title: Application - Board Cache
            scan:
              domain: [ system ]
              app: [ board, module ]
          - title: Application - Dependency Injection Pipeline
            scan:
              domain: [ system ]
              app: [ orchestration ]
          - title: Library - Audio Libraries
            scan:
              domain: [ audio ]
              app: [ library ]
          - title: Library - Registry
            scan:
              domain: [ system, graphics ]
              app: [ library ]
              asset: [ frame ]
      data:
        properties: [ ]
        state: [ ]
        configurations: [ sounds, scores ]
        templates: [ ]
    # --------------------------------------------
    shell:
      directory: |
        tree -L 3 --gitignore -I "build|*.so|*.png|__pycache__|__init__.py"
      commands: 
        - python /Users/gmoore/Home/projects/ontology/src/main.py start
    # --------------------------------------------
    tests:
      pipeline:
        command: pytest -m
        marker: workflow_instrumentation
        # scope: '**/test_{actuator,cartographer}.py'