# ----------------------------------------------------
anchors:
  description: &description TODO
  title: &title TODO
# ----------------------------------------------------
context: true
# ----------------------------------------------------
task:
# ----------------------------------------------------
  template: iterate/grooming.md.j2
# ----------------------------------------------------
  parameters:
    description: *description
    title: *title
# ----------------------------------------------------
tools:
# ----------------------------------------------------
  views:
    # --------------------------------------------
    manager:
      board: true
      docs: true
      templates: true
    # --------------------------------------------
    source:
      data: true
      filter: true
    # --------------------------------------------
    shell:
      directory: true
    # --------------------------------------------
    tests:  
      configuration: false
      pipeline: false
      session: false
# -----------------------------------------------------
  parameters:
    # --------------------------------------------
    manager:
      board:
        phase: '14'
        action: implement
      docs:
        exclude:
          # - 00-overview
          # - 01-assets
          # - 02-sprites
          - 03-compositions
          - 04-intentions
          # - 05-mechanics
          # - 06-widgets
          - 07-sounds
          - 08-plots
          - 09-ecology
          - 10-chemistry
          - 11-emergence
          # - 12-architecture
      templates:
        - template-backlog
        - template-bug
    # --------------------------------------------
    source:
      filter:
        default: AND
        queries:
          # -------------------------------------
          - title: Application Core Components
            scan:
              domain: [ system ]
              app: [ core, component ]
          # ------------------------------------
          - title: Asset Abstracts
            scan:
              domain: [ abstract ]
              app: [ asset ]
          # ------------------------------------
          - title: Sheet Models
            scan:
              domain: [ model ]
              category: [ sheets ]
          # ------------------------------------
          - title: Sheet Implementations
            scan:
              domain: [ concrete ]
              app: [ asset ]
              category: [ sheets ]
          # -------------------------------------
          - title: Widget Models
            scan:
              domain: [ model ]
              category: [ widgets ]
          # ------------------------------------
          - title: Widget Implementations
            scan:
              domain: [ concrete ]
              app: [ asset ]
              category: [ widgets ]
          # -------------------------------------
          - title: Menu Abstracts
            scan:
              domain: [ abstract ]
              app: [ menu ]
          # -------------------------------------
          - title: Menu Models
            scan:
              domain: [ model ]
              app: [ menu ]
          # -------------------------------------
          - title: Inventory Controller
            scan:
              domain: [ concrete ]
              app: [ menu ]
              menu: [ controller ]
              workflows: [ inventory ]
      data:
        properties: [ sheets, widgets ]
        state: [ ]
        configurations: [ menus/inventory ]
        templates: [ ]
    # --------------------------------------------
    shell:
      directory: |
        tree -L 3 --gitignore -I "build|*.so|*.png|__pycache__|__init__.py"
    # --------------------------------------------
    tests:
      pipeline:
        command: pytest -m
        marker: app_menu
        # scope: '**/test_{actuator,cartographer}.py'