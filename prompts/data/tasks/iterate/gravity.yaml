# ----------------------------------------------------
# ----------------------------------------------------
# ----------------------------------------------- TASK
# ----------------------------------------------------
# ----------------------------------------------------
task:
# ----------------------------------------------------
  template: iterate/implementation.md.j2
# ----------------------------------------------------
# ----------------------------------------------------
# ---------------------------------------------- TOOLS
# ----------------------------------------------------
# ----------------------------------------------------
tools:
# ----------------------------------------------------
  views:
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: MANAGER
    # --------------------------------------------
    manager:
      board: true
      docs: true
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: SOURCE
    # --------------------------------------------
    source:
      filter: true
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: SHELL
    # --------------------------------------------
    shell:
      directory: true
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: TESTS
    # --------------------------------------------
    tests:  
      configuration: false
      pipeline: false
      session: false
# ----------------------------------------------------
  parameters:
    # --------------------------------------------
    # ------------------------ PARAMETERS: MANAGER
    # --------------------------------------------
    manager:
      board:
        phase: '07-03'
        action: refactor
      docs:
        exclude:
          # - 00-overview
          # - 01-assets
          - 02-sprites
          - 03-compositions
          - 04-intentions
          # - 05-mechanics
          - 06-widgets
          - 07-acoustics
          - 08-narratives
          - 09-ecology
          - 10-chemistry
          - 11-emergence
          # - 12-architecture
      specs: []
        # - 00-dialogue
        # - 01-interaction
        # - 02-wander
    # --------------------------------------------
    # ------------------------ PARAMETERS: METRICS
    # --------------------------------------------
    metrics:
      pstats: 
        run: |
          python -m cProfile -o $ROOT/engine-run.pstats src/main.py start world-01
        dot: |
          gprof2dot -f pstats --node-thres=1.0 --edge-thres=0.5 $ROOT/engine-run.pstats
    # --------------------------------------------
    # ------------------------- PARAMETERS: SOURCE
    # --------------------------------------------
    source:
      filter:
        default: AND
        queries:
          - title: Core Systems
            scan:
              domain: [ system ]
              app: [ core, component ]
          - title: Board Cache
            scan:
              domain: [ system ]
              app: [ board, module ]
          - title: Application Abstracts
            scan:
              domain: [ abstract ]
          - title: Collision Workflow
            scan:
              domain: [ logic ]
              workflows: [ collisions ]
          - title: Motion Mechanics
            scan:
              domain: [ logic ]
              app: [ mechanic ]
              physics: [ motion ] 
          - title: Motion Modules
            scan:
              domain: [ logic ]
              app: [ module ]
              physics: [ motion ]
          - title: Field Modules
            scan:
              domain: [ logic ]
              app: [ module ]
              physics: [ fields ]
          - title: Hitbox Implementations
            scan:
              domain: [ concrete ]
              app: [ asset ]
              asset: [ hitbox ]
      data:
        properties: [ ]
        state: [  ]
        configurations: [  ]
        templates: [ ]
    # --------------------------------------------
    # -------------------------- PARAMETERS: SHELL
    # --------------------------------------------
    shell:
      directory: |
        tree -L 3 --gitignore -I "build|*.so|*.png|__pycache__|__init__.py"
      commands: 
        - python /Users/gmoore/Home/projects/ontology/src/main.py start
    # --------------------------------------------
    # -------------------------- PARAMETERS: TESTS
    # --------------------------------------------
    tests:
      pipeline:
        command: pytest -m
        marker: '"workflow_hydration"'
        # scope: '**/test_{actuator,cartographer}.py'
      session:
        description: |
          description