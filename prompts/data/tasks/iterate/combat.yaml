context: true
# ----------------------------------------------------
# ----------------------------------------------------
# ----------------------------------------------- TASK
# ----------------------------------------------------
# ----------------------------------------------------
task:
# ----------------------------------------------------
  template: iterate/implement.md.j2
# ----------------------------------------------------
# ----------------------------------------------------
# ---------------------------------------------- TOOLS
# ----------------------------------------------------
# ----------------------------------------------------
tools:
# ----------------------------------------------------
  views:
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: MANAGER
    # --------------------------------------------
    manager:
      board: true
      docs: true
      templates: false
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: SOURCE
    # --------------------------------------------
    source:
      filter: true
      data: true
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: SHELL
    # --------------------------------------------
    shell:
      directory: true
    # --------------------------------------------
    # ------------------------ TOOL VIEWS: TESTS
    # --------------------------------------------
    tests:  
      configuration: false
      pipeline: false
      session: false
# ----------------------------------------------------
  parameters:
    # --------------------------------------------
    # ------------------------ PARAMETERS: MANAGER
    # --------------------------------------------
    manager:
      board:
        phase: '06-03'
        action: refactor
      docs:
        exclude:
          # - 00-overview
          # - 01-assets
          # - 02-sprites
          - 03-compositions
          # - 04-intentions
          # - 05-mechanics
          - 06-widgets
          - 07-acoustics
          - 08-narratives
          - 09-ecology
          - 10-chemistry
          - 11-emergence
          # - 12-architecture
      templates:
        - template-backlog
        - template-bug
        - template-docs
    # --------------------------------------------
    # ------------------------ PARAMETERS: METRICS
    # --------------------------------------------
    metrics:
      pstats: 
        run: |
          python -m cProfile -o $ROOT/engine-run.pstats src/main.py start world-01
        dot: |
          gprof2dot -f pstats --node-thres=1.0 --edge-thres=0.5 $ROOT/engine-run.pstats
    # --------------------------------------------
    # ------------------------- PARAMETERS: SOURCE
    # --------------------------------------------
    source:
      filter:
        default: AND
        queries:
          - title: Dependency Injection Pipeline
            scan:
              domain: [ system ]
              app: [ orchestration ]
          - title: Asset Factory
            scan:
              domain: [ system ]
              app: [ service, asset ]
              workflows: [ injection ]
          - title: Core Components
            scan:
              domain: [ system ]
              app: [ core, component ]
          - title: Asset Abstract
            scan:
              domain: [ abstract ]
              app: [ asset ]
          - title: Mechanic Abstract
            scan:
              domain: [ abstract ]
              app: [ mechanic ]
          - title: Core Models
            scan:
              domain: [ model ]
              app: [ core, asset ]
          - title: Sheet Models
            scan:
              domain: [ model ]
              category: [ sheets ]
          - title: Sheet Hitbox Implementations
            scan:
              domain: [ concrete ]
              app: [ asset ]
              category: [ sheets ]
              asset: [ hitbox ]
          - title: Sheet Frame Implementations
            scan:
              domain: [ concrete ]
              app: [ asset ]
              category: [ sheets ]
              asset: [ frame ]
          - title: Combat Logic
            scan:
              workflows: [ combat ]
      data:
        properties: [ sheets/sprites, sheets/equipment ]
        state: [  ]
        configurations: [  ]
        templates: [ ]
    # --------------------------------------------
    # -------------------------- PARAMETERS: SHELL
    # --------------------------------------------
    shell:
      directory: |
        tree -L 3 --gitignore -I "build|*.so|*.png|__pycache__|__init__.py"
      commands: 
        - python /Users/gmoore/Home/projects/ontology/src/main.py start
    # --------------------------------------------
    # -------------------------- PARAMETERS: TESTS
    # --------------------------------------------
    tests:
      pipeline:
        command: pytest -m
        marker: workflow_combat
        # scope: '**/test_{actuator,cartographer}.py'