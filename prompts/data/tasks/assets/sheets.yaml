context: true
# ----------------------------------------------------
task:
# ----------------------------------------------------
  template: index.md.j2
  parameters:
    title: Ontology - Automaton Analysis
    description:
      I suppose it is $P_t$ that is of interest. Seems like it has a boundary condition $E(P_t) = w_{t+1}$. 

      So, with Phase 06.05, the Sprite will have an internal model of the world, Belief. It then needs a way of "formalizing a Task" as a series of Goals. Then, it needs a "Task Space" of all possible tasks that it "conditionalizes" as it iterates over them and determines if a particular Task is a successful strategy.

      Would this be the correct application of the theory to the Engine?

      **PRIORITIES**

      * Synthesize the preceding discussion into updates on the [Task Board](#view-task-board) for Phase 06.05. Use the [Backlog Template](template-backlog) as a guide.
# ----------------------------------------------------
tools:
# ----------------------------------------------------
  views:
    # --------------------------------------------
    manager:
      board: true
      docs: true
      bugs: false
      templates: true
    # --------------------------------------------
    source:
      data: true
      filter: true
    # --------------------------------------------
    shell:
      directory: true
    # --------------------------------------------
    tests:  
      configuration: false
      pipeline: false
      session: false
# ----------------------------------------------------
  parameters:
    # --------------------------------------------
    manager:
      board:
        phase: 06-05
        action: refactor
      bugs: []
      docs:
        exclude:
          # - 00-overview
          # - 01-assets
          # - 02-sprites
          - 03-compositions
          # - 04-intentions
          # - 05-mechanics
          - 06-widgets
          - 07-acoustics
          - 08-narratives
          - 09-ecology
          - 10-chemistry
          - 11-emergence
          # - 12-architecture
      templates:
        # - template-docs
        - template-backlog
        # - template-bug
        # - template-design
        # - template-merge
        # - template-review
        # - template-spec
    # --------------------------------------------
    source:
      filter:
        default: AND
        queries:
          - title: 'Application - Core'
            scan:
              domain: [ system ]
              app: [ core, component ]
          - title: 'Asset - Abstract'
            scan:
              domain: [ abstract ]
              app: [ asset ]
          - title: 'Mechanic - Abstract'
            scan:
              domain: [ abstract] 
              app: [ mechanic ]
          - title: 'Asset - Models'
            scan:
              domain: [ model ]
              app: [ asset, core ]
          - title: 'Asset - Models: Sheet'
            scan:
              domain: [ model ]
              app: [ asset ]
              category: [ sheets ]
          # - title: 'Asset - Implementations: Sheets'
          #   scan:
          #     domain: [ concrete ]
          #     app: [ asset ]
          #     category: [ sheets ]
          - title: 'Automata - Models'
            scan: 
              domain: [ model, automata ]
          - title: 'Automata - Services'
            scan: 
              domain: [ automata ]
              app: [ service ]
          - title: 'Automata - Modules'
            scan:
              domain: [ automata ]
              app: [ module ]
          - title: 'Mechanics - Intentional'
            scan:
              domain: [ concrete ]
              app: [ mechanic ]
              modality: [ intention ]
          # - title: 'Libraries - Navigation'
          #   scan: 
          #     domain: [ system ]
          #     app: [ library ]
          #     workflows: [ navigation ]
          # - title: 'Tests - Fixtures'
          #   scan:
          #     domain: [ test ]
          #     test: [ fixtures ]
          # - title: 'Tests - Intentional Mechanics'
          #   scan:
          #     domain: [ test ]
          #     app: [ mechanic ]
          #     modality: [ intention ]
          # - title: 'Tests - Automata'
          #   scan:
          #     domain: [ test ]
          #     app: [ service ]
          #     workflows: [ transitions ]
          # - title: 'Tests - Navigation'
          #   scan: 
          #     domain: [ test ]
          #     workflows: [ navigation ]
      data:
        properties: [ sheets/sprites ]
        state: [ ]
        configurations: [ assets/actions, automata/intentions, automata/goals ]
        templates: [ ]
    # --------------------------------------------
    shell:
      directory: |
        tree -L 3 --gitignore -I "build|*.so|*.png|__pycache__|__init__.py"
    # --------------------------------------------
    tests:
      pipeline:
        command: pytest -m
        marker: '"workflow_navigation or workflow_cognition or workflow_transitions"'
